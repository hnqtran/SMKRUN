afdust_adj_emf.csh:
  ADJ_PATH:
    default: ''
    description: File or directory path for adj.
  ANN_SUM:
    default: ''
    description: Path to the annual summary reporting utility script (afdust_ann_report.py)
      for fugitive dust QA.
  ASSIGNS_FILE:
    default: ''
    description: Full filepath to the SMOKE Assigns environment file. Defines paths
      for all inputs, outputs, executables, and intermediate file naming templates
      for the current platform case.
  BASE_YEAR:
    default: ''
    description: Base emissions inventory year from which projection, growth, or control
      factors are applied.
  CASE:
    default: ''
    description: Emissions modeling case or platform scenario name (e.g., 2022he_cb6_22m).
      Dictates input directories, output directories, and Assigns file configurations.
  DATECOLUMN:
    default: ''
    description: Column index number in smk_dates file corresponding to the active
      calendar date string.
  DAYS:
    default: ''
    description: Total number of episode or spinup days being processed in the current
      batch execution loop.
  DUPLIC_CHK:
    default: ''
    description: Path to the duplicate check utility script (duplicate_check.csh)
      verifying input file uniqueness.
  EMF_CLEANUP:
    default: ''
    description: Path to the EMF job cleanup helper script invoked upon run completion.
  EMF_CLIENT:
    default: ''
    description: Executable binary invoked by run scripts to transmit job completion,
      runtime logs, and exit codes to the EMF server.
  EMF_JOBID:
    default: ''
    description: The numerical database Job ID tracking this payload in the EMF.
  EMF_JOBKEY:
    default: ''
    description: Unique identifier assigned by the EMF job manager to synchronize
      status signals and progress updates with the EMF client server.
  EMF_PERIOD:
    default: ''
    description: Current temporal period or date string tracking execution progress
      and labeling EMF job status and log outputs.
  EMF_SPC:
    default: ''
    description: Abbreviation for the speciation mapping mechanism (e.g. cb6r3_ae6,
      saprc07).
  EXITSTAT:
    default: ''
    description: '$EMF_CLIENT -k $EMF_JOBKEY -m "ERROR: running domain totals for
      $date" -t "e" -x $domain_totals -p $EMF_PERIOD'
  FIRSTITERATION:
    default: ''
    description: Flag (0 or 1) tracking the initial cycle of an episodic or date-loop
      execution.
  GRID:
    default: ''
    description: Model grid abbreviation (e.g., 36US1, 12US2) that defines the output
      domain resolution, coordinate system, and NetCDF file naming conventions.
  IMD_ROOT:
    default: ''
    description: Root path for intermediate working directories.
  INDATE:
    default: ''
    description: Input simulation date parsed from date configuration files for daily
      processing.
  INFILE1:
    default: ''
    description: Primary input emissions file path passed to intermediate merge or
      conversion utilities.
  INFILE2:
    default: ''
    description: Secondary input emissions file path passed to intermediate merge
      or conversion utilities.
  INTERMED:
    default: ''
    description: Directory path where SMOKE programs write intermediate matrices and
      temporal files ([A|M|P]GMAT, [A|M|P]SMAT, [A|M|P]TMP).
  LOGS:
    default: ''
    description: Directory path where standard output and error log files for all
      executed SMOKE programs are stored.
  LOG_ANALYZER:
    default: ''
    description: Path to the log analyzer script used to audit program logs for errors
      and warnings.
  METCRO2D:
    default: ''
    description: Path to 2D meteorology NetCDF file (METCRO2D) containing surface
      meteorological variables.
  METDATE:
    default: ''
    description: Meteorology date string formatted (YYMMDD) to locate daily METCRO2D/3D
      input files.
  MET_ROOT:
    default: ''
    description: Root directory path pointing to the meteorology files (e.g., MCIP
      outputs).
  MONTHS:
    default: ''
    description: Set up months and spin-up status based on quarters
  MONTHS_LIST:
    default: ''
    description: Whitespace-separated list of month integer numbers (e.g., '1 2 3')
      driving outer batch execution loops in annual processing scripts.
  MRGDATE_FILES:
    default: ''
    description: Filepath to the merge date cross-reference list that maps each modeled
      calendar date to its corresponding representative temporal profile.
  MRGDATE_ROOT:
    default: ''
    description: Root directory path containing the merge date list files that define
      active episodic and representative dates for Smkmerge.
  MSG_LIST:
    default: ''
    description: 'set set_days = $SCRIPTS/run/set_days_v3.csh # Not needed'
  MULT:
    default: ''
    description: Path to binary multiplication tool (mult.x) used for applying adjustment
      factors.
  NAMELABEL:
    default: ''
    description: Descriptive scenario and sector text string prefixing output filenames.
  ORIG_PATH:
    default: ''
    description: File or directory path for orig.
  OUTDATE:
    default: ''
    description: Output calendar date string labeling model-ready emissions files
      and reports.
  PATH_PARSER:
    default: ''
    description: Helper script path used to parse file paths and platform directory
      tokens.
  PRECIP_ADJ:
    default: ''
    description: Path to the meteorological precipitation adjustment executable (apply_precip_adj_wrf.x).
  PREMERGED:
    default: ''
    description: Directory path where sector-specific model-ready files are staged
      prior to running sectormerge.
  REPOUT:
    default: ''
    description: Directory path where Smkreport quality assurance summaries and text
      tables are output.
  RUN_HOLIDAYS:
    default: ''
    description: Boolean (Y/N) flag. Controls holiday temporal overrides in Temporal.
      When Y, applies Sunday temporal allocation profiles to designated federal holiday
      dates.
  RUN_SECT:
    default: ''
    description: Boolean (Y/N) flag indicating whether to execute the Sect step or
      program.
  RUN_SOURCESENS:
    default: ''
    description: Boolean (Y/N) flag indicating whether to execute the Sourcesens step
      or program.
  SCRIPTS:
    default: ''
    description: Directory path to the root of the SMOKE run scripts.
  SECTOR:
    default: ''
    description: Source category sector abbreviation (e.g., ptegu, onroad, nonroad,
      rwc). Directs script branch logic, inventory selection, assigns file loading,
      and output prefixes.
  SET_DAYS:
    default: ''
    description: Path to the day configuration helper script (set_days_v5.csh).
  SET_MONTHS:
    default: ''
    description: Path to the month configuration helper script (set_months_v4.csh).
  SMK_DAT:
    default: ''
    description: come up twice, once at the start of the run for spinup, and then
      again at the end of the base year.
  SPIN:
    default: ''
    description: we know to use a spinup year if the first month = 12 and SPINUP_DURATION
      > 0.
  SPINUP_ARRAY:
    default: ''
    description: Spin-up period parameter (array) used to configure the model initialization
      window prior to the formal simulation start date.
  SPINUP_DURATION:
    default: ''
    description: Number of initialization days run prior to the episode start date
      to allow atmospheric concentrations to stabilize in CMAQ/CAMx before formal
      analysis.
  SPINUP_LIST:
    default: ''
    description: Whitespace-separated list of YYYYMMDD dates denoting spin-up days.
  SUFFIX:
    default: ''
    description: Record the helper scripts being used
  S_YEAR:
    default: ''
    description: we know to use a spinup year if the first month = 12 and SPINUP_DURATION
      > 0.
  TIMELOG:
    default: ''
    description: Filepath to the runtime tracking log. Populated by the timetracker
      utility to record start, end, and duration metrics for each executed SMOKE program.
  TIMELOG_YN:
    default: ''
    description: Boolean (Y/N) flag. When Y, enables the timetracker utility to monitor
      and record CPU and wall-clock execution time for each SMOKE program.
  TIMETRACKER:
    default: ''
    description: Path to the runtime execution time logging utility script (timetracker_v2.csh).
  WRF_VERSION:
    default: ''
    description: Weather Research and Forecasting (WRF) model version number (e.g.,
      3 or 4) used for met inputs.
  XPORTFRAC:
    default: ''
    description: Filepath pointing to transport fraction cross-reference files.
  YEAR:
    default: ''
    description: Target modeling calendar year. Governs inventory year selection,
      leap-year temporal calculations, and day-of-week matching in Temporal.
