    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PNTS_O:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Spcmat , and Temporal'
  PTINV_O:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: Smkinven See Chapter 6, SMOKE Input Files for the formats of the ARINV , MBINV , and PTINV files.'
  SMK_GRWIDAOUT_YN:
    default: N
    description: 'Indicates if an ORL-formatted grown and/or controlled inventory should be output. Currently only ORL nonpoint ond point inventory formats are supported. SMK_GRWORLOUT_YN and cannot be both set to Y in the same run. In SMOKE version 2.3, the Grwinven ORL output format was changed to use a more compact structure (eliminated spaces), uses commas, and includes semi-colons around all text fields. These changes make these files much smaller and easier to import to other software, but unfortunately harder to read in a text editor. Y: Output inventory in ORL format N: Do not output inventory in ORL format'
  SMK_GRWORLOUT_YN:
    default: N
    description: 'Indicates if an ORL-formatted grown and/or controlled inventory should be output. Currently only ORL nonpoint ond point inventory formats are supported. SMK_GRWORLOUT_YN and SMK_GRWIDAOUT_YN cannot be both set to Y in the same run. In SMOKE version 2.3, the Grwinven ORL output format was changed to use a more compact structure (eliminated spaces), uses commas, and includes semi-colons around all text fields. These changes make these files much smaller and easier to import to other software, but unfortunately harder to read in a text editor. Y: Output inventory in ORL format N: Do not output inventory in ORL format'
  SMK_GRWSMKOUT_YN:
    default: Y
    description: 'Y: Output inventory in SMOKE I/O API format N: Do not output inventory in SMOKE I/O API format'
  SMK_NUM_CTLMAT:
    default: '1'
    description: Number of control and/or growth matrices to import and apply to the inventory.
  SMK_TMPDIR:
    default: .
    description: Defines the path to use for temporary files that are written out when supplying the inventory.
  USE_EXP_GEO_CODES:
    default: N
    description: If set to Y then use GEOCODE_LEVEL[1-4] files instead of the COSTCY file to define expanded geographical detail such as country-level(GEOCODE_LEVEL1), country/state-level (GEOCODE_LEVEL2), country/state/county-level (GEOCODE_LEVEL3) or country/state/county/tribal-level (GEOCODE_LEVEL4).
laypoint:
  EXPLICIT_PLUMES_YN:
    default: N
    description: 'Indicates whether only explicit plume rise sources should be calculated. Y: Process only explicit plume rise sources; automatically sets HOUR_PLUMEDATA_YN to Y N: Process all sources'
  FIRE_AREA:
    default: '0.0'
    description: Sets daily area burned in acres/day; only used when FIRE_PLUME_YN is set to Y and HOURLY_FIRE_YN is set to N.
  FIRE_BOTTOM_LAYER_1_YN:
    default: N
    description: Enforcing fire emissions vertical allocation starting from modeling layer 1 to Brigg's fire plume height top layer.
  FIRE_HFLUX:
    default: '0.0'
    description: Sets hourly heat flux value in BTU/hr; only used when FIRE_PLUME_YN is set to Y and HOURLY_FIRE_YN is set to N.
  FIRE_PLUME_YN:
    default: '0.0'
    description: Sets daily area burned in acres/day; only used when is set to Y and HOURLY_FIRE_YN is set to N.
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  GRID_CRO_3D:
    default: ''
    description: (File) Meteorology file produced by the meteorology preprocessor; only needed if using static layer information
  HOURLY_FIRE_YN:
    default: '0.0'
    description: Sets daily area burned in acres/day; only used when FIRE_PLUME_YN is set to Y and is set to N.
  HOUR_PLUMEDATA_YN:
    default: N
    description: 'Indicates whether only explicit plume rise sources should be calculated. Y: Process only explicit plume rise sources; automatically sets to Y N: Process all sources'
  IOAPI_ISPH:
    default: '19'
    description: Determines which USGS spheroid to use for grid-based calculations This environment variable can also be used to set custom spheroid representations. See the I/O API documentation for more information.
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Laypoint
  MET_CRO_2D:
    default: ''
    description: (File) Meteorology file produced by the meteorology preprocessor
  MET_CRO_3D:
    default: ''
    description: (File) Meteorology file produced by the meteorology preprocessor
  MET_DOT_3D:
    default: ''
    description: (File) Meteorology file produced by the meteorology preprocessor
  PDAY:
    default: N
    description: 'Indicates if hourly fire data should be used; only checked when FIRE_PLUME_YN is set to Y. Y: Read hourly heat flux from PTMP file and daily area burned from file N: Get heat flux and area burned from environment variables FIRE_AREA and FIRE_HFLUX'
  PELV:
    default: N
    description: 'Defines whether the Elevpoint output file will be used to set elevated sources. Y: Use the PELV file to set elevated sources during run N: Let Laypoint plume rise calculation determine whether or not sources are elevated'
  PHOUR:
    default: N
    description: 'Indicates whether hourly plume rise data should be used. Y: Use hourly data; requires file N: Do not use hourly data'
  PLAY:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PLAY_EX:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PLUME_GTEMP_NAME:
    default: TEMP2
    description: Sets ground temperature variable name from meteorology file for plume rise calcuation.
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PTMP:
    default: N
    description: 'Indicates if hourly fire data should be used; only checked when FIRE_PLUME_YN is set to Y. Y: Read hourly heat flux from file and daily area burned from PDAY file N: Get heat flux and area burned from environment variables FIRE_AREA and FIRE_HFLUX'
  REPRTLAY:
    default: ''
    description: (File) Report file for plumes exceeding specified layer
  REP_LAYER_MAX:
    default: '-1'
    description: Layer number for reporting high plume rise; reporting is turned off if set to less than 1.
  SMK_EMLAYS:
    default: '-1'
    description: Number of emissions layers; must be at least 4 otherwise program will not run.
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  SMK_SPECELEV_YN:
    default: N
    description: 'Defines whether the Elevpoint output file PELV will be used to set elevated sources. Y: Use the PELV file to set elevated sources during run N: Let Laypoint plume rise calculation determine whether or not sources are elevated'
  USE_EDMS_DATA_YN:
    default: N
    description: 'Process EDMS aviation source elevation height as its plume rise and distributes the emissions into the layer where it belongs to. Y: Skip plume rise calculation and distribute EDMS aviation emissions into the layer where it belongs to using its elevation height. N: Do not process EDMS aviation sources'
  VELOC_RECALC:
    default: N
    description: 'Determines whether velocity should be recalculated based on hourly flow rates and stack diameter. Y: Recalculate velocity for hourly data N: Use velocity values from hourly inventory file'
  VERTICAL_SPREAD:
    default: '0'
    description: 'Sets the vertical spread method for determining the bottom and top heights of each plume. 0: Use the default Turner approach where plume thickness equals the amount of plume rise 1: Compute vertical spread using ambient temperature data'
met4moves:
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  ENDDATE:
    default: '0'
    description: Sets the overall episode end date; Julian format (YYYYDDD).
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  LOGFILE:
    default: ''
    description: '(File) '
  MCXREF:
    default: ''
    description: "(File) Mobile representative county cross-reference file. The MCXREF file is a list-directed file used to assign representative counties to inventory counties. Its format is shown in Table 6.63, \u201CFormat for MCXREF \u201D . Example 6.3. MCXREF file 0 13 101 0 13 121 0 13 102 0 13 121 0 13 103 0 13 121 0 13 121 0 13 121 0 13 123 0 13 217 0 13 125 0 13 217 0 13 127 0 13 217 0 13 015 0 13 217 0 13 017 0 13 217 0 13 019 0 13 217 .. .. .. .. .. .."
  METLIST:
    default: ''
    description: "(File) List of meteorology files. The METLIST file is used to provide the file names of available meteorology files to the Met4moves programs. Met4moves runs once for the entire modeling episode, and therefore needs all of the files at one time. The meteorology files provided to Met4moves must cover the desired episode and contain the requested variables. In the example SMOKE scripts, this file is generated automatically. The format of this file is shown in Table 6.55, \u201CFormat for METLIST \u201D ."
  MFMREF:
    default: ''
    description: "(File) Mobile fuel month file for MOVES. The MFMREF file specifies reference fuel months to assign to calendar months being simulated for each representative county. The file specifies the representative month where the fuel formulation mix is representative for other months. The file serves the purpose of grouping months of the year by fuel parameters. The format of the MFMREF file shown in Table 6.65, \u201CFormat for MFMREF \u201D . Example 6.6. MFMREF file 013121 1 1 013121 1 2 013121 4 3 013121 4 4 013121 6 5 013121 6 6"
  MIN_NO_RH_BY_TEMPBIN:
    default: '1'
    description: Defines the minimum number of data point for computing averaged RH by tempearature bin
  MOVES_OUTFILE:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: MOVES Driver Script The output file created by Met4moves for RPP mode in the MOVES driver script contains the absolute minimum and maximum temperatures, and sets of 24 hour diurnal temperature profiles based on combinations of min/max temperature bins for all representative counties by temperature bin.'
  MOVES_RH_OUTFILE:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: MOVES Driver Script The output file created by Met4moves program for RPD, RPV and RPH modes in both MOVES and SMOKE models contains fuel month-specific min and max temperatures, and averaged RH values in local time for all representative counties by temperature bin.'
  PD_TEMP_INCREMENT:
    default: '5'
    description: Defines the temperature increment (in deg. F) for RPD lookup table to create combinations of min/max temperature bins
  PH_TEMP_INCREMENT:
    default: '5'
    description: Defines the temperature increment (in deg. F) for RPH and RPHO lookup table to create combinations of min/max temperature bins
  PP_TEMP_INCREMENT:
    default: '10'
    description: Defines the temperature increment (in deg. F) for RPP lookup table to create combinations of min/max temperature bins
  PV_TEMP_INCREMENT:
    default: '5'
    description: Defines the temperature increment (in deg. F) for RPV and RPS lookup table to create combinations of min/max temperature bins
  QVARNAME:
    default: QV
    description: Specifies the variable name for the specific humidity to the NOx humidity correction.
  SMOKE_OUTFILE:
    default: ''
    description: '(File) '
  SPECIFIC_HUMIDITY_YN:
    default: N
    description: Defines whether compute specific humidity instead of relative humidity
  SRGDESC:
    default: ''
    description: "(File) Surrogate Designation, Description and Surrogate profile filename.. The Surrogate Description file is used to designate the regional location of the surrogate, the surrogate code number, a brief description of the code number and the Area and Mobile spatial surrogate file in which surrogate profile can be found. This file is located in SRGPRO_PATH . See Figure 4.4, \u201C Grdmat input and output files\u201D . The format of the SRGDESC file is shown in Table 6.37, \u201CFormat for SRGDESC \u201D ."
  SRGPRO_PATH:
    default: N
    description: Defines the location of spatial surrogate files.
  SRG_LIST:
    default: N
    description: 'Specifies the code(s) of the spatial surrogate(s) to be used in selecting the grid cells for the county (example: setenv SRG_LIST ''100,230'').'
  STDATE:
    default: '0'
    description: 'This environment variable sets the overall episode start date: Julian format (YYYYDDD) for Movesmrg .'
  SURROGATE FILE(S):
    default: ''
    description: (File) Surrogate file(s) selected by SRG_LIST
  TEMP_BUFFER_BIN:
    default: '0.0'
    description: "Defines the temperature buffer value (\xB0F). This value will allow Met4moves to expand the min/max temperature range for MOVES RPP processing. If TEMP_BUFFER_BIN is set to 10.0, the original max temperature which is 90.0\xB0F will be treated as 100.0\xB0F, and minimum temperaure (=30\xB0F) will be treated as 20.0\xB0F internally in Met4moves ."
  TVARNAME:
    default: TEMP2
    description: Specifies the variable name for the temperature to estimate the emission factor from the MOVES emission factors lookup tables.
  USE_EXP_GEO_CODES:
    default: N
    description: If set to Y then use GEOCODE_LEVEL[1-4] files instead of the COSTCY file to define expanded geographical detail such as country-level(GEOCODE_LEVEL1), country/state-level (GEOCODE_LEVEL2), country/state/county-level (GEOCODE_LEVEL3) or country/state/county/tribal-level (GEOCODE_LEVEL4).
movesmrg:
  =SMOKE_OUTFILE):
    default: ''
    description: (File) Meteorology file from Met4moves
  APPLY_NOX_HUMIDITY_ADJ:
    default: N
    description: 'Allows Movesmrg to apply NOx humidity correction to gridded hourly NOx emissions for RPD, RPS, RPH, and RPHO runs. If there is a header "HUMIDITY_ADJUSTED_NOX Y" listed in the MOVES lookup tables, it means that NOx emissions in those MOVES lookup tables are already adjusted and this flag will be overwritten to N. No NOx humidity correction will be applied. Y: Apply NOx humidity correction to non-NOx humidity correction applied MOVES lookup tables from RPD, RPH, RPS, and RPHO runs. N: Do not apply NOx humidity correction.'
  CFPRO:
    default: ''
    description: "(File) Mobile source control factor input file. The CFPRO file is used to allow the user to apply factors to Movesmrg to control hourly emission rates from all MOVES lookup tables (i.e., RatePerDistance, RatePerVehicle, RatePerHour, and RatePerProfile). Its format is shown in Table 6.62, \u201CFormat for CFPRO \u201D . A many-step hierarchy is used in applying the control factor cross-referencing. SMOKE preferentially matches each source to the most specific match in the file. The maximum field width in SMOKE and its input files for SCC is 20 characters as of SMOKE v4.0. The 8 or 10 digit SCC are still supported, but if the SCC is greater than 10 digits the SCC hierarchial approach will not be supported. Country/state/county code, 10-digit SCC, month, and pollutant Country/state/county code, 10-digit SCC, and month Country/state/county code, 10-digit SCC, and pollutant Country/state/county code, and 10-digit SCC Country/state code, 10-digit SCC, month, and pollutant Country/state\
      \ code, 10-digit SCC, and month Country/state code, 10-digit SCC, and pollutant Country/state code, and 10-digit SCC 10-digit SCC, month, and pollutant 10-digit SCC, and month 10-digit SCC, and pollutant 10-digit SCC Country/state/county code, month, and pollutant Country/state/county code, and month Country/state/county code, and pollutant Country/state/county code Country/state code, month, and pollutant Country/statecode, and month Country/state code, and pollutant Country/state code Ultimate default (no pollutant, no month, country/state/county code = 0, SCC = 0) Example 6.2. CFPRO file 13101,2201000330,CO,7,0.5 13101,2201000330,TOG,7,0.5 13102,2201000330,TOG,7,0.5"
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  INVTABLE:
    default: ''
    description: "(File) Inventory table. The INVTABLE file replaces the SIPOLS and ACTVNAMS files previously used by SMOKE. Smkinven uses the inventory table to select the inventory pollutants that will be output by Smkinven . The valid pollutants are again checked at the end of SMOKE processing by Smkmerge , to ensure that the program knows about all of the pollutants and also to set the order of the output variables (output species are sorted by the order of the pollutants in the inventory table and for multiple species per pollutant, by alphabetical order). You can use the INVTABLE to drop inventory pollutants in Smkinven without having to modify the inventory files, simply by modifying INVTABLE . The units used in the SMOKE intermediate files are listed in this file. The SMOKE programs Spcmat , and Movesmrg use this file to determine which pollutants should be included in the NONHAPVOC or NONHAPTOG calculation. The inventory table also provides a way to assign the SPECIATE4 species\
      \ ID to any pollutant that is a Hazardous Air Pollutant (HAP) VOC. This assignment is not used directly by SMOKE, but rather is used by the Speciation Tool when creating VOC speciation profiles. This is used only when creating speciation profiles to support SMOKE runs that will combine criteria VOC and HAP VOC emissions, using the NHAPEXCLUDE file in the Smkinven program. More specifically, this can be done for the purpose of using VOC HAP emissions to augment VOC speciation profiles. Since the Inventory Table provides information to the Speciation Tool, this field is not used by SMOKE, but is included for continued integration of SMOKE inputs with the Speciation Tool. As described in the Smkinven documentation in Chapter 6, Smkinven in some cases will create \"no-integrate\" (NOI) HAP pollutant emissions from the inventory data by renaming the pollutant with a \"_NOI\" suffix applied to the end of the Inventory Data Name from the Inventory Table for such pollutants. Similarly, Smkinven\
      \ will automatically add all possibly needed \"_NOI\" pollutant names to the internal master list of valid pollutant names. This list would otherwise be limited to the contents of the INVTABLE file entries where the Keep column contains an \"Y\". Smkinven inserts these names in the master list such that the \"_NOI\" version of the pollutant name appears in the list just after the polutant on which the name is based. The inserted entries that include \"_NOI\" are made when the following values are included for the pollutant in the INVTABLE file. A \"Y\" appears in the \"Keep\" field A \"V\" or \"T\" appears in the \"VOC or TOG component\" field A \"Y\" appears in the \"Model species\" field Something other than \"Y\" appears in the \"Explicit in mechanism\" field (e.g., \"N\" or blank) It is possible for a user to choose two pollutants that result in double counting the emissions from the inventory. For example, you may want to model both benzo(a)pyrene and 7-PAH which, would result\
      \ in the emissions associated with CAS number 205992 (for benzo(a)pyrene) to be duplicated. The user is responsible for the choices made and the resulting changes in inventory mass. The format of the INVTABLE is shown in Table 6.91, \u201CFormat for INVTABLE \u201D . The columns in the INVTABLE are used as follows: Inventory data name: Unique name for pollutant or activity that will be stored and processed by SMOKE. Because of I/O API restrictions, these names can only include alphanumeric characters and underscores, and the first character must be a letter. In addition, because SMOKE uses double-underscore as a separator when appending to variable names, no double-underscores are permitted in these names. Mode: This three-letter code represents the emissions mode that SMOKE uses to augment the pollutant names. Emissions mode usually refers to the on-road or nonroad mobile exhaust or evaporative emissions. If present in a record of the Inventory Table, SMOKE will combine the Mode field\
      \ with the Inventory Data Name field using a double underscore. So, if the Inventory Data Name is \"VOC\" and the Mode is \"EXH\", then the pollutant name in SMOKE intermediate files will be stored as \"EXH__VOC\". Inventory Pollutant Code: This code represents the pollutant that is provided in the inventory file input into SMOKE, and is sometimes the Chemical Abstracts Service (CAS) number when the inventory uses CAS numbers to identify pollutants. Smkinven matches this code to a ORL-formatted inventory file to assign the combination of Mode and Inventory Data Name (columns 2 and 1 as described in the previous bullet), which is used in all subsequent SMOKE intermediate files and reports. This code is not used by SMOKE in any other way. SPECIATE4 ID: The SPECIATE4 ID is the unique species identifier in SPECIATE4 (the \"ID\" field in the SPECIES_PROPERTIES table). This code is not used by SMOKE, but rather is used during import of the Inventory Table to the Speciation Tool. Reactivity\
      \ group: The reactivity group for the ASPEN model. It is not used in SMOKE. Keep: Indicates whether SMOKE should keep the CAS number associated with this inventory data name. SMOKE will keep any inventory data with at least one CAS number with a Y. Factor: The adjustment factor to use in splitting the emissions associated with a CAS number into different inventory data names, or reducing the mass of a metal compound associated with a CAS number to account for the metal mass only. VOC or TOG component: A \u201C V \u201D should be entered if the CAS number is part of VOC emissions or TOG emissions. A \u201C T \u201D should be entered if the CAS number is part of TOG emissions only. An \u201C N \u201D should be entered if the CAS number is part of neither VOC or TOG. Any other value other than \u201C V \u201D or \u201C T \u201D will be treated as an \u201C N \u201D. Model species: A \u201C Y \u201D should be entered if the pollutant is also a VOC model species for the AQM being targeted\
      \ for the run. Any other values will be treated as an \u201C N \u201D. Explicit in mechanism: A \u201C Y \u201D should be entered if (1) the pollutant is a VOC species (the model-species column must be \u201C Y \u201D as well), and (2) that model-species is explicitly treated in the AQM\u2019s chemical mechanism. The pollutant can be an explicit species in the chemical mechanism only when the GSPRO file definitions of the lumped VOC species have been adjusted to account for the pollutants/species that are explicit in the mechanism. The current explicit-in-mechanism species being used in the toxics CB6 mechanism for CMAQ are formaldehyde, acetaldheyde, acrolein and 1,3 butadiene. Activity: A \u201C Y \u201D should be entered if the inventory data name is a type of activity instead of emissions. Any other values will be treated as an \u201C N \u201D. NTI: Code identifying a HAP on the Clean Air Act HAP list (list of 188 HAPs). Not currently used by SMOKE; will be used in the future for\
      \ growing HAP emissions to future years. Units: The units to store the data in the SMOKE intermediate files. This should be \u201C short tons/year \u201D for emissions values, \u201C miles/year \u201D for VMT, and \u201C miles/hr \u201D for speed. Although this is provided as an input field to allow possible future changes, these values should not be changed by the user and are unrelated to the units of the emissions in the input files. Inventory data descriptions: This is the description of the inventory data name listed in columns 1-11. CAS pollutant description: Describes the pollutant that is coming from the inventory that is being input into SMOKE."
