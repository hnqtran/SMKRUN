  MTPRO_HOURLY:
    default: ''
    description: '(File) Day-to-Hour Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  MTPRO_HOURLY_NCF:
    default: ''
    description: (File) Hourly Temporal Profiles. This NetCDF hourly temporal profiles input file contains annual total ( ANNTOT ), monthly total ( MONTOT ), daily total ( DAYTOT ) and hourly total ( HRLTOT ) to compute year-to-hour, month-to-hour, day-to-hour profiles to calculate hourly total depending on types of inventory data (annual, monthly or daily inventory). If inventory is annual total, year-to-hour profiles will be used to convert annual total to hourly total emissions. If inventory is monthly total, month-to-hour profiles will be used to compute hourly total from monthly total inventory.
  MTPRO_MONTHLY:
    default: ''
    description: '(File) Year-to-Month Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  MTPRO_WEEKLY:
    default: ''
    description: '(File) Month-to-Week Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  MTREF:
    default: blank
    description: "Defines the base of hourly temporal profiles. This flag is only applicable when hourly temporal profiles generated by Gentpro is available for Temporal to use. For a proper processing of hourly temporal profiles from Gentpro , user must let Temporal know the basis of hourly temporal profiles (i.e., hour of day, hour of month or hour of year). Gentpro outputs hourly temporal profiles IDs into temporal cross-reference input file ( ). See detail information at Section 6.3.2, \u201C [A|M|P]TREF : Temporal cross-reference file\u201D . If HOUR_PROFID column is filled by Gentpro , user must define the base of hourly profiles to correctly convert annual/monthly/daily inventories. If processing monthly inventory, user must set it to 'MONTH'. YEAR: Convert raw annual inventory to hourly inventory values. MONTH: Convert calculated monthly inventory to hourly inventory values."
  MTSUP:
    default: ''
    description: (File) Temporal allocation supplemental file
  OUTPUT_LOCAL_TIME:
    default: N
    description: 'Defines whether the program processes daily/hourly inventories in local time or not. Y: Process daily/hourly inventories in local time. No time zone shift. N: Apply time zone shift.'
  OUTZONE:
    default: '0'
    description: "Indicates offset from Greenwich Mean Time (GMT) for episode start date and time. OUTZONE should be set to the standard time for the time zone of interest; SMOKE will adjust to Daylight Saving time for episodes that are during periods and in regions where Daylight Saving time applies. Table 2.9, \u201CExample OUTZONE settings and their associated time zones\u201D provides allowed values for OUTZONE . The CMAQ model expects OUTZONE to be 0, while other models such as UAM-IV, UAM-V and CAM X often use time zone 5. All models expect that the emissions and the meteorology data provided to the model will have a consistent time zone. SMOKE expects that the meteorology data will be in GMT. Note that SMOKE expects OUTZONE to be set as a positive number for time zones in the Western Hemisphere, although standard notation would list these as negative values. For example, Eastern Standard Time is -5:00 hours from GMT, but OUTZONE for EST in SMOKE is 5."
  PDAY:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Laypoint and Temporal'
  PHOUR:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Laypoint and Temporal'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PROCDATES:
    default: ''
    description: "(File) Procdates date list. SMOKE can process specific sequential or non-seqential days of the year. The PROCDATES file is used to indicate which days should be processed temporally. The format of this file is shown in Table 6.36, \u201CFormat for PROCDATES \u201D ."
  PTMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PTPRO_DAILY:
    default: ''
    description: '(File) Month-to-day Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  PTPRO_HOURLY:
    default: ''
    description: '(File) Day-to-Hour Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  PTPRO_HOURLY_NCF:
    default: ''
    description: (File) Hourly Temporal Profiles. This NetCDF hourly temporal profiles input file contains annual total ( ANNTOT ), monthly total ( MONTOT ), daily total ( DAYTOT ) and hourly total ( HRLTOT ) to compute year-to-hour, month-to-hour, day-to-hour profiles to calculate hourly total depending on types of inventory data (annual, monthly or daily inventory). If inventory is annual total, year-to-hour profiles will be used to convert annual total to hourly total emissions. If inventory is monthly total, month-to-hour profiles will be used to compute hourly total from monthly total inventory.
  PTPRO_MONTHLY:
    default: ''
    description: '(File) Year-to-Month Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  PTPRO_WEEKLY:
    default: ''
    description: '(File) Month-to-Week Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  PTREF:
    default: blank
    description: "Defines the base of hourly temporal profiles. This flag is only applicable when hourly temporal profiles generated by Gentpro is available for Temporal to use. For a proper processing of hourly temporal profiles from Gentpro , user must let Temporal know the basis of hourly temporal profiles (i.e., hour of day, hour of month or hour of year). Gentpro outputs hourly temporal profiles IDs into temporal cross-reference input file ( ). See detail information at Section 6.3.2, \u201C [A|M|P]TREF : Temporal cross-reference file\u201D . If HOUR_PROFID column is filled by Gentpro , user must define the base of hourly profiles to correctly convert annual/monthly/daily inventories. If processing monthly inventory, user must set it to 'MONTH'. YEAR: Convert raw annual inventory to hourly inventory values. MONTH: Convert calculated monthly inventory to hourly inventory values."
  PTSUP:
    default: ''
    description: (File) Temporal allocation supplemental file
  RENORM_TPROF:
    default: Y
    description: 'Defines whether Temporal normalizes the temporal profiles or uses them as they exist in the data file. If the profiles are specified as decimal values and sum to 1, then specify N. Otherwise, specify Y and the program will sum the values associated with each profile and then divide each value by the sum, thereby creating a normalized profile. Y: Normalize the temporal profiles N: Use the temporal profile values as they exist in the data file'
  REPORT_DEFAULTS:
    default: Y
    description: 'Defines whether or not the program reports when a source uses the default cross-reference. Y: List sources in the log file when they use default cross-reference N: Do not list sources that use the default cross-reference.'
  SMK_AVEDAY_YN:
    default: N
    description: 'Indicates whether or not to read average day emissions instead of annual emissions from the inventory file. Y: Read average day emissions N: Do not read average day emissions, use annual emissions instead. NOTE: This setting affects the Smkmerge results only when hourly emissions are not merged. To use hourly average-day emissions in Smkmerge , this variable must be set to Y for the Temporal program, so that average-day emissions will be used in creating the hourly emissions.'
  SMK_EF_MODEL:
    default: blank
    description: 'Name of the emission factor model to use. NOTE: User must set it to MOVES when processing activity inventory data (i.e., VMT, VPOP and SPEED).'
  SMK_MAXERROR:
    default: '100'
    description: Defines the maximum number of ERROR statements to be displayed by SMOKE.
  SMK_MAXWARNING:
    default: N
    description: 'Indicates if Smkinven should permit negative emissions values to be input from inventory files and output to SMOKE intermediate files. Y: Accept negative emissions values and will allow compute variables (from the SMKINVEN_FORMULA variable) to be negative. Smkinven gives warnings for each negative value in the inventory input and each computed value, until triggering the setting''s values. N: Do not permit negative emissions values. Accept negative emissions values in the input inventory files, and will give errors for these. Smkinven will reset all negative computed values (from the SMKINVEN_FORMULA variable) to zero. Smkinven gives warnings for each negative computed value and indicates that the value was reset to zero.'
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  UNIFORM_TPROF_YN:
    default: N
    description: 'Defines whether to use uniform temporal profiles for all sources. Y: Use uniform temporal profiles N: Use temporal profiles file and temporal cross-reference file'
  USE_EXP_GEO_CODES:
    default: N
    description: If set to Y then use GEOCODE_LEVEL[1-4] files instead of the COSTCY file to define expanded geographical detail such as country-level(GEOCODE_LEVEL1), country/state-level (GEOCODE_LEVEL2), country/state/county-level (GEOCODE_LEVEL3) or country/state/county/tribal-level (GEOCODE_LEVEL4).
  ZONE4WM:
    default: Y
    description: "Defines whether Temporal applies weekly and monthly temporal profiles using time zones. If SMOKE does not apply the profiles using the sources\u2019 time zones, then all sources change from one day to the next or one month to the next at the same hour. This is what other emission processing systems have typically done, and it is a minor distinction in most cases. Y: Use time zones N: Do not use time zones"
tmpbeis3:
  B3GRD:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Used by: Tmpbeis3 Table 7.25, \u201CVariables in B3GRD for BEIS version 3.14\u201D contains names and descriptions of variables in the B3GRD output file form Normbeis3 , BEIS3. For BEIS version 3.14, Normbeis3 calculates normalized emissions for both the summer and winter seasons. For nitric acid (NO) calculations, however, emissions depend on a given grid cell\u2019s land use category (or categories). For agricultural land use portions of a grid cell, a determination is made of whether the given day is in the growing season or the non-growing season. The appropriate emissions factor is then applied to the NO emissions calculations. The agricultural land use categories USGS Cropgrass (a cropland/grassland mosaic) and USGS Cropwoodland (a cropland/woodland mosaic) represent grid cells with mixed vegetation and only half the area is assumed to be covered by crops. Accordingly, the corresponding emissions factors for these\
      \ two categories are multiplied by 0.5 for NO calculations. (Note that the USGS Drycrop and USGS Irrcrop land use categories assume the vegetation is all crop.) For the non-growing season in agricultural areas, the emissions factor for the USGS Grassland land use category is used for NO emission calculations. Finally, for non-agricultural areas, the USGS Grassland emissions factor is used all year round. Table 9.21b contains the names and descriptions of variables in the B3GRD output file from Normbeis3 , BEIS version 3.14"
  B3GTS_L:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Used by: Mrggrid and Smkmerge These files are model-ready output, but can be input into Mrggrid or Smkmerge to be combined with other source category model-ready files. See Section 8.7.1, \u201C B3GTS_L and B3GTS_S \u201D for format information."
  B3GTS_S:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Used by: Mrggrid and Smkmerge These files are model-ready output, but can be input into Mrggrid or Smkmerge to be combined with other source category model-ready files. See Section 8.7.1, \u201C B3GTS_L and B3GTS_S \u201D for format information."
  BEIS_VERSION:
    default: '3.60'
    description: 'Specifies which version of BEIS3 to use. 3.60: Use BEIS version 3.60. 3.14: Use BEIS version 3.14.'
  BG_CLOUD_TYPE:
    default: '1'
    description: 'Specifies which meteorological data to use. 1: Use RGND or RSD (solar radiation reaching the ground) from MM5 to calculate PAR. No other options are supported at this time.'
  BIOG_SPRO:
    default: BV310
    description: 'Specifies the speciation profile for biogenic emissions from GSPRO. B3V10: Use BEIS version 3.60. BV313: Use BEIS version 3.14.'
  BIOMET_SAME:
    default: N
    description: Defines whether the radiation/cloud data are in the same file as the temperature data ( MET_FILE1 ) or in a different file ( MET_FILE2 ).
  BIOSEASON:
    default: Y
    description: 'Indicates whether to use a gridded seasonal switch file. Y: Use gridded seasonal switch file N: Use environment variable SUMMER_YN to determine season'
  BIOSW_YN:
    default: Y
    description: 'Indicates whether to use a gridded seasonal switch file. Y: Use gridded seasonal switch file BIOSEASON N: Use environment variable SUMMER_YN to determine season'
  GRID_CRO_2D:
    default: ''
    description: (File) Meteorology file containing latitude and longitude coordinates for each grid cell
  GSPRO:
    default: ''
    description: "(File) Speciation profile file. The speciation profile file, GSPRO , contains the factors that are used to separate aggregated inventory pollutant emissions totals into emissions of model species required by the AQM. In traditional ozone air quality modeling, this file contained split factors only for VOC. In SMOKE, all inventory pollutants need to be represented in this file, even if it is only to indicate that a pollutant is not split into any model species (e.g., CO emissions would have a \u201C split factor \u201D of 1.0). The format of the GSPRO file is shown in Table 6.41, \u201CFormat for GSPRO \u201D . For support of combining criteria and toxic VOC using the NONHAPVOC calculation feature of SMOKE, the GSPRO file (starting in version 2.3 of SMOKE) includes a special header that defines the meaning of NONHAPVOC. This is the new #NHAP header, described below. This header keyword will be treated as a comment line by previous versions of SMOKE. The header lines define\
      \ NONHAPVOC (and/or NONHAPTOG) by listing all of the VOC compounds that were assumed to be removed from VOC (or TOG) when the speciation profile factors for NONHAPVOC (or NONHAPTOG) were calculated. When using this file, Spcmat compares this list with the list from the Inventory Table (\"VOC or TOG Component\" field = V or T and \"Explicit in Mechanism = \"N\"). This new header is included in this file so that the file is self-describing with respect to the definition of NONHAPVOC and NONHAPTOG. The format supports header lines (using a # symbol in position 1 of any line) in any part of the file. The columns are used by SMOKE as follows: The speciation profile number is matched with the number in the GSREF file. This \u201C number \u201D is treated as a character string, so leading zeros must be the same in both the GSPRO and GSREF files. The pollutant ID must match the pollutant names in the SMOKE inventory file ( AREA , MOBL , or PNTS ). These names are set by the #POLID or #DATA\
      \ headers in the Smkinven input files. The species IDs are the names of the model species needed by the AQM for which SMOKE is being used. These depend on the requirements of that model. The example SMOKE inputs will not be correct for all AQMs. The split factor is the numerator in the factor computed for the mole-based speciation matrix. The divisor is the denominator in the factor computed for the mole-based speciation matrix. The mass fraction is the value put in the mass-based speciation matrix. The ratio of the mass fraction and the split factor is the average molecular weight for the species and profile, if the divisor is 1."
  INITIAL_RUN:
    default: N
    description: "Indicates whether a particular day is the first day in a sequence of simulations. Y: Use for the first day in a sequence of simulations. Use if the SOILINP file does not yet exist (i.e., the soil NO calculations will not depend on the previous day\u2019s rainfall). N: Use for subsequent days in a sequence of simulations. Use if the SOILINP file exists. Note that BEIS3 will create a SOILINP file for days subsequent to the first day in a sequence of simulations."
  ISLTYP_VAR:
    default: SLTYP
    description: Specifies the soil type variable name used if PX_VERSION = Y.
  LAI_VAR:
    default: LAI
    description: Specifies the variable name for the leaf area index from the me model (e.g. WRF) used for the leaf temperature algorithm (Only for BEIS version 3.60)
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Tmpbeis3
  MET_FILE1:
    default: N
    description: Defines whether the radiation/cloud data are in the same file as the temperature data ( ) or in a different file ( MET_FILE2 ).
  MET_FILE2:
    default: N
    description: Defines whether the radiation/cloud data are in the same file as the temperature data ( MET_FILE1 ) or in a different file ( ).
  OUTZONE:
    default: '0'
    description: "Indicates offset from Greenwich Mean Time (GMT) for episode start date and time. OUTZONE should be set to the standard time for the time zone of interest; SMOKE will adjust to Daylight Saving time for episodes that are during periods and in regions where Daylight Saving time applies. Table 2.9, \u201CExample OUTZONE settings and their associated time zones\u201D provides allowed values for OUTZONE . The CMAQ model expects OUTZONE to be 0, while other models such as UAM-IV, UAM-V and CAM X often use time zone 5. All models expect that the emissions and the meteorology data provided to the model will have a consistent time zone. SMOKE expects that the meteorology data will be in GMT. Note that SMOKE expects OUTZONE to be set as a positive number for time zones in the Western Hemisphere, although standard notation would list these as negative values. For example, Eastern Standard Time is -5:00 hours from GMT, but OUTZONE for EST in SMOKE is 5."
  OUT_UNITS:
    default: '1'
    description: 'Specifies units for the output variables. 1: moles per hour. 2: moles per second.'
  PRES_VAR:
    default: PRSFC
    description: Specifies the variable name for surface pressure data to extract from MET_FILE1 .
  PX_VERSION:
    default: N
    description: 'Indicates whether the Pleim-Xiu land surface model was used in the MM5 simulations. Y: Use if the Pleim-Xiu land surface model was used in the MM5 simulations. Indicates that MET_FILE1 contains soil temperature, soil moisture and soil type fields that can be used, along with rainfall data, for NO soil emission calculations in Tmpbeis3 . N: Use if the Pleim-Xiu land surface model was not used in the MM5 simulations. Indicates that Tmpbeis3 will calculate NO soil emissions using only rainfall data.'
  PX_VERSION = Y:
    default: SLTYP
    description: Specifies the soil type variable name used if
  Q2_VAR:
    default: Q2
    description: Specifies the variable name for the two meter water vapor mixing ratio (kg/kg) used for the leaf temperature algorithm (Only for BEIS version 3.60).
  RADYNI_VAR:
    default: RADYNI
    description: Specifies the variable name for the aerodynamic resistance variable (s/m) used for the leaf temperature algorithm (Only for BEIS version 3.60).
  RAD_VAR:
    default: RGRND
    description: Specifies the variable name for radiation/cloud data to extract from either MET_FILE1 or optional MET_FILE2 .
  RC_VAR:
    default: RC
    description: Specifies the convective rainfall variable name used in MET_FILE1 .
  RGRND_VAR:
    default: RGRND
    description: Specifies the variable name for the solar radiation reaching the ground used for the leaf temperature algorithm (Only for BEIS version 3.60).
  RN_VAR:
    default: RN
    description: Specifies the non-convective rainfall variable name used in MET_FILE1 .
  RSTOMI_VAR:
    default: RSTOMI
    description: Specifies the variable name for the inverse of the stomatal resistance variable (m/s) used for the leaf temperature algorithm (Only for BEIS version 3.60).
  SOILINP:
    default: N
    description: "Indicates whether a particular day is the first day in a sequence of simulations. Y: Use for the first day in a sequence of simulations. Use if the file does not yet exist (i.e., the soil NO calculations will not depend on the previous day\u2019s rainfall). N: Use for subsequent days in a sequence of simulations. Use if the SOILINP file exists. Note that BEIS3 will create a SOILINP file for days subsequent to the first day in a sequence of simulations."
  SOILM_VAR:
    default: SOIM1
    description: Specifies the soil moisture variable name used if PX_VERSION = Y .
  SOILOUT:
    default: ''
    description: (File) Gridded soil restart file
  SOILT_VAR:
    default: SOIT1
    description: Specifies the soil temperature variable name used if PX_VERSION = Y .
  SUMMER_YN:
    default: Y
    description: 'Indicates whether to use a gridded seasonal switch file. Y: Use gridded seasonal switch file BIOSEASON N: Use environment variable to determine season'
  TEMPG_VAR:
    default: TEMPG
    description: Specifies the skin temperature at the ground level (K) used for the leaf temperature algorithm (Only for BEIS version 3.60).
  TMPR_VAR:
    default: TA
    description: Specifies the variable name for temperature to extract from MET_FILE1 .
  USTAR_VAR:
    default: USTAR
    description: Specifies the variable name for the surface friction velocity (m/s) used for the leaf temperature algorithm (Only for BEIS version 3.60).
