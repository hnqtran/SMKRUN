    description: (File) Mole-based reactivity matrix
  PRMAT_S:
    default: ''
    description: (File) Mass-based reactivity matrix
  PROJECTION_YR_SPEC:
    default: Y
    description: 'Sets whether or not entries in the /PROJECTION/ packet are in year-specific format. Y: Year-specific format in use N: Year-specific format not in use'
  PRSUP:
    default: ''
    description: (File) Reactivity matrix supplemental file
  REACTIVITY_POL:
    default: VOC
    description: Sets the pollutant name to use in computing the reactivity matrix.
  REPORT_DEFAULTS:
    default: Y
    description: 'Defines whether or not the program reports when a source uses the default cross-reference. Y: List sources in the log file when they use default cross-reference N: Do not list sources that use the default cross-reference'
  SMK_AVEDAY_YN:
    default: N
    description: 'Indicates whether or not to read average day emissions instead of annual emissions from the inventory file. Y: Read average day emissions N: Do not read average day emissions, use annual emissions instead'
  SMK_SOURCE:
    default: blank
    description: 'Defines the type of sources to be processed. Valid values are A: Area processing B: Biogenic processing M: Mobile processing P: Point processing'
  SMK_TMPDIR:
    default: "\u201C . \u201D"
    description: Sets the path for writing the temporary files needed when processing the /ALLOWABLE/, /CONTROL/, /CTG/, /EMS_CONTROL/, /MACT/, and/or /PROJECTION/ packets (from the GCNTL file).
  SPEC_OUTPUT:
    default: ALL
    description: 'Defines the types of speciation outputs to create. MASS: Output speciation matrix based on mass MOLE: Output speciation matrix based on moles ALL: Output both mass and mole speciation matrices'
  XREF_SICOVERSCC:
    default: Y
    description: 'Determines how to deal with packet entries that have both an SCC and SIC Y: Match sources by SIC before SCC N: Match sources by SCC before SIC'
elevpoint:
  ELEV_WRITE_FAKE_SRC:
    default: Y
    description: 'Defines whether the program needs to add a fake source group or not when there is no an elevated source group to output. Y: Add a fake source group when there is no an elevated source group to output N: Do not add a fake source group.'
  ELEV_WRITE_LATLON:
    default: Y
    description: "Defines whether write the latitude and longitude information of special elevated or PinG sources to the stack groups file Section 7.3.2, \u201C STACK_GROUPS \u201D for air quality models CMAQ, and UAM-style. Y: Write the latitude and longitude information of elevated or PinG sources to the the stack group file. N: Do not write the latitude and longitude information of elevated or PinG sources to the the stack group file. The ELEV_WRITE_LATLON can not be N, when processing for PinG sources, since CMAQ does need the latitude and longitude to be included."
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  G_RUNLEN:
    default: '240000'
    description: Simulation length (HHMMSS)
  G_STDATE:
    default: '0'
    description: Starting date of simulation (YYYYDDD)
  G_STTIME:
    default: '0'
    description: Starting time of simulation (HHMMSS)
  G_TSTEP:
    default: '10000'
    description: Time step (HHMMSS), only 10000 is allowed
  INLNST_L:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed\
      \ earlier. In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation\
      \ in CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called ."
  IOAPI_ISPH:
    default: '19'
    description: Determines which USGS spheroid to use for grid-based calculations This environment variable can also be used to set custom spheroid representations. See the I/O API documentation for more information.
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Elevpoint
  MRG_LAYERS_YN:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed\
      \ earlier. In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation\
      \ in CMAQ. When using Smkmerge for in-line plume rise processing, must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L ."
  PELV:
    default: ''
    description: '(File) Type: ASCII - list-directed Used by: Laypoint , Smkmerge , and Smkreport'
  PELVCONFIG:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed earlier.\
      \ In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation in\
      \ CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L ."
  PINGTS_L:
    default: '0'
    description: 'Defines the method to use in determining PinG point sources. 0: No PinG sources 1: Use PinG section of PELVCONFIG configuration file For all models that SMOKE supports use of PinG sources is optional. Some models may have limitations on the number of PinG sources supported, and you must make sure that these limitations are met; SMOKE does not automatically compare with these limitations, if any. For CMAQ, SMOKE will output a STACK_GROUPS file from the Elevpoint program and a file from the Smkmerge program to support PinG. For UAM-style processing, SMOKE will flag PinG sources in the ASCII elevated file created by Smkmerge , and should be used with the SMK_ASCIIELEV_YN option set to Y to create this ASCII elevated file.'
  PINGTS_S:
    default: '0'
    description: 'Defines the method to use in determining PinG point sources. 0: No PinG sources 1: Use PinG section of PELVCONFIG configuration file For all models that SMOKE supports use of PinG sources is optional. Some models may have limitations on the number of PinG sources supported, and you must make sure that these limitations are met; SMOKE does not automatically compare with these limitations, if any. For CMAQ, SMOKE will output a STACK_GROUPS file from the Elevpoint program and a file from the Smkmerge program to support PinG. For UAM-style processing, SMOKE will flag PinG sources in the ASCII elevated file created by Smkmerge , and should be used with the SMK_ASCIIELEV_YN option set to Y to create this ASCII elevated file.'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PTMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PTMPLIST:
    default: ''
    description: "(File) List of hourly point source emissions files. The PTMPLIST file is an list file containing the full name and path of available hourly point source emissions files. This file is created automatically from the example SMOKE run scripts. Its format is shown in Table 6.83, \u201CFormat for PTMPLIST \u201D ."
  REPPELV:
    default: ''
    description: "(File) Type: ASCII - list-directed Summary: This ASCII output file contains the sources and criteria used for selecting elevated and PinG sources in SMOKE. The following is a description of columns/header in the report: Source ID: SMOKE source ID, used by SMOKE only Region: Country/state/county code (CSSYYY where C=country, SS=state, and YYY=county) Plant: Facility ID (FF10), Plant ID (ORL) Char 1: Unity ID (FF10), Point ID (ORL) Char 2: Release Point ID (FF10), Stack ID (ORL) Char 3: Process ID (FF10), Segment ID (ORL) Char 4: For IDA inventory, SCC Plt Name: Plant description from the input inventory Elevstat: Elevated status - P = plume-in-grid, E = elevated Group: SMOKE-assigned stack group number Stk Ht: Stack height in meters Stk Dm: Stack diameter in meters Stk Tmp: Stack exit gas temperature in K Stk Vel: Stack exit gas velocity in m/s Stk Flw: Stack exit gas flow rate in m 3 /s Rise: Briggs analytical solution plume rise in meters. This column is output only when\
      \ RISE is specified as a selection criterion in the PELVCONFIG input file. Group <pol>: Daily maximum emissions for source or source group for each pollutant (<pol>) in the PELVCONFIG file. These emissions are source emissions when a single source has its own group number. This column is output only when a pollutant is specified as a selection criterion in the PELVCONFIG input file. Var 1: The first variable from the PELVCONFIG input file that was used in establishing the source as a PinG/elevated source Type 1: If \u201C TOP \u201D was used in the PELVCONFIG input file, this field says \u201C RANK \u201D Test 1: The test used to establish this source as a PinG/elevated source (e.g., >, <, >=, =) Val 1: If TOP was used, this value is the RANK. Otherwise, this value is the criterion used with Var 1 and Test 1 (e.g., if Var 1 is HT, Test 1 is \u201C > \u201D, and if Val 1 is 50, then the criterion for selection is that the stack height be greater than 50. Var 2 through Val 2 are the\
      \ same as Var 1 through Val 1, except these are defined only if an AND condition existed for the OR condition that SMOKE used to establish the source as PinG or elevated. There will be as many variables of these types as there are AND conditions in the PELVCONFIG file."
  SMKMERGE_CUSTOM_OUTPUT:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed\
      \ earlier. In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation\
      \ in CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If is set to Y, the output file for the in-line emissions is called INLNST_L ."
  SMK_ASCIIELEV_YN:
    default: '0'
    description: 'Defines the method to use in determining PinG point sources. 0: No PinG sources 1: Use PinG section of PELVCONFIG configuration file For all models that SMOKE supports use of PinG sources is optional. Some models may have limitations on the number of PinG sources supported, and you must make sure that these limitations are met; SMOKE does not automatically compare with these limitations, if any. For CMAQ, SMOKE will output a STACK_GROUPS file from the Elevpoint program and a PINGTS_[S|L] file from the Smkmerge program to support PinG. For UAM-style processing, SMOKE will flag PinG sources in the ASCII elevated file created by Smkmerge , and should be used with the option set to Y to create this ASCII elevated file.'
  SMK_ELEV_METHOD:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed\
      \ earlier. In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation\
      \ in CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L ."
  SMK_PING_METHOD:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed earlier.\
      \ In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation in\
      \ CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L ."
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  STACK_GROUPS:
    default: Y
    description: "Defines whether write the latitude and longitude information of special elevated or PinG sources to the stack groups file Section 7.3.2, \u201C \u201D for air quality models CMAQ, and UAM-style. Y: Write the latitude and longitude information of elevated or PinG sources to the the stack group file. N: Do not write the latitude and longitude information of elevated or PinG sources to the the stack group file. The ELEV_WRITE_LATLON can not be N, when processing for PinG sources, since CMAQ does need the latitude and longitude to be included."
