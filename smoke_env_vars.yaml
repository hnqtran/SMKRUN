smkreport: {}
spcmat:
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  ASMAT_L:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  ASMAT_S:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  ASSUP:
    default: ''
    description: (File) Speciation supplemental file
  CMB_CHKFRACS:
    default: Y
    description: 'Check whether the sum of multiple speciation profile split factors is equal to 1.0 or not. Y: Gives an error if the sume of split factors is not 1.0 N: Do not check the sume of split factors'
  DEFAULT_CONV_FAC_ERROR:
    default: N
    description: "Defines whether the program treats as an error when there is no matched VOC to TOG conversion factor available in the pollutant-to-pollutant conversion file ( Section 6.5.1, \u201C GSCNV : Pollutant-to-pollutant conversion file\u201D ). Y: Use speciation tagging cross-reference file N: Do not use speciation tagging cross-reference file"
  FULLSCC_ONLY:
    default: N
    description: Disables any sub-SCC cross-reference assignments that would otherwise be included in the cross-reference hierarchy. For example, the left-7, left-4, and left-2 levels of nonpoint and mobile SCCs would never be used. This is useful when zeros are a natural part of the SCC that the user does not want to assume are present for cross-reference hierarchy purposes. This option affects all Cntlmat input packets that use SCC assignments as part of their hierarchy. In this context, this option affects cross-referencing for the speciation cross-reference files by preventing left-7 SCC assignments. The application GSCNV files are not affected by this option when using FIPS/SCC assignments, and will continue to use left-7 SCC assignments even when FULLSCC_ONLY is set to "Y".
  GSCNV:
    default: N
    description: "Defines whether the program treats as an error when there is no matched VOC to TOG conversion factor available in the pollutant-to-pollutant conversion file ( Section 6.5.1, \u201C : Pollutant-to-pollutant conversion file\u201D ). Y: Use speciation tagging cross-reference file N: Do not use speciation tagging cross-reference file"
  GSPRO:
    default: ''
    description: "(File) Speciation profile file. The speciation profile file, GSPRO , contains the factors that are used to separate aggregated inventory pollutant emissions totals into emissions of model species required by the AQM. In traditional ozone air quality modeling, this file contained split factors only for VOC. In SMOKE, all inventory pollutants need to be represented in this file, even if it is only to indicate that a pollutant is not split into any model species (e.g., CO emissions would have a \u201C split factor \u201D of 1.0). The format of the GSPRO file is shown in Table 6.41, \u201CFormat for GSPRO \u201D . For support of combining criteria and toxic VOC using the NONHAPVOC calculation feature of SMOKE, the GSPRO file (starting in version 2.3 of SMOKE) includes a special header that defines the meaning of NONHAPVOC. This is the new #NHAP header, described below. This header keyword will be treated as a comment line by previous versions of SMOKE. The header lines define\
      \ NONHAPVOC (and/or NONHAPTOG) by listing all of the VOC compounds that were assumed to be removed from VOC (or TOG) when the speciation profile factors for NONHAPVOC (or NONHAPTOG) were calculated. When using this file, Spcmat compares this list with the list from the Inventory Table (\"VOC or TOG Component\" field = V or T and \"Explicit in Mechanism = \"N\"). This new header is included in this file so that the file is self-describing with respect to the definition of NONHAPVOC and NONHAPTOG. The format supports header lines (using a # symbol in position 1 of any line) in any part of the file. The columns are used by SMOKE as follows: The speciation profile number is matched with the number in the GSREF file. This \u201C number \u201D is treated as a character string, so leading zeros must be the same in both the GSPRO and GSREF files. The pollutant ID must match the pollutant names in the SMOKE inventory file ( AREA , MOBL , or PNTS ). These names are set by the #POLID or #DATA\
      \ headers in the Smkinven input files. The species IDs are the names of the model species needed by the AQM for which SMOKE is being used. These depend on the requirements of that model. The example SMOKE inputs will not be correct for all AQMs. The split factor is the numerator in the factor computed for the mole-based speciation matrix. The divisor is the denominator in the factor computed for the mole-based speciation matrix. The mass fraction is the value put in the mass-based speciation matrix. The ratio of the mass fraction and the split factor is the average molecular weight for the species and profile, if the divisor is 1."
  GSPRO_COMBO:
    default: '1'
    description: "Defines period number which could be month. It must match to the period number in ( Section 6.5.4, \u201C : Combination speciation profiles file \u201D )."
  GSREF:
    default: ''
    description: "(File) Speciation cross-reference file. 6.5.5.1. Area- and mobile-source speciation cross-reference file entries 6.5.5.2. Point-source speciation cross-reference file entries The speciation cross-reference file is used to match the emission sources with the speciation profiles in the GSPRO file. The GSREF file uses a header to define the point-source unique characteristics. The same file can be used for all source categories; the SMOKE programs use only the applicable entries in the file. The way that the file is applied in SMOKE ensures that the most-specific matches override the less-specific ones. A description of how the speciation cross-reference is applied to the inventory is provided in Section 4.16, \u201C Spcmat \u201D . When the special keyword \u201C COMBO \u201D is placed in the speciation profile code column, all sources matching the cross-reference entry should use a combination speciation profile provided in Section 6.5.4, \u201C GSPRO_COMBO : Combination\
      \ speciation profiles file \u201D . Using the profiles listed in the GSPRO_COMBO file, Spcmat can use the fractions and the information from the GSPRO and GSCNV for the profiles provied to create weighted profiles for the matching source. As of SMOKE version 4.5, the chemical speciation profile split factor column M is added into the Table 6.45, \u201CFormat for point-source GSREF \u201D for users to apply multiple speciation profiles to a single inventory source. Unlike GSPRO_COMBO approach, this approach can be used to an individual stationary point source level. 6.5.5.1. Area- and mobile-source speciation cross-reference file entries When emission type are used (as with mobile source processing using the Movesmrg program), column C must contain the emission types instead of the pollutants. For example, if the MEPROC file contained processes EXR (exhaust running), EPM (evaporative permeation), and CXR (crankcase running exhaust), then in order to use pollutant-specific entries in\
      \ the GSREF file for mobile sources, records would need to be added to the file that use the emission types EXR__TOG, EPM__TOG, and CXR__TOG in column C. Note that the separator within these process-pollutant combinations must be a double underscore. The format of the GSREF file for area and mobile sources is shown in Table 6.44, \u201CFormat for area- and mobile-source GSREF \u201D . Table 6.44. Format for area- and mobile-source GSREF Line Position Description 1+ A Area: 20-digit SCC, or 10-digit SCC with zeros filling the remaining digits (Character) Mobile: 20-digit SCC code or 10-digit SCC (Character) Set to zero if cross-reference entry is not SCC-specific B Speciation profile code (10-digit character) (required; must match codes in the GSPRO file) C Pollutant name or emission type (16-digit character) (required; must match pollutants for profile code in GSPRO file; put zero id not pollutant-dependent) D Country/state/county code (6-digit character in format YSSCCC) (optional):\
      \ leave blank if not country/state-dependent set to YSS000 for country/state-dependent set to YSSCCC for county-dependent E Maximum Achievable Technology Code (6-digit character) (optional; use 0 if not needed) F Standard Industrial Code (20-digit character) (optional; use 0 if not needed) ... ... M Chemical Speciation Profile Split factor (real) (optional) 6.5.5.2. Point-source speciation cross-reference file entries The format of the GSREF file for point sources is shown in Table 6.45, \u201CFormat for point-source GSREF \u201D . Table 6.45. Format for point-source GSREF Line Position Description 1 A /POINT DEFN/ B Number of point source characteristics in addition to plant ID in point source definition (for ORL, this will always be 4) C Number of point source characteristic in addition to plant ID (if SCC is a part of the source definition); zero otherwise. FF10 and ORL inventories: 4 2+ A 8- or 10- or 20- digit SCC (Character) (optional; set to zero if cross-reference entry is\
      \ not SCC-specific) B Speciation profile code (10-digit character) (required; must match codes in the GSPRO file) C Pollutant name or emission type (16-digit character) (required; must match pollutants for profile code in GSPRO file; put zero if not pollutant-dependent) D Country/state/county code (6-digit character in format YSSCCC) (optional): leave blank if not country/state-dependent set to YSS000 for country/state-dependent set to YSSCCC for county-dependent E Maximum Achievable Technology Code (6-digit character) (optional; use 0 if not needed) F Standard Industrial Code (20-digit character String) (optional; use 0 if not needed) G Facility ID for FF10 Point Sources (Plant ID for ORL), (15-digit character), (optional ; leave blank if entry is not plant-specific) H Characteristic 1 (for FF10, this is Unit ID; for ORL, this is Point ID), optional (15-digit character) I Characteristic 2 (for FF10, this is Release Point ID, (for ORL, this is stack ID); optional (15-digit character)\
      \ J Characteristic 3 (for FF10, this is Process ID, (for ORL, this is segment ID); optional (15-digit character) K Characteristic 4 (for FF10 or ORL, this is 10-digit SCC, or 20-digit maximum SCC) (20-digit character) (optional) L Characteristic 5 (blank for FF10 or ORL) (15-digit character) (optional) M Chemical Speciation Profile Split factor (real) (optional)"
  GSTAG:
    default: N
    description: "Defines whether the program uses the speciation tagging cross-reference file or not ( Section 6.5.6, \u201C : Speciation tagging cross-reference file \u201D ). Y: Use speciation tagging cross-reference file N: Do not use speciation tagging cross-reference file"
  INVTABLE:
    default: ''
    description: "(File) Inventory table. The INVTABLE file replaces the SIPOLS and ACTVNAMS files previously used by SMOKE. Smkinven uses the inventory table to select the inventory pollutants that will be output by Smkinven . The valid pollutants are again checked at the end of SMOKE processing by Smkmerge , to ensure that the program knows about all of the pollutants and also to set the order of the output variables (output species are sorted by the order of the pollutants in the inventory table and for multiple species per pollutant, by alphabetical order). You can use the INVTABLE to drop inventory pollutants in Smkinven without having to modify the inventory files, simply by modifying INVTABLE . The units used in the SMOKE intermediate files are listed in this file. The SMOKE programs Spcmat , and Movesmrg use this file to determine which pollutants should be included in the NONHAPVOC or NONHAPTOG calculation. The inventory table also provides a way to assign the SPECIATE4 species\
      \ ID to any pollutant that is a Hazardous Air Pollutant (HAP) VOC. This assignment is not used directly by SMOKE, but rather is used by the Speciation Tool when creating VOC speciation profiles. This is used only when creating speciation profiles to support SMOKE runs that will combine criteria VOC and HAP VOC emissions, using the NHAPEXCLUDE file in the Smkinven program. More specifically, this can be done for the purpose of using VOC HAP emissions to augment VOC speciation profiles. Since the Inventory Table provides information to the Speciation Tool, this field is not used by SMOKE, but is included for continued integration of SMOKE inputs with the Speciation Tool. As described in the Smkinven documentation in Chapter 6, Smkinven in some cases will create \"no-integrate\" (NOI) HAP pollutant emissions from the inventory data by renaming the pollutant with a \"_NOI\" suffix applied to the end of the Inventory Data Name from the Inventory Table for such pollutants. Similarly, Smkinven\
      \ will automatically add all possibly needed \"_NOI\" pollutant names to the internal master list of valid pollutant names. This list would otherwise be limited to the contents of the INVTABLE file entries where the Keep column contains an \"Y\". Smkinven inserts these names in the master list such that the \"_NOI\" version of the pollutant name appears in the list just after the polutant on which the name is based. The inserted entries that include \"_NOI\" are made when the following values are included for the pollutant in the INVTABLE file. A \"Y\" appears in the \"Keep\" field A \"V\" or \"T\" appears in the \"VOC or TOG component\" field A \"Y\" appears in the \"Model species\" field Something other than \"Y\" appears in the \"Explicit in mechanism\" field (e.g., \"N\" or blank) It is possible for a user to choose two pollutants that result in double counting the emissions from the inventory. For example, you may want to model both benzo(a)pyrene and 7-PAH which, would result\
      \ in the emissions associated with CAS number 205992 (for benzo(a)pyrene) to be duplicated. The user is responsible for the choices made and the resulting changes in inventory mass. The format of the INVTABLE is shown in Table 6.91, \u201CFormat for INVTABLE \u201D . The columns in the INVTABLE are used as follows: Inventory data name: Unique name for pollutant or activity that will be stored and processed by SMOKE. Because of I/O API restrictions, these names can only include alphanumeric characters and underscores, and the first character must be a letter. In addition, because SMOKE uses double-underscore as a separator when appending to variable names, no double-underscores are permitted in these names. Mode: This three-letter code represents the emissions mode that SMOKE uses to augment the pollutant names. Emissions mode usually refers to the on-road or nonroad mobile exhaust or evaporative emissions. If present in a record of the Inventory Table, SMOKE will combine the Mode field\
      \ with the Inventory Data Name field using a double underscore. So, if the Inventory Data Name is \"VOC\" and the Mode is \"EXH\", then the pollutant name in SMOKE intermediate files will be stored as \"EXH__VOC\". Inventory Pollutant Code: This code represents the pollutant that is provided in the inventory file input into SMOKE, and is sometimes the Chemical Abstracts Service (CAS) number when the inventory uses CAS numbers to identify pollutants. Smkinven matches this code to a ORL-formatted inventory file to assign the combination of Mode and Inventory Data Name (columns 2 and 1 as described in the previous bullet), which is used in all subsequent SMOKE intermediate files and reports. This code is not used by SMOKE in any other way. SPECIATE4 ID: The SPECIATE4 ID is the unique species identifier in SPECIATE4 (the \"ID\" field in the SPECIES_PROPERTIES table). This code is not used by SMOKE, but rather is used during import of the Inventory Table to the Speciation Tool. Reactivity\
      \ group: The reactivity group for the ASPEN model. It is not used in SMOKE. Keep: Indicates whether SMOKE should keep the CAS number associated with this inventory data name. SMOKE will keep any inventory data with at least one CAS number with a Y. Factor: The adjustment factor to use in splitting the emissions associated with a CAS number into different inventory data names, or reducing the mass of a metal compound associated with a CAS number to account for the metal mass only. VOC or TOG component: A \u201C V \u201D should be entered if the CAS number is part of VOC emissions or TOG emissions. A \u201C T \u201D should be entered if the CAS number is part of TOG emissions only. An \u201C N \u201D should be entered if the CAS number is part of neither VOC or TOG. Any other value other than \u201C V \u201D or \u201C T \u201D will be treated as an \u201C N \u201D. Model species: A \u201C Y \u201D should be entered if the pollutant is also a VOC model species for the AQM being targeted\
      \ for the run. Any other values will be treated as an \u201C N \u201D. Explicit in mechanism: A \u201C Y \u201D should be entered if (1) the pollutant is a VOC species (the model-species column must be \u201C Y \u201D as well), and (2) that model-species is explicitly treated in the AQM\u2019s chemical mechanism. The pollutant can be an explicit species in the chemical mechanism only when the GSPRO file definitions of the lumped VOC species have been adjusted to account for the pollutants/species that are explicit in the mechanism. The current explicit-in-mechanism species being used in the toxics CB6 mechanism for CMAQ are formaldehyde, acetaldheyde, acrolein and 1,3 butadiene. Activity: A \u201C Y \u201D should be entered if the inventory data name is a type of activity instead of emissions. Any other values will be treated as an \u201C N \u201D. NTI: Code identifying a HAP on the Clean Air Act HAP list (list of 188 HAPs). Not currently used by SMOKE; will be used in the future for\
      \ growing HAP emissions to future years. Units: The units to store the data in the SMOKE intermediate files. This should be \u201C short tons/year \u201D for emissions values, \u201C miles/year \u201D for VMT, and \u201C miles/hr \u201D for speed. Although this is provided as an input field to allow possible future changes, these values should not be changed by the user and are unrelated to the units of the emissions in the input files. Inventory data descriptions: This is the description of the inventory data name listed in columns 1-11. CAS pollutant description: Describes the pollutant that is coming from the inventory that is being input into SMOKE."
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Spcmat
  MCXREF:
    default: N
    description: "Defines whether the program uses the county reference county file to assign speciation profiles by reference county or not ( Section 6.9.2.1.3, \u201C : Mobile representative county cross-reference file\u201D ). Y: Use inventory to reference county cross-reference file N: Do not use county cross-reference file"
  MEPROC:
    default: ''
    description: "(File) List of mobile emission processes and associated activities and pollutants. The MEPROC file, used by Spcmat lists the pollutants that will be generated by MOVES for modeling on-roadway and off-network mobile sources. The available emission processes are listed in Section 2.7.4.9, \u201C MOVES Emission Processes by Emission Rate Tables\u201D . The format of the MEPROC file is shown in Table 6.64, \u201CFormat for MEPROC \u201D . Example 6.4. MEPROC example file for RatePerDistance MOVES table VMT CO NO NO2 HONO SO2 NH3 TOG VOC_INV POC PEC PSO4 PNO3 PMFINE NH4 PMC Example 6.5. MEPROC example file for RatePerVehicle MOVES table VPOP CO NO NO2 HONO SO2 NH3 TOG VOC_INV POC PEC PSO4 PNO3 PMFINE NH4 PMC"
  MOBL:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  MSMAT_L:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  MSMAT_S:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  MSSUP:
    default: ''
    description: (File) Speciation supplemental file
  NO_SPC_ZERO_EMIS:
    default: N
    description: 'Defines whether the program applies the speciation profiles to zero emission sources. Y: Skip applying speciation profile to zero emission source N: Do not skip'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  POLLUTANT_CONVERSION:
    default: N
    description: "Defines whether the program uses the pollutant-to-pollutant conversion file ( Section 6.5.1, \u201C GSCNV : Pollutant-to-pollutant conversion file\u201D ). Y: Use conversion file N: Do not use conversion file"
  PSMAT_L:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PSMAT_S:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PSSUP:
    default: ''
    description: (File) Speciation supplemental file
  REPORT_DEFAULTS:
    default: Y
    description: 'Defines whether or not the program reports when a source uses the default cross-reference. Y: List sources in the log file when they use default cross-reference N: Do not list sources that use the default cross-reference.'
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  SPCMAT_PERIOD:
    default: '1'
    description: "Defines period number which could be month. It must match to the period number in ( Section 6.5.4, \u201C GSPRO_COMBO : Combination speciation profiles file \u201D )."
  SRC_TAGGING:
    default: N
    description: "Defines whether the program uses the speciation tagging cross-reference file or not ( Section 6.5.6, \u201C GSTAG : Speciation tagging cross-reference file \u201D ). Y: Use speciation tagging cross-reference file N: Do not use speciation tagging cross-reference file"
  USE_REF_COUNTY_MAP_YN:
    default: N
    description: "Defines whether the program uses the county reference county file to assign speciation profiles by reference county or not ( Section 6.9.2.1.3, \u201C MCXREF : Mobile representative county cross-reference file\u201D ). Y: Use inventory to reference county cross-reference file N: Do not use county cross-reference file"
temporal:
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  ATMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  ATPRO_DAILY:
    default: ''
    description: '(File) Month-to-day Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  ATPRO_HOURLY:
    default: ''
    description: '(File) Day-to-Hour Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  ATPRO_HOURLY_NCF:
    default: ''
    description: (File) Hourly Temporal Profiles. This NetCDF hourly temporal profiles input file contains annual total ( ANNTOT ), monthly total ( MONTOT ), daily total ( DAYTOT ) and hourly total ( HRLTOT ) to compute year-to-hour, month-to-hour, day-to-hour profiles to calculate hourly total depending on types of inventory data (annual, monthly or daily inventory). If inventory is annual total, year-to-hour profiles will be used to convert annual total to hourly total emissions. If inventory is monthly total, month-to-hour profiles will be used to compute hourly total from monthly total inventory.
  ATPRO_MONTHLY:
    default: ''
    description: '(File) Year-to-Month Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  ATPRO_WEEKLY:
    default: ''
    description: '(File) Month-to-Week Temporal Profiles. The Temporal profiles files contain the monthly, weekly, diurnal and/or hourly temporal profiles used to convert the annual emissions stored in the inventory to hourly emissions. The files can contain the following types of records:'
  ATREF:
    default: blank
    description: "Defines the base of hourly temporal profiles. This flag is only applicable when hourly temporal profiles generated by Gentpro is available for Temporal to use. For a proper processing of hourly temporal profiles from Gentpro , user must let Temporal know the basis of hourly temporal profiles (i.e., hour of day, hour of month or hour of year). Gentpro outputs hourly temporal profiles IDs into temporal cross-reference input file ( ). See detail information at Section 6.3.2, \u201C [A|M|P]TREF : Temporal cross-reference file\u201D . If HOUR_PROFID column is filled by Gentpro , user must define the base of hourly profiles to correctly convert annual/monthly/daily inventories. If processing monthly inventory, user must set it to 'MONTH'. YEAR: Convert raw annual inventory to hourly inventory values. MONTH: Convert calculated monthly inventory to hourly inventory values."
  ATSUP:
    default: ''
    description: (File) Temporal allocation supplemental file
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  DAY_SPECIFIC_YN:
    default: N
    description: 'Defines whether to import day-specific inventory data. Y: Import day-specific data N: Do not import day-specific data.'
  FULLSCC_ONLY:
    default: N
    description: Disables any sub-SCC cross-reference assignments that would otherwise be included in the cross-reference hierarchy. For example, the left-7, left-4, and left-2 levels of nonpoint and mobile SCCs would never be used. This is useful when zeros are a natural part of the SCC that the user does not want to assume are present for cross-reference hierarchy purposes. This option affects all Cntlmat input packets that use SCC assignments as part of their hierarchy. In this context, this option affects cross-referencing for the temporal cross-reference files by preventing left-7 SCC assignments.
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  HOLIDAYS:
    default: ''
    description: "(File) Holidays date list. SMOKE can process holidays as specific days of the week in order to better model activity patterns. The HOLIDAYS file is used to indicate which days should receive special treatment and how the days should be treated. The format of this file is shown in Table 6.35, \u201CFormat for HOLIDAYS \u201D ."
  HOURLY_TPROF_BASE:
    default: blank
    description: "Defines the base of hourly temporal profiles. This flag is only applicable when hourly temporal profiles generated by Gentpro is available for Temporal to use. For a proper processing of hourly temporal profiles from Gentpro , user must let Temporal know the basis of hourly temporal profiles (i.e., hour of day, hour of month or hour of year). Gentpro outputs hourly temporal profiles IDs into temporal cross-reference input file ( [A|M|P]TREF ). See detail information at Section 6.3.2, \u201C [A|M|P]TREF : Temporal cross-reference file\u201D . If HOUR_PROFID column is filled by Gentpro , user must define the base of hourly profiles to correctly convert annual/monthly/daily inventories. If processing monthly inventory, user must set it to 'MONTH'. YEAR: Convert raw annual inventory to hourly inventory values. MONTH: Convert calculated monthly inventory to hourly inventory values."
  HOUR_PROFID:
    default: blank
    description: "Defines the base of hourly temporal profiles. This flag is only applicable when hourly temporal profiles generated by Gentpro is available for Temporal to use. For a proper processing of hourly temporal profiles from Gentpro , user must let Temporal know the basis of hourly temporal profiles (i.e., hour of day, hour of month or hour of year). Gentpro outputs hourly temporal profiles IDs into temporal cross-reference input file ( [A|M|P]TREF ). See detail information at Section 6.3.2, \u201C [A|M|P]TREF : Temporal cross-reference file\u201D . If column is filled by Gentpro , user must define the base of hourly profiles to correctly convert annual/monthly/daily inventories. If processing monthly inventory, user must set it to 'MONTH'. YEAR: Convert raw annual inventory to hourly inventory values. MONTH: Convert calculated monthly inventory to hourly inventory values."
