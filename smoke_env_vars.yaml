mrgelev:
  FILELIST:
    default: ''
    description: "(File) Gridded merge 2-D file list. The FILELIST file is used to provide a list of logical file names to the Mrggrid program. This list should contain the logical file names for all 2- or 3-D files to be merged in a given run. It is a very simple file, and has no limit to the number of files listed. Note that unlike most list files used in SMOKE, FILELIST requires a list of logical file names, not the actual file name. The format of the FILELIST file is shown in Table 6.53, \u201CFormat for FILELIST \u201D ."
  G_RUNLEN:
    default: N
    description: 'This environment variable allows Mrgelev to merge files with data from different days. Y: Allow data from different dates to be merged together Mrgelev will use the environment variables G_STDATE , G_STTIME , , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrgelev will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_STDATE:
    default: N
    description: 'This environment variable allows Mrgelev to merge files with data from different days. Y: Allow data from different dates to be merged together Mrgelev will use the environment variables , G_STTIME , G_RUNLEN , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrgelev will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_STTIME:
    default: N
    description: 'This environment variable allows Mrgelev to merge files with data from different days. Y: Allow data from different dates to be merged together Mrgelev will use the environment variables G_STDATE , , G_RUNLEN , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrgelev will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_TSTEP:
