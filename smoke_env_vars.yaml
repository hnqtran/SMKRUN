normbeis3:
  B360FAC:
    default: ''
    description: "(File) Biogenic emissions factors file for BEIS v3.61. The B360FAC file for BEIS version 3.61 contains LAI, dry leaf biomass, winter biomass factor, indicator of specific leaf weight, and normalized emission fluxes for 34 different species/compounds listed in Table 6.57, \u201CFormat for B360FAC , BEIS version 3.61\u201D ."
  B3FAC:
    default: ''
    description: "(File) Biogenic emissions factors file for BEIS v3.14 or earlier. The B3FAC file for BEIS version 3.14 contains LAI, dry leaf biomass, winter biomass factor, indicator of specific leaf weight, and normalized emission fluxes for 34 different species/compounds listed in Table 6.58, \u201CFormat for B3FAC , BEIS version 3.14\u201D ."
  B3GRD:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Used by: Tmpbeis3 Table 7.25, \u201CVariables in B3GRD for BEIS version 3.14\u201D contains names and descriptions of variables in the B3GRD output file form Normbeis3 , BEIS3. For BEIS version 3.14, Normbeis3 calculates normalized emissions for both the summer and winter seasons. For nitric acid (NO) calculations, however, emissions depend on a given grid cell\u2019s land use category (or categories). For agricultural land use portions of a grid cell, a determination is made of whether the given day is in the growing season or the non-growing season. The appropriate emissions factor is then applied to the NO emissions calculations. The agricultural land use categories USGS Cropgrass (a cropland/grassland mosaic) and USGS Cropwoodland (a cropland/woodland mosaic) represent grid cells with mixed vegetation and only half the area is assumed to be covered by crops. Accordingly, the corresponding emissions factors for these\
      \ two categories are multiplied by 0.5 for NO calculations. (Note that the USGS Drycrop and USGS Irrcrop land use categories assume the vegetation is all crop.) For the non-growing season in agricultural areas, the emissions factor for the USGS Grassland land use category is used for NO emission calculations. Finally, for non-agricultural areas, the USGS Grassland emissions factor is used all year round. Table 9.21b contains the names and descriptions of variables in the B3GRD output file from Normbeis3 , BEIS version 3.14"
  BEISFAC:
    default: ''
    description: "(File) Biogenic emissions factors file for BEIS v3.7 or later version. The BEISFAC file for BEIS version 3.7 or later version contains LAI, dry leaf biomass, winter biomass factor, indicator of specific leaf weight, and normalized emission fluxes for various species/compounds listed in Table 6.56, \u201CFormat for BEISFAC , BEIS version 3.7 or later version.\u201D . As of BEIS version 3.7, BEISFAC is deisgned for Section 6.9.1.7, \u201C BELD5 : Landuse input file for BEIS v3.7 or later version\u201D . NOTE: To check its comparability in Normbeis3 between BEISFAC and BELD5 , new header #BEISFAC4BELD5 is required. Similarly, in Normbeis4 , a #BELD6 is required in the first line of the BEISFAC file."
  BEIS_VERSION:
    default: '3.7'
    description: Define the version of BEIS model to perform
  BELD3_A:
    default: ''
    description: '(File) BELD3 land use data files. BELD3_A , BELD3_B , and BELD3_TOT files are I/O API netCDF files that contain gridded BELD3 data. The BELD3 data comprise 230 land use types. Because the I/O API limit on the number of variables in one netCDF file is 120, the gridded BELD3 data is broken up into two files ( BELD_A and BELD_B ). The BELD_TOT file contains additional information on the BELD3 data for the same grid as the BELD3_A and BELD3_B files. The BELD3_TOT file contains the following variable and description: FOREST: Percentage of forest area in each grid cell'
  BELD3_B:
    default: ''
    description: '(File) BELD3 land use data files. BELD3_A , BELD3_B , and BELD3_TOT files are I/O API netCDF files that contain gridded BELD3 data. The BELD3 data comprise 230 land use types. Because the I/O API limit on the number of variables in one netCDF file is 120, the gridded BELD3 data is broken up into two files ( BELD_A and BELD_B ). The BELD_TOT file contains additional information on the BELD3 data for the same grid as the BELD3_A and BELD3_B files. The BELD3_TOT file contains the following variable and description: FOREST: Percentage of forest area in each grid cell'
  BELD3_TOT:
    default: ''
    description: '(File) BELD3 land use data files. BELD3_A , BELD3_B , and BELD3_TOT files are I/O API netCDF files that contain gridded BELD3 data. The BELD3 data comprise 230 land use types. Because the I/O API limit on the number of variables in one netCDF file is 120, the gridded BELD3 data is broken up into two files ( BELD_A and BELD_B ). The BELD_TOT file contains additional information on the BELD3 data for the same grid as the BELD3_A and BELD3_B files. The BELD3_TOT file contains the following variable and description: FOREST: Percentage of forest area in each grid cell'
  BELD4:
    default: ''
    description: "(File) Landuse input file for BEIS v3.61. Table 6.60, \u201CLand use categories in BELD4\u201D contains names and descriptions of the 286 land use categories in BELD4."
  BELD5:
    default: ''
    description: "(File) Landuse input file for BEIS v3.7 or later version. BELD5 share the same format as Table 6.60, \u201CLand use categories in BELD4\u201D that contains names and descriptions of the land use categories in BELD4."
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Normbeis3
normbeis4:
  BEISFAC:
    default: ''
    description: "(File) Biogenic emissions factors file for BEIS v3.7 or later version. The BEISFAC file for BEIS version 3.7 or later version contains LAI, dry leaf biomass, winter biomass factor, indicator of specific leaf weight, and normalized emission fluxes for various species/compounds listed in Table 6.56, \u201CFormat for BEISFAC , BEIS version 3.7 or later version.\u201D . As of BEIS version 3.7, BEISFAC is deisgned for Section 6.9.1.7, \u201C BELD5 : Landuse input file for BEIS v3.7 or later version\u201D . NOTE: To check its comparability in Normbeis3 between BEISFAC and BELD5 , new header #BEISFAC4BELD5 is required. Similarly, in Normbeis4 , a #BELD6 is required in the first line of the BEISFAC file."
  BEIS_NORM_EMIS:
    default: ''
    description: '(File) Gridded, normalized biogenic emissions (in grams of carbon or nitrogen per hour, depending on the species): contains both summer and winter normalized emissions'
  BEIS_VERSION:
    default: '4.0'
    description: Define the version of BEIS model to perform
  BELD6:
    default: ''
    description: "(File) Landuse input file for BEIS v4. Table 6.59, \u201CLand use categories in BELD6\u201D lists the names and descriptions of the variables used in the BELD6 input file. Variable units are percent."
  BIOMASS:
    default: ''
    description: "(File) Landuse input file for BEIS v4. BIOMASS share the same format as Table 6.59, \u201CLand use categories in BELD6\u201D that contains names and descriptions of the land use categories in BELD6. Variable units are in grams per meter squared."
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Normbeis4
