  BY GEOCODE_LEVEL1[NAME]:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the or BY GEOCODE_LEVEL2[NAME] or BY GEOCODE_LEVEL3[NAME] or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
  BY GEOCODE_LEVEL2[NAME]:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or or BY GEOCODE_LEVEL3[NAME] or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
  BY GEOCODE_LEVEL3[NAME]:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or BY GEOCODE_LEVEL2[NAME] or or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
  BY GEOCODE_LEVEL4[NAME]:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or BY GEOCODE_LEVEL2[NAME] or BY GEOCODE_LEVEL3[NAME] or then Smkreport creates reports at each geographic level with its description and local time zone.
  CARB_QADEF:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or BY GEOCODE_LEVEL2[NAME] or BY GEOCODE_LEVEL3[NAME] or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  ELEVTS_L:
    default: blank
    description: "This variable is the same one used to control the Smkmerge output units. For Smkreport , it controls which ASCII elevated file to use, when the ASCIIELEV instruction is included in the REPCONFIG file. If the first letter of this setting is an \u201C m \u201D (for mole), then Smkreport opens the file to use in the report; otherwise, Smkreport opens and uses the ELEVTS_S file. This setting does not do anything to the behavior of Smkreport unless the ASCIIELEV setting is included in the REPCONFIG file. The default setting of MRG_GRDOUT_UNIT results in the ELEVTS_S file being used by Smkreport ."
  ELEVTS_S:
    default: blank
    description: "This variable is the same one used to control the Smkmerge output units. For Smkreport , it controls which ASCII elevated file to use, when the ASCIIELEV instruction is included in the REPCONFIG file. If the first letter of this setting is an \u201C m \u201D (for mole), then Smkreport opens the ELEVTS_L file to use in the report; otherwise, Smkreport opens and uses the file. This setting does not do anything to the behavior of Smkreport unless the ASCIIELEV setting is included in the REPCONFIG file. The default setting of MRG_GRDOUT_UNIT results in the ELEVTS_S file being used by Smkreport ."
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  GRIDDESC:
