  SMK_ASCIIELEV_YN:
    default: N
    description: 'Defines whether the program produces an ASCII elevated point sources file, suitable for postprocessing with the Ptsrce program in EPS2.0/EPS2.5. Y: Create the ASCII elevated point sources file N: Do not create the ASCII elevated point sources file'
  SMK_AVEDAY_YN:
    default: N
    description: 'Indicates whether or not to read average day emissions instead of annual emissions from the inventory file. Y: Read average day emissions N: Do not read average day emissions, use annual emissions instead. NOTE: This setting affects the Smkmerge results only when hourly emissions are not merged. To use hourly average-day emissions in Smkmerge , this variable must be set to Y for the Temporal program, so that average-day emissions will be used in creating the hourly emissions.'
  SMK_ELEV_METHOD:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on SMK_PING_METHOD will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed\
      \ earlier. In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation\
      \ in CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L."
  SMK_EMLAYS:
    default: '-1'
    description: Number of emissions layers; must be at least 4 otherwise program will not run. Used to set the default value for UAM_LAYERS when the Smkmerge output is to be used in UAM-V elevated-point-source output processing.
  SMK_PING_METHOD:
    default: '0'
    description: "Defines the method to use in SMOKE for determining and processing elevated point sources. The setting chosen depends on the model output format needed from SMOKE. All PinG sources determined based on will automatically be considered elevated sources (as defined specifically for the model for which you are creating emissions). 0: Treat all sources as potentially elevated, and let the Laypoint program determine which sources are elevated and which are not. This approach is appropriate only for SMOKE output for the CMAQ model. 1: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for any of the model output formats - CMAQ and UAM-style. For UAM-style emissions processing, this environment variable must be set to 1 and the PELVCONFIG file will be used to select specific sources. This method of processing is needed for UAM and CAM X because they require use of the cutoff method discussed earlier.\
      \ In rare cases of a very small inventory, it might be acceptable to specify 0 for this setting in UAM-style emissions processing, provided that you are sure that treating all sources as elevated sources in UAM-style models is acceptable. We do not recommend such an approach for typical SMOKE applications for UAM-style models. 2: Use the \u201C Elevated \u201D section of the PELVCONFIG configuration file to select specific sources. This approach can be used for in-line plume rise in CMAQ. Must set SMK_PING_METHOD = 0. For in-line plume rise processing in CMAQ, this environment variable must be set to 2 and the PELVCONFIG file will be used to select specific sources. To reduce the total number of plume rise calculations that would be done in the CMAQ in-line plume rise module, Elevpoint needs to group sources with nearly identical stack parameters. Elevpoint outputs stack group file that identifies elevated source locations and stack parameters for in-line plume rise calculation in\
      \ CMAQ. When using Smkmerge for in-line plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file. If SMKMERGE_CUSTOM_OUTPUT is set to Y, the output file for the in-line emissions is called INLNST_L. Creates CMAQ PinG file or flags PinG sources in UAM-style elevated ASCII file (when the SMK_ASCIIELEV_YN environment variable is set to Y)."
  SMK_REPORT_TIME:
    default: '230000'
    description: Time for writing daily reports from program (HHMMSS).
  SMK_SRCGROUP_OUTPUT_YN:
    default: N
    description: 'Indicates if source apportionment emissions should be output Y: Group sources and output source apportionment files N: Do not perform any source apportionment processing'
  SMK_SUB_SECTOR_OUTPUT_YN:
    default: N
    description: 'Indicates if sub-sector source group emissions should be output Y: Group sources and output sub-sector source group files N: Do not perform sub-sector source group processing'
  SOURCE_GROUPS:
    default: ''
    description: "(File) Source apportionment groups. The SOURCE_GROUPS file is used to define groups of sources when processing emissions for source apportionment. Movesmrg and Smkmerge read this file when SMK_SRCGROUP_OUTPUT_YN is set to Y. When reading the SOURCE_GROUPS file, SMOKE will skip lines with data that doesn't apply to the current source category. Lines that contain a plant ID or point ID will be skipped when processing area, biogenic, or mobile sources. Lines containing an SCC will be skipped when processing biogenic sources. If SMOKE encounters lines with duplicate grouping information (i.e. FIPS, SCC, point source characteristics), an error will be printed to the log and the program will quit. Multiple grouping criteria can be assigned to the same source group ID by using additional lines. In the example below, all sources with SCCs 2102001000, 2102002000, and 2102004000 will be assigned to source group 1. If the source grouping file contains a line with all blank or zero\
      \ source characteristics, SMOKE will use the given source group number as the default group rather than zero. For example, if the following line is included in the SOURCE_GROUPS file, the default source group number will be 40 instead of 0. The format of the SOURCE_GROUPS file is shown in Table 6.102, \u201CFormat for SOURCE_GROUPS \u201D ."
  SPC_INPUT:
    default: ''
    description: _S = mass-based speciation ( )
  SRCGROUPS_OUT:
    default: ''
    description: (File) Source group information, produced if SMK_SRCGROUP_OUTPUT_YN is set to Y
  SRCGRP_REPORT:
    default: ''
    description: (File) Source group report file, produced if SMK_SRCGROUP_OUTPUT_YN or SMK_SUB_SECTOR_OUTPUT_YN is set to Y
  STACK_GROUPS:
