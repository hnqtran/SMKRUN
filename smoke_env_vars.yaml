smkinven:
  ADAY | PDAY:
    default: ''
    description: (File) Day-specific inventory emissions assigned to sources in annual/average-day files (optional)
  AG:
    default: ''
    description: (File) Gridded annual or average-day data; this file can be created by Smkmerge and must be time-independent
  AHOUR | PHOUR:
    default: ''
    description: (File) Hour-specific inventory emissions assigned to sources in annual/average day files (optional)
  ALLOW_NEGATIVE:
    default: N
    description: 'Indicates if Smkinven should permit negative emissions values to be input from inventory files and output to SMOKE intermediate files. Y: Accept negative emissions values and will allow compute variables (from the SMKINVEN_FORMULA variable) to be negative. Smkinven gives warnings for each negative value in the inventory input and each computed value, until triggering the SMK_MAXWARNING setting''s values. N: Do not permit negative emissions values. Accept negative emissions values in the input inventory files, and will give errors for these. Smkinven will reset all negative computed values (from the SMKINVEN_FORMULA variable) to zero. Smkinven gives warnings for each negative computed value and indicates that the value was reset to zero.'
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  ARINV:
    default: '0'
    description: "Defines the number of month to process. The integer month number will allow users to pick monthly total inventory data in area FF10-formatted invenotry data listed at Table 6.15, \u201CFF10 Format for \u201D ."
  ARTOPNT:
    default: ''
    description: "FULLSCC_ONLY : Area-to-point conversions file. The ARTOPNT file provides the point-source locations to assign to stationary area and nonroad mobile sources. The file is separated into sections. Each section starts with a header that contains the SCCs that will receive the point-source locations and allocation factors contained in that section. Within the section, the content and format are similar to the EMS-HAP airport allocation factor files (e.g., ap_af1.sas7bdat ). Each section of the file starts with the following packet: /LOCATIONS/ <SCC 1> <SCC 2> . <SCC 9> for SCCs 1 through 9 that apply to the section. The SCCs must be full 10-digit SCCs separated by spaces. A maximum of 9 SCCs may appear in one /LOCATIONS/ packet. If more than 9 SCCs are needed for a specific section, then multiple /LOCATIONS/ packets can be included in subsequent rows prior to the section to which they apply. In other words, two or more lines in sequence may include the/LOCATIONS/ packet, and\
      \ all of the SCCs from both packets will be applied to the subsequent section of the file. Within each section delineated by the /LOCATIONS/ packets, the format is shown in Table 6.84, \u201CFormat for ARTOPNT \u201D . The section ends with the start of another packet (indicated by a new /LOCATIONS/ header line or with the end of the file. In this context, this option affects cross-referencing for the , and NHAPEXCLUDE files by preventing left-7 SCC assignments. It also prevents left-2 and left-4 SCC assignments for NHAPEXCLUDE."
  ASCC:
    default: ''
    description: '(File) Type: ASCII - list-directed Summary: This file simply lists the SCC codes in the raw inventory.'
  CEMSUM:
    default: ''
    description: (File) CEM summary data produced by CEMScan
  CHECK_STACKS_YN:
    default: Y
    description: 'Indicates if stack parameter values should be checked for missing or out-of-range values; only checked if SMK_SOURCE is set to P. Y: Check input stack parameters for missing or out-of-range values N: Do not check input stack parameter values'
  COSTCY:
    default: '5'
    description: Defines the default time zone to use for sources that do not match entries in the or the GEOCODE_LEVEL4 file.
  DAY_SPECIFIC_YN:
    default: N
    description: 'Defines whether to import day-specific inventory data. Y: Import day-specific data N: Do not import day-specific data'
  EXCLUDE_REF_SCC_YN:
    default: N
    description: "Defines whether to exclude a list of SCCs that are not listed in Section 6.10.11, \u201C SCCXREF : Reference SCC input file\u201D . This option is only applicable when USE_REF_SCC_YN is set to Y. Y: Import day-specific data N: Do not import day-specific data"
  FF10_AVEDAY_ANNINV_YN:
    default: N
    description: 'Uses area daily or hourly FF10-formatted invenotry as annual data. This will allow users to process ARDAY or ARHOUR invenotry data independently without artifical annual inventory data. Y: Use daily or hourly FF10-formatted inventory as annual data. N: Do not use daily or hourly FF10-formatted inventory as annual data. Just it as daily or hourly FF10-formatted inventory data.'
  FILL_ANNUAL:
    default: N
    description: "Allows annual data to be filled in with average-day data. Y: Use \u201C Y \u201D when annual emission numbers are blank for some records of the inventory but not all records. The emissions values will be filled in using the average-day emissions field, by multiplying the average-day number by the number of days in the inventory year (365 or 366). This option is useful when some sources have only annual data and some sources have only average-day data. Although the annual number will be filled in using the average-day one, the average-day emissions will be output from SMOKE as a whole. N: Do not fill in annual data based on average-day emissions values."
  FLOW_RATE_FACTOR:
    default: 0.0 ft 3 /MMBTU
    description: "Used to calculate hourly flow rates from hourly heat input when reading CEM data. If FLOW_RATE_FACTOR is set to zero or unset, then Smkinven will not calculate hourly flow rates. Detail information is described in Section 2.8.19, \u201CProcessing hour-specific CEM data\u201D hourly flow rate (m 3 /s) = [ FLOW_RATE_FACTOR (ft 3 /MMBTU) * hourly heat input (MMBTU/hr) * 0.02831 m 3 /ft 3 ] / 3600 s/hr"
  FULLSCC_ONLY:
    default: N
    description: Disables any sub-SCC cross-reference assignments that would otherwise be included in the cross-reference hierarchy. For example, the left-7, left-4, and left-2 levels of nonpoint and mobile SCCs would never be used. This is useful when zeros are a natural part of the SCC that the user does not want to assume are present for cross-reference hierarchy purposes. This option affects all Cntlmat input packets that use SCC assignments as part of their hierarchy. In this context, this option affects cross-referencing for the ARTOPNT , and NHAPEXCLUDE files by preventing left-7 SCC assignments. It also prevents left-2 and left-4 SCC assignments for NHAPEXCLUDE.
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: '5'
    description: Defines the default time zone to use for sources that do not match entries in the COSTCY or the file.
  GRIDMASK:
    default: ''
    description: (File) Defines an integer geocode to specify the predominant country and state code covered by each grid cell ( GEOCODE_LEVEL ) and an integer TZONES to specify the predominant Time Zone for each grid cell.
  HOURLY_TO_DAILY:
    default: N
    description: 'Defines whether to treat the hour-specific inputs as day-specific data. Y: Use daily-total column only from hour-specific input file, and process as day-specific data. This setting does not work for input of hour-specific data using CEM format. N: Treat hourly file as hourly data'
  HOURLY_TO_PROFILE:
    default: N
    description: 'Defines whether to treat the hour-specific inputs as hour-specific temporal profiles. Y: Treat hourly data as temporal profile, and divide each hourly value by value in the daily total column of the file. The values are not renormalized. The resulting hour-specific output file will be recognized by the Temporal program as containing hourly profiles. This setting does not work for input of hour-specific data using CEM format. N: Treat hourly file as hourly data'
  HOUR_SPECIFIC_YN:
    default: N
    description: 'Defines whether to import hour-specific inventory data. Y: Import hour-specific data N: Do not import hour-specific data'
  IMPORT_AVEINV_YN:
    default: Y
    description: 'Defines whether to import the annual and average-day inventory data. This is set to N to import day-specific or hour-specific data after Smkinven has previously been run for the annual and average-day data. Y: Import annual and average-day inventory data from PTINV file N: Use SMOKE inventory files from a previous run of Smkinven to get the SMOKE source characteristics to match with the day-specific and hour-specific sources'
  IMPORT_GRDIOAPI_YN:
    default: N
    description: 'Defines whether the program will import a gridded I/O API NetCDF inventory file. This setting can be used only with area-source processing, and it overrides all other program settings for importing data (e.g., day- and hour-specific data import will be shut off). Y: Import gridded I/O API data N: Do not import gridded I/O API data'
  INVNAME1:
    default: none
    description: Sets root for naming output map inventory file
  INVNAME2:
    default: none
    description: Sets root for naming output ASCII inventory file
  INVTABLE:
    default: ''
    description: "(File) Inventory table. The INVTABLE file replaces the SIPOLS and ACTVNAMS files previously used by SMOKE. Smkinven uses the inventory table to select the inventory pollutants that will be output by Smkinven . The valid pollutants are again checked at the end of SMOKE processing by Smkmerge , to ensure that the program knows about all of the pollutants and also to set the order of the output variables (output species are sorted by the order of the pollutants in the inventory table and for multiple species per pollutant, by alphabetical order). You can use the INVTABLE to drop inventory pollutants in Smkinven without having to modify the inventory files, simply by modifying INVTABLE . The units used in the SMOKE intermediate files are listed in this file. The SMOKE programs Spcmat , and Movesmrg use this file to determine which pollutants should be included in the NONHAPVOC or NONHAPTOG calculation. The inventory table also provides a way to assign the SPECIATE4 species\
      \ ID to any pollutant that is a Hazardous Air Pollutant (HAP) VOC. This assignment is not used directly by SMOKE, but rather is used by the Speciation Tool when creating VOC speciation profiles. This is used only when creating speciation profiles to support SMOKE runs that will combine criteria VOC and HAP VOC emissions, using the NHAPEXCLUDE file in the Smkinven program. More specifically, this can be done for the purpose of using VOC HAP emissions to augment VOC speciation profiles. Since the Inventory Table provides information to the Speciation Tool, this field is not used by SMOKE, but is included for continued integration of SMOKE inputs with the Speciation Tool. As described in the Smkinven documentation in Chapter 6, Smkinven in some cases will create \"no-integrate\" (NOI) HAP pollutant emissions from the inventory data by renaming the pollutant with a \"_NOI\" suffix applied to the end of the Inventory Data Name from the Inventory Table for such pollutants. Similarly, Smkinven\
      \ will automatically add all possibly needed \"_NOI\" pollutant names to the internal master list of valid pollutant names. This list would otherwise be limited to the contents of the INVTABLE file entries where the Keep column contains an \"Y\". Smkinven inserts these names in the master list such that the \"_NOI\" version of the pollutant name appears in the list just after the polutant on which the name is based. The inserted entries that include \"_NOI\" are made when the following values are included for the pollutant in the INVTABLE file. A \"Y\" appears in the \"Keep\" field A \"V\" or \"T\" appears in the \"VOC or TOG component\" field A \"Y\" appears in the \"Model species\" field Something other than \"Y\" appears in the \"Explicit in mechanism\" field (e.g., \"N\" or blank) It is possible for a user to choose two pollutants that result in double counting the emissions from the inventory. For example, you may want to model both benzo(a)pyrene and 7-PAH which, would result\
      \ in the emissions associated with CAS number 205992 (for benzo(a)pyrene) to be duplicated. The user is responsible for the choices made and the resulting changes in inventory mass. The format of the INVTABLE is shown in Table 6.91, \u201CFormat for INVTABLE \u201D . The columns in the INVTABLE are used as follows: Inventory data name: Unique name for pollutant or activity that will be stored and processed by SMOKE. Because of I/O API restrictions, these names can only include alphanumeric characters and underscores, and the first character must be a letter. In addition, because SMOKE uses double-underscore as a separator when appending to variable names, no double-underscores are permitted in these names. Mode: This three-letter code represents the emissions mode that SMOKE uses to augment the pollutant names. Emissions mode usually refers to the on-road or nonroad mobile exhaust or evaporative emissions. If present in a record of the Inventory Table, SMOKE will combine the Mode field\
      \ with the Inventory Data Name field using a double underscore. So, if the Inventory Data Name is \"VOC\" and the Mode is \"EXH\", then the pollutant name in SMOKE intermediate files will be stored as \"EXH__VOC\". Inventory Pollutant Code: This code represents the pollutant that is provided in the inventory file input into SMOKE, and is sometimes the Chemical Abstracts Service (CAS) number when the inventory uses CAS numbers to identify pollutants. Smkinven matches this code to a ORL-formatted inventory file to assign the combination of Mode and Inventory Data Name (columns 2 and 1 as described in the previous bullet), which is used in all subsequent SMOKE intermediate files and reports. This code is not used by SMOKE in any other way. SPECIATE4 ID: The SPECIATE4 ID is the unique species identifier in SPECIATE4 (the \"ID\" field in the SPECIES_PROPERTIES table). This code is not used by SMOKE, but rather is used during import of the Inventory Table to the Speciation Tool. Reactivity\
      \ group: The reactivity group for the ASPEN model. It is not used in SMOKE. Keep: Indicates whether SMOKE should keep the CAS number associated with this inventory data name. SMOKE will keep any inventory data with at least one CAS number with a Y. Factor: The adjustment factor to use in splitting the emissions associated with a CAS number into different inventory data names, or reducing the mass of a metal compound associated with a CAS number to account for the metal mass only. VOC or TOG component: A \u201C V \u201D should be entered if the CAS number is part of VOC emissions or TOG emissions. A \u201C T \u201D should be entered if the CAS number is part of TOG emissions only. An \u201C N \u201D should be entered if the CAS number is part of neither VOC or TOG. Any other value other than \u201C V \u201D or \u201C T \u201D will be treated as an \u201C N \u201D. Model species: A \u201C Y \u201D should be entered if the pollutant is also a VOC model species for the AQM being targeted\
      \ for the run. Any other values will be treated as an \u201C N \u201D. Explicit in mechanism: A \u201C Y \u201D should be entered if (1) the pollutant is a VOC species (the model-species column must be \u201C Y \u201D as well), and (2) that model-species is explicitly treated in the AQM\u2019s chemical mechanism. The pollutant can be an explicit species in the chemical mechanism only when the GSPRO file definitions of the lumped VOC species have been adjusted to account for the pollutants/species that are explicit in the mechanism. The current explicit-in-mechanism species being used in the toxics CB6 mechanism for CMAQ are formaldehyde, acetaldheyde, acrolein and 1,3 butadiene. Activity: A \u201C Y \u201D should be entered if the inventory data name is a type of activity instead of emissions. Any other values will be treated as an \u201C N \u201D. NTI: Code identifying a HAP on the Clean Air Act HAP list (list of 188 HAPs). Not currently used by SMOKE; will be used in the future for\
      \ growing HAP emissions to future years. Units: The units to store the data in the SMOKE intermediate files. This should be \u201C short tons/year \u201D for emissions values, \u201C miles/year \u201D for VMT, and \u201C miles/hr \u201D for speed. Although this is provided as an input field to allow possible future changes, these values should not be changed by the user and are unrelated to the units of the emissions in the input files. Inventory data descriptions: This is the description of the inventory data name listed in columns 1-11. CAS pollutant description: Describes the pollutant that is coming from the inventory that is being input into SMOKE."
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Smkinven
  MAX_STK_DIAMETER:
    default: '100.0'
    description: Define maximum stack diameter in unit of meter
  MAX_STK_HEIGHT:
    default: '5100.0'
    description: Define maximum stack height in unit of meter
  MAX_STK_TEMPERATURE:
    default: '2000.0'
    description: Define maximum stack exit temperature in unit of Kelvin
  MAX_STK_VELOCITY:
    default: '500.0'
    description: Define maximum stack exit velocity in unit of m/sec
  MBINV:
    default: ''
    description: "(File) Mobile-source activity and emissions. 6.2.5.1. ORL Format 6.2.5.2. FF10 Activity Inventory Format The MBINV file is the input mobile-source inventory data file. Two formats are available: one for activity data in FF10 format and one for emissions data in ORL format. 6.2.5.1. ORL Format The ORL format is list-directed and uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records are shown below: #ORL #TYPE Mobile Source Toxics Inventory #COUNTRY US #YEAR 1999 #DESC Draft 1999 version 2.0 The format for the data records is shown in Table 6.18, \u201CORL Format for MBINV \u201D . Table 6.18. ORL Format for MBINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 SCC Char(20) Source Classification Code (required) 3 POLID Char(16) Pollutant CAS number or other name (required; this is called the pollutant code in the NIF) 4 ANN_EMIS Real Annual emissions (short tons/year) (required) 5 AVD_EMIS\
      \ Real Average-day emissions (short tons/average day) (optional) 6 SRCTYPE Char(2) Source type; used by SMOKE in determining applicable MACT-based controls (required) 01 = major 02 = Section 12 area source 03 = nonroad 04 = onroad 7 DATA_SOURCE Char Flag indicating the source of the data (e.g., state submitted or EPA-computed) (optional; not currently used by SMOKE) 8 YEAR Char Year of the emissions (optional; not currently used by SMOKE) 9 TRIBAL_CODE Char(3) Indicates the particular tribe that submitted the data (optional; recommended) 10 CEFF Real Control Efficiency percentage (give value of 0-100) (optional; not currently used by SMOKE) 11 REFF Real Rule Effectiveness percentage (give value of 0-100) (optional; not currently used by SMOKE) 12 RPEN Real Rule Penetration percentage (give value of 0-100) (optional; not currently used by SMOKE) 13 CONTROL_MEASURES Char An & delimited list of control measure abbreviations (optional; not currently used by SMOKE) 14 PCT_REDUCTION Char\
      \ An & delimited list of percent reductions for the applied control measures (optional; not currently used by SMOKE) 15 CURRENT_COST Char The cost of the most recently applied control strategy for this source (optional; not currently used by SMOKE) 16 CUMULATIVE_COST Char The cumulative cost for all applied control measures (optional; not currently used by SMOKE) 6.2.5.2. FF10 Activity Inventory Format The FF10 format is list-directed and uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records are shown below: #FORMAT FF10_Activity #COUNTRY US #YEAR 2008 #DESC Annual Mobile Source Source Inventory #DESC FF10 The format for the data records is shown in Table 6.19, \u201CFF10 Format for MBINV \u201D . Table 6.19. FF10 Format for MBINV Position Name Type Required? Description 1 COUNTRY Char(3) Y Country code; default to \"US\" 2 REGION_CD Char(5) Y Region code for state and county (a.k.a. FIPS code) 3 TRIBAL CODE Char(3) N Indicates the particular\
      \ tribe that submitted the data (optional; not currently used by SMOKE) 4 CENSUS_TRACT Char(20) N Not currently used by SMOKE 5 SHAPE_ID Char(20) Char Shape Identification (optional; recommended) 6 SCC Char(20) Y SCC 7 ACT_PARM_TYPE Char(10) N Not currently used by SMOKE 8 ACT_PARM_UOFMSR Char(20) N 9 ACTIVITY_TYPE Char(16) Y Activity variable names are VMT, VPOP, and SPEED 10 ANN_PARM_VALUE Real Y Annual activity values in unit of miles/yr for annual VMT and miles/hr for SPEED 11 CALC_YEAR Int N Year of inventory 12 DATE_UPDATED Int N Updated Date in fomrat of YYYYMMDD 13 DATA_SET_ID Int N Not currently used by SMOKE 14 JAN_VALUE Real N Filled in only if data were provided for January in unit of miles/month for VMT and miles/hr for SPEED ... ... ... ... ... 27 DEC_VALUE Real N Filled in only if data were provided for December in unit of miles/month for VMT and miles/hr for SPEED 28 COMMENT Char N Optional; not currently used by SMOKE"
  MIN_STK_DIAMETER:
    default: '0.01'
    description: Define minimum stack diameter in unit of meter
  MIN_STK_HEIGHT:
    default: '0.5'
    description: Define minimum stack height in unit of meter
  MIN_STK_TEMPERATURE:
    default: '260.0'
    description: Define minimum stack exit temperature in unit of Kelvin
  MIN_STK_VELOCITY:
    default: '0.0001'
    description: Define minimum stack exit velocity in unit of m/sec
  MOBL:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  MSCC:
    default: ''
    description: '(File) Type: ASCII - list-directed Summary: This file simply lists the SCC codes in the raw inventory.'
  NHAPEXCLUDE:
    default: ''
    description: "FULLSCC_ONLY : NonHAP VOC calculation inclusions/exclusions file. The NHAPEXCLUDE file provides a way to exclude sources from the NONHAPVOC or NONHAPTOG calculation. For SMOKE versions 2.6 and higher, a new special header in the NHAPEXCLUDE file to allow Smkinven to either include or exclude sources from NONHAPVOC or NONHAPTOG calculation. When the header is defined as /INCLUDE/, Smkinven will treat selected sources as integrated sources; Smkinven will use the toxics pollutants from the selected sources to compute NONHAPVOC or NONHAPTOG. The toxic emissions will be retained or dropped by Smkinven , depending on the status of the pollutants in the INVTABLE file (see Section 6.10.4, \u201C INVTABLE : Inventory table\u201D ). If the pollutant is a model species and an explicit species, then the toxic emissions will not be dropped. If the pollutant is only a model species but not an explicit species, it will be renamed by appending \u201C _NOI \u201D to the species name. If\
      \ it is neither a model species nor an explicit species, the toxics mass will be dropped to prevent double counting of the inventory mass. When the header is defined as /EXCLUDE/ which is the default setting, Smkinven willl exclude the selected sources from the HAP-CAP integratoin approach. All other inventory sources will be used to compute NONHAPVOC or NONHAPTOG. The NHAPEXCLUDE file is only used when SMK_PROCESS_HAPS is set to PARTIAL . If SMK_PROCESS_HAPS is set to ALL or NONE , the NHAPEXCLUDE file is not required ( Section 4.14.3.2, \u201CInput Environment Variables\u201D ). Once integration/non-integration processing is done, Smkreport can create a report that separates integrated and non-integrated sources using the BY INTEGRATE instruction ( Section 5.3.3, \u201CCreate-report Section\u201D ). NOTE: Whenever SMK_PROCESS_HAPS is set to process HAPs, a new inventory pollutant, \u201C VOC_INV \u201D or \u201C TOG_INV \u201D, will be created to retain the original VOC or TOG values\
      \ for the purpose of creating quality assurance reports with Smkreport . The NHAPEXCLUDE file contains the country/state/county and SCC codes of those sources that SMOKE will include or exclude from the NONHAP calculation. The file format is shown in Table 6.94, \u201CFormat for NHAPEXCLUDE \u201D . For area/nonpoint, on-road mobile, and nonroad mobile sources, zeros can be used within the country/state/county code and the SCC code to make an entry more generic. For example, a SCC-only entry would have a zero for the country/state/county code. For a left-2 SCC entry, the final eight characters of the SCC would be zero. The following list illustrates entries for each of the 14 possible cross-reference levels. See Section 2.2.5, \u201CSource Classification Codes\u201D for more information about the different levels within an SCC. 001001 2501080050 (select a specific county and SCC) 001001 2501080000 (select a specific county and all SCCs that match levels 1, 2, and 3) 001001 2501000000\
      \ (select a specific county and all SCCs that match levels 1 and 2) 001001 2500000000 (select a specific county and all SCCs that match level 1) 001000 2501080050 (select a whole state and SCC) 001000 2501080000 (select a whole state and all SCCs that match levels 1, 2, and 3) 001000 2501000000 (select a whole state and all SCCs that match levels 1 and 2) 001000 2500000000 (select a whole state and all SCCs that match level 1) 001001 0000000000 (select all SCCs in a specific county) 001000 0000000000 (select all SCCs in a specific state) 000000 2501080050 (select a specific SCC) 000000 2501080000 (select all SCCs that match levels 1, 2, and 3) 000000 2501000000 (select all SCCs that match levels 1 and 2) 000000 2500000000 (select all SCCs that match level 1) For point sources, the available combinations depend on the source definition. A header is used in the file to indicate the source definition. The hierarchy of cross-referencing is the following. Country/state/county code, 10-digit\
      \ SCC, plant ID, point ID, stack ID, segment, and pollutant Country/state/county code, 10-digit SCC, plant ID, point ID, stack ID, and pollutant Country/state/county code, 10-digit SCC, plant ID, point ID, and pollutant Country/state/county code, 10-digit SCC, plant ID, and pollutant Country/state/county code, 10-digit SCC, plant ID, point ID, stack ID, and segment Country/state/county code, 10-digit SCC, plant ID, point ID, and stack ID Country/state/county code, 10-digit SCC, plant ID, and point ID Country/state/county code, 10-digit SCC, and plant ID Country/state/county code, 10-digit SCC, and pollutant Country/state code, 10-digit SCC, and pollutant 10-digit SCC and pollutant Country/state/county code and 10-digit SCC Country/state code and 10-digit SCC 10-digit SCC Country/state/county code Country/state code Ultimate default (all values = 0). In this context, this option affects cross-referencing for the ARTOPNT , and files by preventing left-7 SCC assignments. It also prevents\
      \ left-2 and left-4 SCC assignments for NHAPEXCLUDE."
  NONHAP_TYPE:
    default: VOC
    description: "Define the name of organic compound inventory pollutant VOC or TOG for a proper integration between VOC or TOG, and hazardous air pollutants (HAPs) to compute NONHAPVOC or NONHAPTOG. See Section 2.8.5, \u201CCombine toxics and criteria inventories\u201D for a more detail description of criteria/HAP VOC integration. This option will be used only when SMK_PROCESS_HAPS is set."
  NO_STACK_REPLACE_FUGITIVE:
    default: N
    description: 'Defines whether the program skips correcting any missing and/or out-of-range stack parameters. Y: Skip correcting any missing and/or out-of-range stack parameters N: Do not skip correcting any missing and/or out-of-range stack parameters'
  ORISDESC:
    default: ''
    description: "(File) ORIS description. The ORISDESC file provides descriptive information for the ORIS IDs, which Smkinven uses when reporting the status of reading and matching CEM data. The information in this file will appear in the REPINVEN output file from Smkinven . The format of the ORISDESC file is shown in Table 6.95, \u201CFormat for ORISDESC \u201D . Note that only the first five columns of data need to appear in the file; the rest can be blank because SMOKE does not use any information past column E."
  OUTPUT_LOCAL_TIME:
    default: N
    description: 'Defines whether the program processes daily/hourly inventories in local time or not. Y: Process daily/hourly inventories in local time. No time zone shift. N: Apply time zone shift.'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PROCESS_MULT_ORIS_UNITS_YN:
    default: N
    description: 'Defines whether the program considers ORIS and Boiler IDs as additional source characteristics along with native point inventory source characteristics (i.e., facility, unit, release point, and process IDs). Y: Consider ORIS/Boiler IDs along with native point characteristics. NOTE that this option will internally modify the unit IDs by appending ''_##'' when there are multiple ORIS/Boiler IDs Continuous Emissions Monitoring (CEM) sources under same unit IDs. N: Do not consider ORIS/Boiler IDs as point characteristics.'
  PSCC:
    default: ''
    description: '(File) Type: ASCII - list-directed Summary: This file simply lists the SCC codes in the raw inventory.'
  PSTK:
    default: ''
    description: "(File) Point source stack replacement parameters file. The PSTK file is an ASCII file that contains the replacement stack parameters that Smkinven uses when stack parameters are missing from the inventory. The format of the file permits stack parameters to be replaced based on the point sources\u2019 country/state/county code and SCC and is shown in Table 6.82, \u201CFormat for PSTK \u201D ."
  PTDAY:
    default: ''
    description: "(File) Point source day-specific emissions. 6.2.6.1. FF10 Format 6.2.6.2. ORL FIREEMIS Emission Format The PTDAY file is the input point-source inventory file for day-specific data. The file must be a list file (see Section 6.2.1.1, \u201CInventory list files\u201D ) and the files listed in the PTDAY file must be in the format shown in Table 6.20, \u201CFF10 Format for individual point day-specific data files\u201D and Table 6.21, \u201CFormat for individual day-specific data files for fires : ORL FIREEMIS\u201D . The contents of the day-specific data files vary depending on whether the PTINV file is in FF10 or ORL FIRE format. The day-specific files can have a #COUNTRY header entry to set the country code (see Section 6.2.1.4, \u201CHeader records\u201D ). If no #COUNTRY header is used, then SMOKE will use the default country code of 0 (which corresponds to the United States in the default COSTCY file). 6.2.6.1. FF10 Format This FF10 format uses the header described in\
      \ Section 6.2.1.4, \u201CHeader records\u201D . For daily or hourly specific emissions, the user specifies the data provided using this command in the header: FF10_DAILY_POINT. Sample header records for daily point source data are shown below: #FORMAT FF10_DAILY_POINT #COUNTRY US #YEAR 2005 #DESC Point Daily Source Inventory #DESC FF10 Point Daily format Table 6.20. FF10 Format for individual point day-specific data files Position Name Type Description 1 COUNTRY Char(3) Country code: e.g., US (required) 2 REGION_CD Char(5) Region code for state and county (a.k.a. FIPS code; required) 3 TRIBAL_CODE Char(3) Tribal code (optional; recommended) 4 FACILITY_ID Char(20) Facility Identification Code (required; same as the Plant ID in the ORL format) 5 UNIT_ID Char(20) Unit Identification Code (required; same as the Point ID in the ORL format) (required) 6 REL_POINT_ID Char(20) Release Point Identification Code (recommended; same as the Stack ID in the ORL format) 7 PROCESS_ID Char(20) Process\
      \ Identification Code characters (recommended; same as the Segment ID in the ORL format) 8 SCC Char(20) SCC (required) 9 POLID Char(16) Pollutant Code (required) 10 OP_TYPE_CD Char(20) Operating type code for startup/shutdown/upset (optional; not currently used by SMOKE) 11 CALC_METHOD Int CALC_METHOD (optional; not currently used by SMOKE) 12 DATE_UPDATED Int Updated date in format of YYYYMMDD (optional; not currently used by SMOKE) 13 MONTH Int Month of inventory (required) 14 MONTHTOT Real Monthly Total (short tons/month) (required) 15 DAYVAL1 Real Daily emissions for day 1 (short tons/day) (required) 16 DAYVAL2 Real Daily emissions for day 2 (short tons/day) (required) 17 DAYVAL3 Real Daily emissions for day 3 (short tons/day) (required) .. .. 45 DAYVAL31 Real Daily emissions for day 31 (short tons/day) (required) 46 COMMENT Char (optional) 6.2.6.2. ORL FIREEMIS Emission Format The SMOKE requires that the sources in the day-specific fires inventory format ( #ORL FIREEMIS ) PTDAY\
      \ file also be in the PTINV file described in Section 6.2.8.3, \u201CORL FIRE Format\u201D . The values of the fields that are common to the day-specific data and the master (annual) data from PTINV are used to match exactly by country/state/county code, fire identification, location identification, and SCC. Default daily ACRESBURNED and FUEL_LOAD input are required to internally estimate heat flux for the fire-specific plume-rise computation. Fire duration information, such as BEGHOUR and ENDHOUR are used to adjust the hourly temporal profile. NOTE: All inventory pollutant names need to be listed in the master (annual) PTINV and the day-specific PTDAY files using a header record #DATA . Sample header records are shown below: #ORL FIREEMIS #TYPE Day-specific Point Source Inventory for FIRES #COUNTRY US #YEAR 2002 #DESC FIPS,FIREID,LOCID,SCC,DATA,DATE,DATA_VALUE,BEGHOUR,ENDHOUR The format for the data records is shown in Table 6.21, \u201CFormat for individual day-specific data files\
      \ for fires : ORL FIREEMIS\u201D . Table 6.21. Format for individual day-specific data files for fires : ORL FIREEMIS Position Name Type Description 1 FIPS Char(5) State and County code (required) 2 FIREID Char(20) Fire idenfication code (required) 3 LOCID Char(15) Location identification code (required) 4 SCC Char(20) SCC Flaming or Smoldering (required) 5 POLID Char(16) The pollutant codes, \"ACRESCBURNED\", or \"FUEL_LOAD\" (16 characters) (required) 6 DATE Char(8) MM/DD/YY format. Years less than 70 are treated as century 2000 (8 characters) (required) 7 DATA_VALUE Real If \"POLID\" is a pollutant, it represents the daily total emissions (short tons/day). If not, ACRESBURNED in the unit of acres/day, FUEL_LOAD in the unit of tons/acres, and HEATFLUX in the unit of BTU/day. (required) 8 BEGHOUR Int Hour of the day that the fire began (0 to 23) (required) 9 ENDHOUR Int Hour of the day that the fire ended (0 to 23) (required)"
  PTHOUR:
    default: ''
    description: "(File) Point source hour-specific emissions. 6.2.7.1. Date range setting 6.2.7.2. CEM hour-specific format 6.2.7.3. FF10 hour-specific format 6.2.7.4. EMS-95 Format and EMS-95 Wider Format The PTHOUR file is the input point-source inventory file for hour-specific data and profiles. The file must be a list file (see Section 6.2.1.1, \u201CInventory list files\u201D and the files listed in the PTHOUR file must be in Continuous Emissions Monitoring (CEM) format when processing hourly CEM inventory data files with an format identifier (#CEM) or the format can be specified in the PTHOUR list file (#LIST CEM). In addition, these files can have a #COUNTRY entry to set the country code (see Section 6.2.1.4, \u201CHeader records\u201D . The default country code is 0, which corresponds to the United States in the default COSTCY file. 6.2.7.1. Date range setting The PTHOUR file may optionally contain a packet to control the range of dates for which Smkinven will read data. When this\
      \ feature is needed, the following entry should appear on the first line of the PTHOUR file. DATERANGE MMDD(start) MMDD(end) where MMDD is the two-digit month and day of the month at the start and end of the period of interest. For example, to request July 10th through 12th, the first line of the file should read: DATERANGE 0710 0712 The year is implied by the data themselves; note that the files can only contain data for a single year. As an alternative to using the DATERANGE packet, you can manually break the year up into smaller periods in separate files, and only list the files of interest in the PTHOUR file. Note that reading in the whole year of data and extracting just a few days will take much more time than manually editing the file to contain just the days of interest. Also note that if you choose the manual editing option, you must select days that fully cover the modeling episode after accounting for time zone differences between the facility\u2019s time zone and the modeling\
      \ time zone (set by the OUTZONE option). 6.2.7.2. CEM hour-specific format SMOKE uses the CEM ORIS ID and Boiler ID fields to match sources in the CEM hour-specific inventory to those in the annual inventory. Note that the CEM data hours are in standard local time (no daylight saving time adjustment). The format of the CEM hour-specific data is shown in Table 6.22, \u201CCEM Format for individual hour-specific data files\u201D . Table 6.22. CEM Format for individual hour-specific data files Position Name Type Description 1 ORISID Char (6) DOE Plant Identification Code (required) 2 BLRID Char (6) Boiler Identification Code (required) 3 YYMMDD Int Date of data in YYMMDD format (required) 4 HOUR Integer Hour value from 0 to 23 5 NOXMASS Real Nitrogen oxide emissions (lb/hr) (required) 6 SO2MASS Real Sulfur dioxide emissions (lb/hr) (required) 7 NOXRATE Real Nitrogen oxide emissions rate (lb/MMBtu) (not used by SMOKE) 8 OPTIME Real Fraction of hour unit was operating (optional) 9 GLOAD\
      \ Real Gross load (MW) (required) 10 SLOAD Real Steam load (1000 lbs/hr) (required) 11 HTINPUT Real Heat input (mmBtu) (required) 12 HTINPUTMEASURE Character(2) Code number indicating measured or substituted, not used by SMOKE. 13 SO2MEASURE Character(2) Code number indicating measured or substituted, not used by SMOKE. 14 NOXMMEASURE Character(2) Code number indicating measured or substituted, not used by SMOKE. 15 NOXRMEASURE Character(2) Code number indicating measured or substituted, not used by SMOKE. 16 UNITFLOW Real Flow rate (ft3/sec) for the Boiler Unit (optional; must be present for all records or not any records \u2013 not yet used by SMOKE) The code numbers used in columns 12 through 15 have the following meanings: 01 = 'Measured' 02 = 'Calculated' 03 = 'Substitute' 04 = 'Measured and Substitute' 97 = 'Not Applicable' 98 = 'Undetermined' 99 = 'Unknown Code' 6.2.7.3. FF10 hour-specific format This FF10 format uses the header described in Section 6.2.1.4, \u201CHeader records\u201D\
      \ . The user specifies the data provided using this command in the header: FF10_HOURLY_POINT. Sample header records for hourly point sources are shown below: #FORMAT=FF10_HOURLY_POINT #COUNTRY US #YEAR year of inventory, e.g. 2008 #DESC Point Hourly Source Inventory #DESC FF10 Point Hourly format Table 6.23. FF10 Format for individual point hour-specific data files Position Name Type Description 1 COUNTRY Char(3) Country code: e.g., US (required) 2 REGION_CD Char(5) Region code for state and county (a.k.a. FIPS code; required; example 037001) 3 TRIBAL_CODE Char(3) Tribal code (optional; recommended) 4 FACILITY_ID Char(20) Facility Identification Code (required; same as the Plant ID in the ORL format) 5 UNIT_ID Char(20) Unit Identification Code (required; same as the Point ID in the ORL format) 6 REL_POINT_ID Char(20) Release Point Identification Code (required; same as the Stack ID in the ORL format) 7 PROCESS_ID Char(20) Process Identification Code (recommended; same as the Segment\
      \ ID in the ORL format) 8 SCC Char(20) SCC (required) 9 POLID Char(16) Pollutant Code (required) 10 OP_TYPE_CD Char(20) Operating type code for startup/shutdown/upset (optional; not currently used by SMOKE) 11 CALC_METHOD Int CALC_METHOD (optional; not currently used by SMOKE) 12 DATE_UPDATED Int Updated date in format of YYYYMMDD (optional; not currently used by SMOKE) 13 DATE Int Date of inventory in format of YYYYMMDD (required) 14 DAYTOT Real Daily Total (short tons/day) (required if SMKINVEN_MONTH is set to 0) 15 HRVAL0 Real Hourly emission for hour 0 (short tons/hour) (required) 16 HRVAL1 Real Hourly emission for hour 1 (short tons/hour) (required) 17 HRVAL2 Real Hourly emission for hour 2 (short tons/hour) (required) .. .. 34 HRVAL23 Real Hourly emission for hour 23 (short tons/hour) (required) 35 COMMENT Char (optional) 6.2.7.4. EMS-95 Format and EMS-95 Wider Format For EMS-95 formatted data, SMOKE requires that the sources in the PTHOUR file also be in the PTINV file. The\
      \ values of the fields that are common to the hour-specific data and the annual data need to match exactly. These fields are Facility ID, Stack ID, Device ID, and Process ID. These fields are treated as text fields (not numeric) in SMOKE, so leading zeros need to be consistent between the hour-specific and annual or average-day inventory files. There are two types of EMS-95 format available for hour-specific data. The traditional EMS-95 format is shown in Table 6.24, \u201CEMS-95 Format for individual hour-specific files\u201D and the wider EMS-95 format is shown in Table 6.25, \u201CEMS-95 Wider Format for individual hour-specific files\u201D . The traditional EMS-95 format has 7 columns available for the emissions values instead of 12 columns in the EMS-95 wider format. For some air pollutant values, the 7 columsns was not big enough to capture the low precision unless scientific notation is used. To use the EMS-95 wider format, the optional environmental variable HOURLY_WIDE_FMT\
      \ needs to be set to Y . To process pollutant names greater than 5 characters, you need to add the new field of inventory pollutant code known as CAS number from column 261 to 276. If this new field is filled, the POLID is not used. If the new field is not filled, the POLID is required to use the inventory data name. The CAS number will be used to distinguish which chemical compound or inventory pollutant is provided on each line of the file. Smkinven matches these numbers with the CAS numbers from an inventory table ( INVTABLE ) file, described in Section 6.10.4, \u201C INVTABLE : Inventory table\u201D . The CAS number does not necessarily have to be a valid CAS number; it can be any number as long as there is a match between the numbers in the SMOKE ORL file and the inventory table. Table 6.24. EMS-95 Format for individual hour-specific files Position Name Type Description 1-2 STID Int State Code (required) 3-5 CYID Int County Code (required) 6-20 FCID Char Facility ID (a.k.a. Plant\
      \ ID) (required) 21-32 SKID Char If PTINV in FF10 format: Unit ID (required) If PTINV in ORL format: Point ID 33-44 DVID Char If PTINV in FF10 format: Release Point ID (required) If PTINV in ORL format: Stack ID 45-56 PRID Char If PTINV in FF10 format: Process ID (required) If PTINV in ORL format: Segment 57-61 POLID Char Pollutant name (required) 62-69 DATE Char Date in MM/DD/YY format. Years less than 70 are treated as century 2000 (required) 70-72 TZONNAM Char Time zone name associated with emissions data. Valid entries are GMT, ADT, AST, EDT, EST, CDT, CST, MDT, MST, PDT, and PST. (required) 73-79 HRVAL1 Real Hourly emissions for hour 1 (short tons/hour) (required) 80-86 HRVAL2 Real Hourly emissions for hour 2 (short tons/hour) (required) 87-93 HRVAL3 Real Hourly emissions for hour 3 (short tons/hour) (required) ... 234-240 HRVAL24 Real Hourly emissions for hour 24 (short tons/hour) (required) 241-248 DAYTOT Real Daily emissions total (short tons/day) 250-259 SCC Char SCC (required).\
      \ 261-276 DATNAM Char Inventory Pollutant Code (16-characters) (optional) that matches same column of Inventory Table. It is the name of the pollutants used in the ORL inventory files. This field should be used instead of the \" POLID \" field when pollutant anmes are longer than 5 characters. If this field is filled, POLID is not used. Table 6.25. EMS-95 Wider Format for individual hour-specific files Position Name Type Description 1-2 STID Int State Code (required) 3-5 CYID Int County Code (required) 6-20 FCID Char Facility ID (a.k.a. Plant ID) (required) 21-32 SKID Char If PTINV in FF10 format: Unit ID (required) If PTINV in ORL format: Point ID 33-44 DVID Char If PTINV in FF10 format: Release Point ID (required) If PTINV in ORL format: Stack ID 45-56 PRID Char If PTINV in FF10 format: Process ID (required) If PTINV in ORL format: Segment 57-61 Leave blank 62-69 DATE Char Date in MM/DD/YY format. Years less than 70 are treated as century 2000 (required) 70-72 TZONNAM Char Time zone\
      \ name associated with emissions data. Valid entries are GMT, ADT, AST, EDT, EST, CDT, CST, MDT, MST, PDT, and PST. (required) 73-84 HRVAL1 Real Hourly emissions for hour 1 (short tons/hour) (required) 85-96 HRVAL2 Real Hourly emissions for hour 2 (short tons/hour) (required) 97-108 HRVAL3 Real Hourly emissions for hour 3 (short tons/hour) (required) ... 349-360 HRVAL24 Real Hourly emissions for hour 24 (short tons/hour) (required) 361-372 DAYTOT Real Daily emissions total (short tons/day) 373-380 SCC Char SCC (required). 381-396 DATNAM Char Inventory Pollutant Code (16-characters) (optional) that matches same column of Inventory Table. It is the name of the pollutants used in the ORL inventory files. This field should be used instead of the \" POLID \" field when pollutant anmes are longer than 5 characters. If this field is filled, POLID is not used."
  PTINV:
    default: Y
    description: 'Defines whether to import the annual and average-day inventory data. This is set to N to import day-specific or hour-specific data after Smkinven has previously been run for the annual and average-day data. Y: Import annual and average-day inventory data from file N: Use SMOKE inventory files from a previous run of Smkinven to get the SMOKE source characteristics to match with the day-specific and hour-specific sources'
  RAW_DUP_CHECK:
    default: N
    description: 'Defines whether the program checks for duplicate records in the input file. Y: Check for duplicates, and produce a fatal error if found N: Do not check for duplicates, and add emissions from duplicate records'
  REPINVEN:
    default: ''
    description: "(File) Type: ASCII - list-directed Summary: This report is made up of several different sections describing different parts of the inventory import. This section lists, by CAS number, the emissions in tons/year; the number of inventory records; whether all, some, or none of the pollutants associated with that CAS number were kept; and the CAS number description. The columns in the report include: CAS number Whether all, some, or none of the pollutants were kept Number of inventory records read for the CAS number Emissions for the CAS number CAS number description This section includes emissions before and after application of disaggregation factors from the INVTABLE . Only the pollutants that have Keep = Y in INVTABLE will be included in this report. This report will be provided only if disaggregation and/or aggregation have occurred. The columns in the report include: \u201C Kept \u201D unique CAS number Emissions total for the CAS number Factor used to adjust the CAS\
      \ number to the pollutant Pollutant name Emissions total of the inventory pollutant Pollutant description CAS number description The following sections are only for area-to-point assignments: This section lists SCCs that have area-to-point source factor file assignments but are not in the inventory. The columns in the report include: Assigned SCC codes not in the inventory For emissions going to point sources, this section lists the pollutant name, emissions total before and after the factors are applied, and the total number of FIPS codes affected, by SCC. The columns in the report include: SCC code Pollutant name Number of FIPS codes affected Emissions before factors are applied Emissions after factors are applied SCC description Same as the above section, except emissions are reported by state. The columns in the report include: State SCC code Pollutant name Number of FIPS codes affected Emissions before factors are applied Emissions after factors are applied SCC description This\
      \ section lists, by SCC, the number of state and county FIPS codes getting assigned to point locations and the number not getting assigned. The columns in the report include: SCC code Number of FIPS assigned to point locations Number of FIPS not assigned to point locations SCC description"
  SCCDESC:
    default: ''
    description: "(File) Source category code descriptions. This file provides textual descriptions of the SCCs, which are used by two programs: Smkinven when reading hourly emissions data (for reporting in the REPINVEN output file) Smkreport when the user requests the SCC description be included in the report. There are delimited and fixed formats available for the SCCDESC file shown in Table 6.97, \u201CDelimited format for SCCDESC \u201D and Table 6.98, \u201CFixed format for SCCDESC \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the SCCDESC file is shown in Table 6.97, \u201CDelimited format for SCCDESC \u201D ."
  SCCXREF:
    default: N
    description: "Defines whether to exclude a list of SCCs that are not listed in Section 6.10.11, \u201C : Reference SCC input file\u201D . This option is only applicable when USE_REF_SCC_YN is set to Y. Y: Import day-specific data N: Do not import day-specific data"
  SMKINVEN_FORMULA:
    default: N
    description: 'Indicates if Smkinven should permit negative emissions values to be input from inventory files and output to SMOKE intermediate files. Y: Accept negative emissions values and will allow compute variables (from the variable) to be negative. Smkinven gives warnings for each negative value in the inventory input and each computed value, until triggering the SMK_MAXWARNING setting''s values. N: Do not permit negative emissions values. Accept negative emissions values in the input inventory files, and will give errors for these. Smkinven will reset all negative computed values (from the SMKINVEN_FORMULA variable) to zero. Smkinven gives warnings for each negative computed value and indicates that the value was reset to zero.'
  SMKINVEN_MONTH:
    default: '0'
    description: "Defines the number of month to process. The integer month number will allow users to pick monthly total inventory data in area FF10-formatted invenotry data listed at Table 6.15, \u201CFF10 Format for ARINV \u201D ."
  SMK_ARTOPNT_YN:
    default: N
    description: 'Y: Assign X and Y coordinates to specified sources based on the ARTOPNT cross-reference file N: Do not perform area-to-point processing'
  SMK_BASEYR_OVERRIDE:
    default: '0'
    description: Used to override the base year determined by the inventory.
  SMK_DEFAULT_TZONE:
    default: '5'
    description: Defines the default time zone to use for sources that do not match entries in the COSTCY or the GEOCODE_LEVEL4 file.
  SMK_MAXERROR:
    default: '100'
    description: Defines the maximum number of ERROR statements to be displayed by SMOKE.
  SMK_MAXWARNING:
    default: N
    description: 'Indicates if Smkinven should permit negative emissions values to be input from inventory files and output to SMOKE intermediate files. Y: Accept negative emissions values and will allow compute variables (from the SMKINVEN_FORMULA variable) to be negative. Smkinven gives warnings for each negative value in the inventory input and each computed value, until triggering the setting''s values. N: Do not permit negative emissions values. Accept negative emissions values in the input inventory files, and will give errors for these. Smkinven will reset all negative computed values (from the SMKINVEN_FORMULA variable) to zero. Smkinven gives warnings for each negative computed value and indicates that the value was reset to zero.'
  SMK_PROCESS_HAPS:
    default: VOC
    description: "Define the name of organic compound inventory pollutant VOC or TOG for a proper integration between VOC or TOG, and hazardous air pollutants (HAPs) to compute NONHAPVOC or NONHAPTOG. See Section 2.8.5, \u201CCombine toxics and criteria inventories\u201D for a more detail description of criteria/HAP VOC integration. This option will be used only when is set."
  SMK_SOURCE:
    default: Y
    description: 'Indicates if stack parameter values should be checked for missing or out-of-range values; only checked if is set to P. Y: Check input stack parameters for missing or out-of-range values N: Do not check input stack parameter values'
  SMK_TMPDIR:
    default: .
    description: Sets the path for writing temporary files needed when importing the inventory.
  SMOKE:
    default: N
    description: 'Indicates if Smkinven should permit negative emissions values to be input from inventory files and output to intermediate files. Y: Accept negative emissions values and will allow compute variables (from the SMKINVEN_FORMULA variable) to be negative. Smkinven gives warnings for each negative value in the inventory input and each computed value, until triggering the SMK_MAXWARNING setting''s values. N: Do not permit negative emissions values. Accept negative emissions values in the input inventory files, and will give errors for these. Smkinven will reset all negative computed values (from the SMKINVEN_FORMULA variable) to zero. Smkinven gives warnings for each negative computed value and indicates that the value was reset to zero.'
  USE_EXP_GEO_CODES:
    default: N
    description: If set to Y then use GEOCODE_LEVEL[1-4] files instead of the COSTCY file to define expanded geographical detail such as country-level(GEOCODE_LEVEL1), country/state-level (GEOCODE_LEVEL2), country/state/county-level (GEOCODE_LEVEL3) or country/state/county/tribal-level (GEOCODE_LEVEL4).
  USE_REF_SCC_YN:
    default: N
    description: "Defines whether to exclude a list of SCCs that are not listed in Section 6.10.11, \u201C SCCXREF : Reference SCC input file\u201D . This option is only applicable when is set to Y. Y: Import day-specific data N: Do not import day-specific data"
  VELOC_RECALC:
    default: N
    description: 'Defines whether stack velocity is recalculated in order to make the velocity consistent with the reported flow and diameter. Y: Recalculate stack velocity N: Output the input stack velocity'
  WEST_HSPHERE:
    default: Y
    description: 'Defines how spatial coordinates are interpreted. Y: Convert longitudinal coordinates for the Western Hemisphere (positive values are converted to negative values) N: Do not convert longitude values (positive values are not changed)'
  WKDAY_NORMALIZE:
    default: N
    description: "Clarifies the nature of the \u201C average-day \u201D data read in by Smkinven and will impact the Temporal program processing of average-day data for all formats. Y: Average-day emissions input to Smkinven are based on weekday emissions only. In Temporal , these emissions will be adjusted with weekly profiles normalized with weekdays only (Monday through Friday) N: Average-day emissions input to Smkinven are based on all days of the week . In Temporal , these emissions will be adjusted with weekly profiles normalized with all days of the week."
  WRITE_ANN_ZERO:
    default: N
    description: 'Indicates if annual emission values equal to zero should be written to the intermediate inventory file Y: Write zero emission values; this option makes the intermediate inventory file larger but is sometimes necessary when only daily or hourly data is provided and the entries in the annual inventory are dummy values N: Do not write zero values'
smkmerge:
  ACMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven , Smkmerge , and Smkreport'
  AGMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  AG[T][S][C][3D][_S|_L][_O]:
    default: ''
    description: '(File) Merged emission file, produced when MRG_GRDOUT_YN is set to Y; actual file name is determined by the environment variables used to configure Smkmerge , as follows: [area|biogenic|mobile|point|every] ( MRG_SOURCE ) T = temporally allocated ( MRG_TEMPORAL_YN ) S = speciated ( MRG_SPCMAT_YN ) C = controlled ( MRG_CTLMAT_MULT or MRG_CTLMAT_REAC ) 3D = layered ( MRG_LAYERS_YN ) _S = mass-based speciation ( SPC_INPUT ) _L = mole-based speciation ( SPC_INPUT ) _O = used when only merging biogenic sources ( MRG_SOURCE = B)'
  AOUT:
    default: N
    description: 'Defines his/her own output file names from Smkmerge . Manually define environment variables for those output file names below: : Processing source output file ELEV : Elevated-point-sources file, produced if SMK_ASCIIELEV_YN is set to Y; if PinG sources have also been selected, then the stack diameters listed in this file will be set to the negative value of their actual value. PING : CMAQ PinG file, produced if SMK_PING_METHOD is set to 1 INLN : CMAQ 2-D surface layer emissions file, produced if SMK_ELEV_METHOD is set to 2. For in-line processing plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file for CMAQ version 4.7 or later. REP[E|A|M|P]G : Emission total report file, produced if either MRG_REPSTA_YN or MRG_REPCNY_YN is set to Y'
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  AREA_SURROGATE_NUM:
    default: '60'
    description: Surrogate code of the area surrogate in the BGPRO file, to use for totals of biogenic emissions by state and county.
  ARMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven and Smkmerge'
  ASMAT:
    default: ''
    description: (File) Mass- or mole-based speciation matrix from Spcmat (used when MRG_SPCMAT_YN = Y)
  ATMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  ATMP_{DAY}:
    default: ''
    description: (File) Hourly emissions from Temporal by day, where {day} = MON, TUE, WED, THU, FRI, SAT, SUN (used when MRG_TEMPORAL_YN = Y and MRG_BYDAY is set)
  BGPRO:
    default: '60'
    description: Surrogate code of the area surrogate in the file, to use for totals of biogenic emissions by state and county.
  BGTS:
    default: ''
    description: (File) Biogenic model-ready emissions, to be input only when merging with other source categories, or when computing biogenic state and county totals, produced by Tmpbeis3 or Tmpbeis4
  BG[T][S][C][3D][_S|_L][_O]:
    default: ''
    description: '(File) Merged emission file, produced when MRG_GRDOUT_YN is set to Y; actual file name is determined by the environment variables used to configure Smkmerge , as follows: [area|biogenic|mobile|point|every] ( MRG_SOURCE ) T = temporally allocated ( MRG_TEMPORAL_YN ) S = speciated ( MRG_SPCMAT_YN ) C = controlled ( MRG_CTLMAT_MULT or MRG_CTLMAT_REAC ) 3D = layered ( MRG_LAYERS_YN ) _S = mass-based speciation ( SPC_INPUT ) _L = mole-based speciation ( SPC_INPUT ) _O = used when only merging biogenic sources ( MRG_SOURCE = B)'
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  EG[T][S][C][3D][_S|_L][_O]:
    default: ''
    description: '(File) Merged emission file, produced when MRG_GRDOUT_YN is set to Y; actual file name is determined by the environment variables used to configure Smkmerge , as follows: [area|biogenic|mobile|point|every] ( MRG_SOURCE ) T = temporally allocated ( MRG_TEMPORAL_YN ) S = speciated ( MRG_SPCMAT_YN ) C = controlled ( MRG_CTLMAT_MULT or MRG_CTLMAT_REAC ) 3D = layered ( MRG_LAYERS_YN ) _S = mass-based speciation ( SPC_INPUT ) _L = mole-based speciation ( SPC_INPUT ) _O = used when only merging biogenic sources ( MRG_SOURCE = B)'
  ELEV:
    default: N
    description: 'Defines his/her own output file names from Smkmerge . Manually define environment variables for those output file names below: [E|A|M|P]OUT : Processing source output file : Elevated-point-sources file, produced if SMK_ASCIIELEV_YN is set to Y; if PinG sources have also been selected, then the stack diameters listed in this file will be set to the negative value of their actual value. PING : CMAQ PinG file, produced if SMK_PING_METHOD is set to 1 INLN : CMAQ 2-D surface layer emissions file, produced if SMK_ELEV_METHOD is set to 2. For in-line processing plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file for CMAQ version 4.7 or later. REP[E|A|M|P]G : Emission total report file, produced if either MRG_REPSTA_YN or MRG_REPCNY_YN is set to Y'
  ELEV[T]S[C][_S|_L]:
    default: ''
    description: (File) Elevated-point-sources file, produced if SMK_ASCIIELEV_YN is set to Y; if PinG sources have also been selected, then the stack diameters listed in this file will be set to the negative value of their actual value
  EOUT:
    default: N
    description: 'Defines his/her own output file names from Smkmerge . Manually define environment variables for those output file names below: : Processing source output file ELEV : Elevated-point-sources file, produced if SMK_ASCIIELEV_YN is set to Y; if PinG sources have also been selected, then the stack diameters listed in this file will be set to the negative value of their actual value. PING : CMAQ PinG file, produced if SMK_PING_METHOD is set to 1 INLN : CMAQ 2-D surface layer emissions file, produced if SMK_ELEV_METHOD is set to 2. For in-line processing plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file for CMAQ version 4.7 or later. REP[E|A|M|P]G : Emission total report file, produced if either MRG_REPSTA_YN or MRG_REPCNY_YN is set to Y'
  EXPLICIT_PLUMES_YN:
    default: N
    description: 'Indicates whether only explicit plume rise sources should be merged. Y: Merge only explicit plume rise sources; uses PLAY_EX file N: Merge all plume rise sources; uses PLAY file'
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  INLN:
    default: N
    description: 'Defines his/her own output file names from Smkmerge . Manually define environment variables for those output file names below: [E|A|M|P]OUT : Processing source output file ELEV : Elevated-point-sources file, produced if SMK_ASCIIELEV_YN is set to Y; if PinG sources have also been selected, then the stack diameters listed in this file will be set to the negative value of their actual value. PING : CMAQ PinG file, produced if SMK_PING_METHOD is set to 1 : CMAQ 2-D surface layer emissions file, produced if SMK_ELEV_METHOD is set to 2. For in-line processing plume rise processing, MRG_LAYERS_YN must set to N to create hourly speciated 2-D surface layer emissions file for CMAQ version 4.7 or later. REP[E|A|M|P]G : Emission total report file, produced if either MRG_REPSTA_YN or MRG_REPCNY_YN is set to Y'
  INLN[T][S]_S|_L]:
    default: ''
    description: (File) CMAQ in-line emissions file, produced if SMK_ELEV_METHOD is set to 2
  INVTABLE:
    default: ''
    description: "(File) Inventory table. The INVTABLE file replaces the SIPOLS and ACTVNAMS files previously used by SMOKE. Smkinven uses the inventory table to select the inventory pollutants that will be output by Smkinven . The valid pollutants are again checked at the end of SMOKE processing by Smkmerge , to ensure that the program knows about all of the pollutants and also to set the order of the output variables (output species are sorted by the order of the pollutants in the inventory table and for multiple species per pollutant, by alphabetical order). You can use the INVTABLE to drop inventory pollutants in Smkinven without having to modify the inventory files, simply by modifying INVTABLE . The units used in the SMOKE intermediate files are listed in this file. The SMOKE programs Spcmat , and Movesmrg use this file to determine which pollutants should be included in the NONHAPVOC or NONHAPTOG calculation. The inventory table also provides a way to assign the SPECIATE4 species\
      \ ID to any pollutant that is a Hazardous Air Pollutant (HAP) VOC. This assignment is not used directly by SMOKE, but rather is used by the Speciation Tool when creating VOC speciation profiles. This is used only when creating speciation profiles to support SMOKE runs that will combine criteria VOC and HAP VOC emissions, using the NHAPEXCLUDE file in the Smkinven program. More specifically, this can be done for the purpose of using VOC HAP emissions to augment VOC speciation profiles. Since the Inventory Table provides information to the Speciation Tool, this field is not used by SMOKE, but is included for continued integration of SMOKE inputs with the Speciation Tool. As described in the Smkinven documentation in Chapter 6, Smkinven in some cases will create \"no-integrate\" (NOI) HAP pollutant emissions from the inventory data by renaming the pollutant with a \"_NOI\" suffix applied to the end of the Inventory Data Name from the Inventory Table for such pollutants. Similarly, Smkinven\
      \ will automatically add all possibly needed \"_NOI\" pollutant names to the internal master list of valid pollutant names. This list would otherwise be limited to the contents of the INVTABLE file entries where the Keep column contains an \"Y\". Smkinven inserts these names in the master list such that the \"_NOI\" version of the pollutant name appears in the list just after the polutant on which the name is based. The inserted entries that include \"_NOI\" are made when the following values are included for the pollutant in the INVTABLE file. A \"Y\" appears in the \"Keep\" field A \"V\" or \"T\" appears in the \"VOC or TOG component\" field A \"Y\" appears in the \"Model species\" field Something other than \"Y\" appears in the \"Explicit in mechanism\" field (e.g., \"N\" or blank) It is possible for a user to choose two pollutants that result in double counting the emissions from the inventory. For example, you may want to model both benzo(a)pyrene and 7-PAH which, would result\
      \ in the emissions associated with CAS number 205992 (for benzo(a)pyrene) to be duplicated. The user is responsible for the choices made and the resulting changes in inventory mass. The format of the INVTABLE is shown in Table 6.91, \u201CFormat for INVTABLE \u201D . The columns in the INVTABLE are used as follows: Inventory data name: Unique name for pollutant or activity that will be stored and processed by SMOKE. Because of I/O API restrictions, these names can only include alphanumeric characters and underscores, and the first character must be a letter. In addition, because SMOKE uses double-underscore as a separator when appending to variable names, no double-underscores are permitted in these names. Mode: This three-letter code represents the emissions mode that SMOKE uses to augment the pollutant names. Emissions mode usually refers to the on-road or nonroad mobile exhaust or evaporative emissions. If present in a record of the Inventory Table, SMOKE will combine the Mode field\
      \ with the Inventory Data Name field using a double underscore. So, if the Inventory Data Name is \"VOC\" and the Mode is \"EXH\", then the pollutant name in SMOKE intermediate files will be stored as \"EXH__VOC\". Inventory Pollutant Code: This code represents the pollutant that is provided in the inventory file input into SMOKE, and is sometimes the Chemical Abstracts Service (CAS) number when the inventory uses CAS numbers to identify pollutants. Smkinven matches this code to a ORL-formatted inventory file to assign the combination of Mode and Inventory Data Name (columns 2 and 1 as described in the previous bullet), which is used in all subsequent SMOKE intermediate files and reports. This code is not used by SMOKE in any other way. SPECIATE4 ID: The SPECIATE4 ID is the unique species identifier in SPECIATE4 (the \"ID\" field in the SPECIES_PROPERTIES table). This code is not used by SMOKE, but rather is used during import of the Inventory Table to the Speciation Tool. Reactivity\
      \ group: The reactivity group for the ASPEN model. It is not used in SMOKE. Keep: Indicates whether SMOKE should keep the CAS number associated with this inventory data name. SMOKE will keep any inventory data with at least one CAS number with a Y. Factor: The adjustment factor to use in splitting the emissions associated with a CAS number into different inventory data names, or reducing the mass of a metal compound associated with a CAS number to account for the metal mass only. VOC or TOG component: A \u201C V \u201D should be entered if the CAS number is part of VOC emissions or TOG emissions. A \u201C T \u201D should be entered if the CAS number is part of TOG emissions only. An \u201C N \u201D should be entered if the CAS number is part of neither VOC or TOG. Any other value other than \u201C V \u201D or \u201C T \u201D will be treated as an \u201C N \u201D. Model species: A \u201C Y \u201D should be entered if the pollutant is also a VOC model species for the AQM being targeted\
      \ for the run. Any other values will be treated as an \u201C N \u201D. Explicit in mechanism: A \u201C Y \u201D should be entered if (1) the pollutant is a VOC species (the model-species column must be \u201C Y \u201D as well), and (2) that model-species is explicitly treated in the AQM\u2019s chemical mechanism. The pollutant can be an explicit species in the chemical mechanism only when the GSPRO file definitions of the lumped VOC species have been adjusted to account for the pollutants/species that are explicit in the mechanism. The current explicit-in-mechanism species being used in the toxics CB6 mechanism for CMAQ are formaldehyde, acetaldheyde, acrolein and 1,3 butadiene. Activity: A \u201C Y \u201D should be entered if the inventory data name is a type of activity instead of emissions. Any other values will be treated as an \u201C N \u201D. NTI: Code identifying a HAP on the Clean Air Act HAP list (list of 188 HAPs). Not currently used by SMOKE; will be used in the future for\
      \ growing HAP emissions to future years. Units: The units to store the data in the SMOKE intermediate files. This should be \u201C short tons/year \u201D for emissions values, \u201C miles/year \u201D for VMT, and \u201C miles/hr \u201D for speed. Although this is provided as an input field to allow possible future changes, these values should not be changed by the user and are unrelated to the units of the emissions in the input files. Inventory data descriptions: This is the description of the inventory data name listed in columns 1-11. CAS pollutant description: Describes the pollutant that is coming from the inventory that is being input into SMOKE."
