grdmat:
  AGMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  AGREF:
    default: ''
    description: "(File) Gridding cross-reference files for area and mobile sources. The gridding cross-reference files are used to match the emissions sources with the spatial surrogates in the surrogates file. The way that of the gridding cross-reference files are applied in SMOKE ensures that the most-specific matches override the less-specific ones. A description of how the gridding cross-reference is applied to the inventory is provided in Section 4.4, \u201C Grdmat \u201D . The format of the AGREF and MGREF files is shown in Table 6.39, \u201CFormat for AGREF and MGREF \u201D ."
  AGSUP:
    default: ''
    description: (File) Gridding supplemental file containing spatial surrogate codes for each source
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  FULLSCC_ONLY:
    default: N
    description: Disables any sub-SCC cross-reference assignments that would otherwise be included in the cross-reference hierarchy. For example, the left-7, left-4, and left-2 levels of nonpoint and mobile SCCs would never be used. This is useful when zeros are a natural part of the SCC that the user does not want to assume are present for cross-reference hierarchy purposes. This option affects all Cntlmat input packets that use SCC assignments as part of their hierarchy. In this context, this option prevents left-7 SCC assignments using the gridding cross-reference file.
  GRIDDESC:
    default: ''
    description: (File) Grids and projection information. The GRIDDESC file is used to provide grid and projection information to SMOKE and can contain data for many different projections and many different grids. The format of the GRIDDESC file is available in the I/O API documentation at https://cmascenter.org/ioapi/documentation/all_versions/html/GRIDDESC.html .
  GRIDMASK:
    default: ''
    description: (File) Geographic level code and Timezone for each grid cell
  GRID_CRO_2D:
    default: ''
    description: (File) Layer definitions for the CMAQ model domain
  IMPORT_GRDNETCDF_YN:
    default: ''
    description: Y to read the native netCDF annual inventory files
  IOAPI_GRIDNAME_1:
    default: ''
    description: output modeling grid that global gridded inventory data is re-gridded to.
  IOAPI_ISPH:
    default: '19'
    description: Determines which USGS spheroid to use for grid-based calculations This environment variable can also be used to set custom spheroid representations. See the I/O API documentation for more information.
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Grdmat
  MGMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  MGREF:
    default: ''
    description: "(File) Gridding cross-reference files for area and mobile sources. The gridding cross-reference files are used to match the emissions sources with the spatial surrogates in the surrogates file. The way that of the gridding cross-reference files are applied in SMOKE ensures that the most-specific matches override the less-specific ones. A description of how the gridding cross-reference is applied to the inventory is provided in Section 4.4, \u201C Grdmat \u201D . The format of the AGREF and MGREF files is shown in Table 6.39, \u201CFormat for AGREF and MGREF \u201D ."
  MGSUP:
    default: ''
    description: (File) Gridding supplemental file containing spatial surrogate codes for each source
  MOBL:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PGMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  REPORT_DEFAULTS:
    default: Y
    description: 'Defines whether or not the program reports when a source uses the default cross-reference. Y: List sources in the log file when they use default cross-reference N: Do not list sources that use the default cross-reference.'
  SMK_DEFAULT_SRGID:
    default: 100 (Models-3 population surrogate code)
    description: Mandatory, user MUST choose a fallback code.
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  SMK_USE_FALLBACK:
    default: ''
    description: "[Y/N] Defines the surrogate code number to use as a fallback surrogate when the surrogate number set by the cross-reference file would zero out the emissions for that source. This fallback surrogate is also used to define the country/state/county (FIPS) codes for use in Grdmat ; therefore, a fallback surrogate code is mandatory even if the SMK_USE_FALLBACK is set to [N]. This code should exist in the SRGDESC file and be representative on all country/state/counties. See description in Section 6.4.1, \u201C SRGDESC : Surrogate Designation, Description and Surrogate profile filename.\u201D ."
  SRGDESC:
    default: none
    description: "SMK_USE_FALLBACK : [Y/N] Defines the surrogate code number to use as a fallback surrogate when the surrogate number set by the cross-reference file would zero out the emissions for that source. This fallback surrogate is also used to define the country/state/county (FIPS) codes for use in Grdmat ; therefore, a fallback surrogate code is mandatory even if the SMK_USE_FALLBACK is set to [N]. This code should exist in the file and be representative on all country/state/counties. (File) Surrogate Designation, Description and Surrogate profile filename. The Surrogate Description file is used to designate the regional location of the surrogate, the surrogate code number, a brief description of the code number and the Area and Mobile spatial surrogate file in which surrogate profile can be found. This file is located in SRGPRO_PATH . See Figure 4.4, \u201C Grdmat input and output files\u201D . The format of the SRGDESC file is shown in Table 6.37, \u201CFormat for SRGDESC \u201D\
      ."
  SRGPRO:
    default: ''
    description: (File) Gridding surrogate coefficients
  SRGPRO_PATH:
    default: ''
    description: Defines the location of the Area and Mobile spatial surrogate files.
  SRGPRO_PATH/SURROGATE-FILES:
    default: ''
    description: (File) Gridding surrogate coefficients
grwinven:
  ACMAT_01:
    default: ''
    description: (File) Control or growth matrix output from Cntlmat ; total number of files is determined by SMK_NUM_CTLMAT setting
  ACMAT_02:
    default: ''
    description: (File) Additional control or growth matrices; total number of files is determined by SMK_NUM_CTLMAT setting
  ACMAT_03:
    default: ''
    description: (File) Additional control or growth matrices; total number of files is determined by SMK_NUM_CTLMAT setting
  AREA:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  AREA_O:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Spcmat , and Temporal'
  ARINV_O:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: Smkinven See Chapter 6, SMOKE Input Files for the formats of the ARINV , MBINV , and PTINV files.'
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Grwinven
  MBINV_AO:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: Smkinven See Chapter 6, SMOKE Input Files for the formats of the ARINV , MBINV , and PTINV files.'
  MBINV_O:
    default: ''
    description: '(File) Type: ASCII - column-specific Used by: Smkinven See Chapter 6, SMOKE Input Files for the formats of the ARINV , MBINV , and PTINV files.'
