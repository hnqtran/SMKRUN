  MPMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven , Smkmerge , Smkreport'
  MRG_GRDOUT_UNIT:
    default: blank
    description: "This variable is the same one used to control the Smkmerge output units. For Smkreport , it controls which ASCII elevated file to use, when the ASCIIELEV instruction is included in the REPCONFIG file. If the first letter of this setting is an \u201C m \u201D (for mole), then Smkreport opens the ELEVTS_L file to use in the report; otherwise, Smkreport opens and uses the ELEVTS_S file. This setting does not do anything to the behavior of Smkreport unless the ASCIIELEV setting is included in the REPCONFIG file. The default setting of MRG_GRDOUT_UNIT results in the ELEVTS_S file being used by Smkreport ."
  MRMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven and Smkmerge'
  MSMAT:
    default: ''
    description: (File) Mass-based or mole-based speciation matrix from Spcmat
  MSSUP:
    default: ''
    description: (File) Supplementary file from Spcmat that contains all speciation profile codes assigned to each source
  MTMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  MTSUP:
    default: ''
    description: (File) Supplementary file from Temporal that contains all monthly, weekly, and diurnal profile codes assigned to each source. This file will only work when profiles have not been applied by pollutant.
  NAICSDESC:
    default: ''
    description: "(File) NAICS code descriptions. This file provides text descriptions of the NAICS codes. The format of the NAICSDESC file is shown in Table 6.93, \u201CFormat for NAICSDESC \u201D ."
  ORISDESC:
    default: ''
    description: "(File) ORIS description. The ORISDESC file provides descriptive information for the ORIS IDs, which Smkinven uses when reporting the status of reading and matching CEM data. The information in this file will appear in the REPINVEN output file from Smkinven . The format of the ORISDESC file is shown in Table 6.95, \u201CFormat for ORISDESC \u201D . Note that only the first five columns of data need to appear in the file; the rest can be blank because SMOKE does not use any information past column E."
  PCMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven , Smkmerge , and Smkreport'
  PELV:
    default: ''
    description: '(File) Type: ASCII - list-directed Used by: Laypoint , Smkmerge , and Smkreport'
  PGMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PLAY:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PNTS:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Cntlmat , Elevpoint , Grdmat , Grwinven , Laypoint , Smkmerge , Smkreport , Spcmat , and Temporal'
  PPMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven , Smkmerge , Smkreport'
  PRMAT:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Grwinven and Smkmerge'
  PSMAT:
    default: ''
    description: (File) Mass-based or mole-based speciation matrix from Spcmat
  PSSUP:
    default: ''
    description: (File) Supplementary file from Spcmat that contains all speciation profile codes assigned to each source
  PTMP:
    default: ''
    description: '(File) Type: I/O API NetCDF - adapted gridded format Used by: Smkmerge and Smkreport'
  PTSUP:
    default: ''
    description: (File) Supplementary file from Temporal that contains all monthly, weekly, and diurnal profile codes assigned to each source. This file will only work when profiles have not been applied by pollutant.
  REPCONFIG:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or BY GEOCODE_LEVEL2[NAME] or BY GEOCODE_LEVEL3[NAME] or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
  REPORT[#]:
    default: ''
    description: "(File) Multiple ASCII reports. Smkreport will output file names of REPORT1 , REPORT2 , REPORT3 , etc., if no other file names are given with the /NEWFILE/ instruction (see the REPCONFIG file documentation in Section 5.3, \u201C REPCONFIG Input File\u201D ). If the /NEWFILE/ instructions include physical file names, Smkreport will open those files. If the /NEWFILE/ instructions include logical file names ( REPORT1 , etc.), Smkreport will attempt to find the value of the logical file name in the run-time UNIX shell environment. It the logical file name is defined, Smkreport will open the physical file associated with the logical file name; otherwise Smkreport opens a physical file with the same name as the logical file name."
  REPORT_ZERO_VALUES:
    default: N
    description: 'Determines if Smkreport should keep report entries whose data values are all zero Y: Print entries whose values are zero N: Do not print entries whose values are zero'
  SCCDESC:
    default: ''
    description: "(File) Source category code descriptions. This file provides textual descriptions of the SCCs, which are used by two programs: Smkinven when reading hourly emissions data (for reporting in the REPINVEN output file) Smkreport when the user requests the SCC description be included in the report. There are delimited and fixed formats available for the SCCDESC file shown in Table 6.97, \u201CDelimited format for SCCDESC \u201D and Table 6.98, \u201CFixed format for SCCDESC \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the SCCDESC file is shown in Table 6.97, \u201CDelimited format for SCCDESC \u201D ."
  SICDESC:
    default: ''
    description: "(File) SIC code descriptions. This file provides text descriptions of the SIC codes. There are delimited and fixed formats available for the SICDESC file shown in Table 6.100, \u201CDelimited format for SICDESC \u201D and Table 6.101, \u201CFixed format for SICDESC \u201D . Example 6.26."
  USE_EXP_GEO_CODES:
    default: N
    description: If set to Y, this variable is used to specify the use of expanded 12-character geograpic codes contained in the GEOCODE_LEVEL[1-4] input files. For Smkreport , it controls which ASCII GEOCODE file to use. The user can select the data extraction summary format in the REPCONFIG file. If the REPCONFIG file contains CARB_QADEF setting, then Smkreport creates reports in the CARB QA Data Extraction Format. If the REPCONFIG file contains the BY GEOCODE_LEVEL1[NAME] or BY GEOCODE_LEVEL2[NAME] or BY GEOCODE_LEVEL3[NAME] or BY GEOCODE_LEVEL4[NAME] then Smkreport creates reports at each geographic level with its description and local time zone.
programs:
  AERO_RESISTANCE_VAR:
    default: blank
    description: Define the aerodynamic resistance variable name for Bash's algorithm for livestock ammonia sources
  AGGREGATE_EMIS_YN:
    default: N
    description: Allows users to aggregate mass-based emissions as default while optinally aggregate non-mass like ratio or percentage values.
  AGTS_L:
    default: ''
    description: (File) SMOKE 2-D gridded, mole-speciated, hourly emissions file.
  ARINV:
    default: ''
    description: "(File) Area-source annual or average-day emissions. 6.2.4.1. FF10 Format 6.2.4.2. ORL Formats The ARINV file is the input area source inventory file for annual or average-day data. This file can be in FF10 or ORL Formats. 6.2.4.1. FF10 Format This FF10 format uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . For area nonpoint, nonroad and onroad mobile sources annual or monthly inventory data the user specifies the data provided using this command in the header: FF10_[NONPOINT|NONROAD|ONROAD] Sample header records for nonpoint mobile sources: #FORMAT FF10_NONPOINT #COUNTRY US #YEAR 2005 #DESC Nonpoint Source Inventory #DESC FF10 Nonpoint format Sample header records for nonroad mobile sources: #FORMAT FF10_NONROAD #COUNTRY US #YEAR 2005 #DESC Nonroad Source Inventory #DESC FF10 Nonroad format Sample header records for onroad mobile sources: #FORMAT FF10_ONROAD #COUNTRY US #YEAR 2005 #DESC Onroad Mobile Source Inventory #DESC FF10 Onroad format The\
      \ FF10 format for area nonpoint, nonroad and onroad mobiles sources is list-directed and shown in Table 6.15, \u201CFF10 Format for ARINV \u201D . Table 6.15. FF10 Format for ARINV Position Name Type Description 1 COUNTRY Char(3) Country code; default to \"US\" (required) 2 REGION_CD Char(5) Region code for state and county (a.k.a. FIPS code; required) 3 TRIBAL CODE Char(3) Tribal code (optional; recommended) 4 CENSUS_TRACT Char Census tract ID (optional; not currently used by SMOKE) 5 SHAPE_ID Char Shape Identification (optional; recommended) 6 SCC Char(20) SCC (required) 7 EMIS_TYPE Char(3) Emissions type [ex: EXH, EVP, and so on] (optional; not currently used by SMOKE) 8 POLID Char(16) Pollutant Code (required) 9 ANN_VALUE Real Annual emissions (short tons/year) (required if SMKINVEN_MONTH is set to 0) 10 ANN_PCT_RED Real Percentage Control Measure Reduction Efficiency (optional) 11 CONTROL_IDS Char Control Measure Code (optional; not currently used by SMOKE) 12 CONTROL_MEASURES\
      \ Char Control Measure Values (optional; not currently used by SMOKE) 13 CURRENT_COST Real Control Cost (optional; not currently used by SMOKE) 14 CUMULATIVE_COST Real Cumulative Cost (optional; not currently used by SMOKE) 15 PROJECTION_FACTOR Real Projection factor (optional; not currently used by SMOKE) 16 REG_CODES Char Regulatory Code (optional; not currently used by SMOKE) 17 CALC_METHOD Char Emission Calculation Method Code (optional; not currently used by SMOKE) 18 CALC_YEAR Int Emission Calculation Data Year (optional; not currently used by SMOKE) 19 DATE_UPDATED Int Last time updated date in format of YYYYMMDD (optional; not currently used by SMOKE) 20 DATA_SET_ID Int Data set identifier (optional; not currently used by SMOKE) 21 JAN_VALUE Real Filled in only if data were provided for January in unit of short tons/month (required if SMKINVEN_MONTH is set to 1) ... ... ... ... 32 DEC_VALUE Real Filled in only if data were provided for December in unit of short tons/month (required\
      \ if SMKINVEN_MONTH is set to 12) 33 JAN_PCTRED Real Month-specific percent reduction. Filled in only if data were provided for January in unit of % (optional; not currently used by SMOKE) ... ... ... ... 44 DEC_PCTRED Real Month-specific percent reduction. Filled in only if data were provided for December in unit of % (optional; not currently used by SMOKE) 45 COMMENT Char Optional; not currently used by SMOKE 6.2.4.2. ORL Formats 6.2.4.2.1. ORL Nonpoint Format 6.2.4.2.2. ORL Nonroad Format Because area sources encompass both nonpoint and nonroad mobile sources, two different ORL formats are available depending on source type. Both formats use the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records for nonpoint sources are shown below: 6.2.4.2.1. ORL Nonpoint Format The ORL nonpoint format is list-directed and shown in Table 6.16, \u201CORL Nonpoint Format for ARINV \u201D . #ORL NONPOINT #TYPE Nonpoint Source Toxics Inventory #COUNTRY US #YEAR\
      \ 1999 #DESC Draft 1999 version 2.0 Table 6.16. ORL Nonpoint Format for ARINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 SCC Char(20) Source Classification Code (required) 3 SIC Char(20) Standard Industrial Code (recommended) 4 MACT Char(6) Maximum Available Control Technology Code (6 characters maximum) (recommended) 5 SRCTYPE Char(2) Source type (2 characaters maximum); used by SMOKE in determining applicable MACT-based controls (required) 01 = major 02 = Section 12 area source 03 = nonroad 04 = onroad 6 NAICS Char(6) North American Industrial Classification System Code (6 characters maximum) (optional) 7 POLID Char(16) Pollutant CAS number or other name (16 characters maximum) (required; this is called the pollutant code in the NIF) 8 ANN_EMIS Real Annual emissions (short tons/year) (required) 9 AVD_EMIS Real Average-day emissions (short tons/average day) (optional) 10 CEFF Real Control Efficiency percentage (give value of 0-100) (optional;\
      \ if missing will result in SMOKE default of 0) 11 REFF Real Rule Effectiveness percentage (give value of 0-100) (optional; if missing will result in SMOKE default of 100) 12 RPEN Real Rule Penetration percentage (give value of 0-100) (optional; if missing will result in SMOKE default of 100) 13 PRIMARY_DEVICE_TYPE_CODE Char Primary Control Equipment Code (optional; not currently used by SMOKE) 14 SECONDARY_DEVICE_TYPE_CODE Char Secondary Control Equipment Code (optional; not currently used by SMOKE) 15 DATA_SOURCE Char Flag indicating the source of the data (e.g., state submitted or EPA-computed) (optional; not currently used by SMOKE) 16 YEAR Char Year of the emissions (optional; not currently used by SMOKE) 17 TRIBAL_CODE Char(3) Indicates the particular tribe that submitted the data (optional; recommended) 18 MACT_FLAG Char MACT flag indicating the relationship of the MACT rule and the particular source (15 characters maximum)(optional; not currently used by SMOKE) 19 PROCESS_MACT_COMPLIANCE_STATUS\
      \ Char Indicate the relationship of the MACT rule and the particular source (optional; not currently used by SMOKE) 20 START_DATE Char(8) Indicates originally-reported start date prior to annualizing emissions, which may be used for building temporal profiles for specific sources (8 characters maximum) (optional; not currently used by SMOKE) 21 END_DATE Char(8) Indicates originally-reported end date prior to annualizing emissions, which may be used for building temporal profiles for specific sources (8 characters maximum) (optional; not currently used by SMOKE) 22 WINTER_THROUGHPUT_PCT Real Percentage throughout in winter (optional; not currently used by SMOKE) 23 SPRING_THROUGHPUT_PCT Real Percentage throughout in spring (optional; not currently used by SMOKE) 24 SUMMER_THROUGHPUT_PCT Real Percentage throughout in summer(optional; not currently used by SMOKE) 25 FALL_THROUGHPUT_PCT Real Percentage throughout in fall (optional; not currently used by SMOKE) 26 ANNUAL_AVG_DAYS_PER_WEEK\
      \ Real Annual average days of operation per week (optional; not currently used by SMOKE) 27 ANNUAL_AVG_WEEKS_PER_YEAR Real Annual average weeks of operation per year (optional; not currently used by SMOKE) 28 ANNUAL_AVG_HOURS_PER_DAY Real Annual average hours of operation per day (optional; not currently used by SMOKE) 29 ANNUAL_AVG_HOURS_PER_YEAR Real Annual average hours of operation per year (optional; not currently used by SMOKE) 30 PERIOD_DAYS_PER_WEEK Real Days per week operating during the period (optional; not currently used by SMOKE) 31 PERIOD_WEEKS_PER_PERIOD Real Weeks per period operating during the period (optional; not currently used by SMOKE) 32 PERIOD_HOURS_PER_DAY Real Hours of operation per day during the period (optional; not currently used by SMOKE) 33 PERIOD_HOURS_PER_PERIOD Real Hours of operation per period during the period(optional; not currently used by SMOKE) 34 CONTROL_MEASURES Char An & delimited list of control measure abbreviations (optional; not currently\
      \ used by SMOKE) 35 PCT_REDUCTION Char An & delimited list of percent reductions for the applied control measures (optional; not currently used by SMOKE) 36 CURRENT_COST Char The cost of the most recently applied control strategy for this source (optional; not currently used by SMOKE) 37 CUMULATIVE_COST Char The cumulative cost for all applied control measures (optional; not currently used by SMOKE) 6.2.4.2.2. ORL Nonroad Format The ORL nonroad format is list-directed and shown in Table 6.17, \u201CORL Nonroad Format for ARINV \u201D . #ORL #TYPE Nonroad Source Toxics Inventory #COUNTRY US #YEAR 1999 #DESC Draft 1999 version 2.0 Table 6.17. ORL Nonroad Format for ARINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 SCC Char(20) Source Classification Code (required) 3 POLID Char(16) Pollutant CAS number or other name (required; this is called the pollutant code in the NIF) 4 ANN_EMIS Real Annual emissions (short tons/year) (required) 5 AVD_EMIS\
      \ Real Average-day emissions (short tons/average day) (optional) 6 CEFF Real Control Efficiency percentage (give value of 0-100) (optional; if missing will result in SMOKE default of 0) 7 REFF Real Rule Effectiveness percentage (give value of 0-100) (optional; if missing will result in SMOKE default of 100) 8 RPEN Real Rule Penetration percentage (give value of 0-100) (optional; if missing will result in SMOKE default of 100) 9 SRCTYPE Char(2) Source type ; used by SMOKE in determining applicable MACT-based controls (required) 01 = major 02 = Section 12 area source 03 = nonroad 04 = onroad 10 DATA_SOURCE Char Flag indicating the source of the data (e.g., state submitted or EPA-computed) (optional; not currently used by SMOKE) 11 YEAR Char Year of the emissions (optional; not currently used by SMOKE) 12 TRIBAL_CODE Char(3) Indicates the particular tribe that submitted the data (optional; recommended) 13 START_DATE Char(8) Indicates originally-reported start date prior to annualizing\
      \ emissions, which may be used for building temporal profiles for specific sources (optional; not currently used by SMOKE) 14 END_DATE Char(8) Indicates originally-reported end date prior to annualizing emissions, which may be used for building temporal profiles for specific sources (optional; not currently used by SMOKE) 15 WINTER_THROUGHPUT_PCT Real Percentage throughout in winter (optional; not currently used by SMOKE) 16 SPRING_THROUGHPUT_PCT Real Percentage throughout in spring (optional; not currently used by SMOKE) 17 SUMMER_THROUGHPUT_PCT Real Percentage throughout in summer(optional; not currently used by SMOKE) 18 FALL_THROUGHPUT_PCT Real Percentage throughout in fall (optional; not currently used by SMOKE) 19 ANNUAL_AVG_DAYS_PER_WEEK Real Annual average days of operation per week (optional; not currently used by SMOKE) 20 ANNUAL_AVG_WEEKS_PER_YEAR Real Annual average weeks of operation per year (optional; not currently used by SMOKE) 21 ANNUAL_AVG_HOURS_PER_DAY Real Annual\
      \ average hours of operation per day (optional; not currently used by SMOKE) 22 ANNUAL_AVG_HOURS_PER_YEAR Real Annual average hours of operation per year (optional; not currently used by SMOKE) 23 PERIOD_DAYS_PER_WEEK Real Days per week operating during the period (optional; not currently used by SMOKE) 24 PERIOD_WEEKS_PER_PERIOD Real Weeks per period operating during the period (optional; not currently used by SMOKE) 25 PERIOD_HOURS_PER_DAY Real Hours of operation per day during the period (optional; not currently used by SMOKE) 26 PERIOD_HOURS_PER_PERIOD Real Hours of operation per period during the period(optional; not currently used by SMOKE) 27 CONTROL_MEASURES Char An & delimited list of control measure abbreviations (optional; not currently used by SMOKE) 28 PCT_REDUCTION Char An & delimited list of percent reductions for the applied control measures (optional; not currently used by SMOKE) 29 CURRENT_COST Char The cost of the most recently applied control strategy for this source\
      \ (optional; not currently used by SMOKE) 30 CUMULATIVE_COST Char The cumulative cost for all applied control measures (optional; not currently used by SMOKE)"
  AVG_RAW_OUTPUT_YN:
    default: N
    description: Define whether Gentpro outputs average raw meteorology variables (e.g., temperature; wind speed; etc) or not
  BGTS_L:
    default: ''
    description: (File) SMOKE 2-D gridded, mole-speciated, hourly emissions file.
  BIOSEASON:
    default: ''
    description: (File) Bioseason switch file. The BIOSEASON switch file is an I/O API netCDF file used to indicate how each day in a given year should be treated, either as summer or winter. This file can be created using the Metscan utility program. The BIOSEASON file is time-dependent and usually contains data for an entire year (365 or 366 days). It uses one variable, SEASON, which is either 0 (grid cell should use winter factors for current day) or 1 (grid cell should use summer factors for current day).
  CONSTANT:
    default: '42.12'
    description: Define the value of constant of RWC equation
  COSTCY:
    default: ''
    description: "(File) Country, state, and county names and data. The COSTCY file is used to assign numeric codes to the various countries, states, and counties to be modeled; the file also provides information concerning default time zones and Daylight Savings observance. A header line can be used in this file to indicate that population data are contained in the file as the last column on each line of the /COUNTY/ packet. The header line and additional population column are optional. If it is present in the file, it must be on the first line of the file and use the following syntax: #POPULATION <year> where <year> is a 4-digit year. The country, state, and county codes in each section of this file must be sorted in increasing order. If they are not, the programs reading this file will give an error. The format of the COSTCY file is shown in Table 6.85, \u201CFormat for COSTCY \u201D ."
  DEFAULT_TEMP_RWC:
    default: N
    description: Allows the user to determine county-specific minimum temperature for RWC estimate equations. It will override default minimum temperature [ ] listed above.
  E2DNCF:
    default: ''
    description: (File) Gridded, hourly, speciated emissions in the I/O API format needed for CMAQ.
  EGTS_L:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( ) should be converted from I/O API to Fortran-binary format."
  ENDDATE:
    default: '0'
    description: Defines the last day of year (December 31st) for a proper temporal profile calculation. MCIP file must cover last hour of December 31st of all counties in modeling output time zone (i.e., GMT).
  FILELIST:
    default: ''
    description: "(File) Gridded merge 2-D file list. The FILELIST file is used to provide a list of logical file names to the Mrggrid program. This list should contain the logical file names for all 2- or 3-D files to be merged in a given run. It is a very simple file, and has no limit to the number of files listed. Note that unlike most list files used in SMOKE, FILELIST requires a list of logical file names, not the actual file name. The format of the FILELIST file is shown in Table 6.53, \u201CFormat for FILELIST \u201D ."
  FLABEL:
    default: EMISSIONS (currently the only working option)
    description: "Defines what type of UAM/CAM X file to output. This setting cannot be adjusted by the user, because the current version of Smk2emis can generate only the \u201C EMISSIONS \u201D file."
  GCNTL:
    default: ''
    description: "(File) Files for controls and/or past- and future-year growth. 6.6.1.1. /ALLOWABLE/ Packet 6.6.1.2. /CONTROL/ Packet 6.6.1.3. /CTG/ Packet 6.6.1.4. /MACT/ Packet 6.6.1.5. /PROJECTION/ Packet 6.6.1.6. /REACTIVITY/ Packet SMOKE uses growth and control packets to get the information needed for growth and control of emissions. A packet is a group of inputs used to apply specific types of controls. A single control file containing a series of packets can be shared by area, mobile, and point sources and the packets that do not apply to a given source category will be ignored. The following packets are recognized by the SMOKE control programs: /ALLOWABLE/ contains county-specific, SIC-specific, SCC-specific controls, caps, and replacement emissions. Contributes to the multiplicative control matrix. Section 6.6.1.1, \u201C/ALLOWABLE/ Packet\u201D /CONTROL/ contains settings for control efficiency, rule effectiveness, and rule penetration. Contributes to the multiplicative control\
      \ matrix. Section 6.6.1.2, \u201C/CONTROL/ Packet\u201D /CTG/ contains settings for CTG, MACT, and RACT controls. Contributes to the multiplicative control matrix. Section 6.6.1.3, \u201C/CTG/ Packet\u201D /MACT/ contains settings to support the primary MACT controls needed for toxics processing. Contributes to the multiplicative control matrix. Section 6.6.1.4, \u201C/MACT/ Packet\u201D /PROJECTION/ contains settings to permit growth of emission values into the past or future. Creates a growth matrix for each pollutant and/or activity. Section 6.6.1.5, \u201C/PROJECTION/ Packet\u201D /REACTIVITY/ contains settings needed for reactivity-based controls. Creates the reactivity control matrix. Section 6.6.1.6, \u201C/REACTIVITY/ Packet\u201D The formats for these packets are described in the section below. All of the packets are list-directed. 6.6.1.1. /ALLOWABLE/ Packet The format of the /ALLOWABLE/ packet is shown in Table 6.47, \u201CFormat for /ALLOWABLE/ packet in GCNTL \u201D .\
      \ Table 6.47. Format for /ALLOWABLE/ packet in GCNTL Line Position Description 1 A /ALLOWABLE/ 2+ A Country/State/County code or Country/state code with zero for county, or zero (Character) B 8 or 10-digit SCC, (20 digit maximum) or pieces of SCC with remaining digits filled in with zeros, or zero (Character) C Pollutant ID, or -9 if not a pollutant-specific control; in most cases, the cap or replacement value will be a pollutant-specific value, and that pollutant name needs to be placed in this column (Character) D Control factor (Real) (no longer used by SMOKE, enter -9 as placeholder) E Allowable emissions cap value [short tons/day] (Real) (required if no \u201C replace \u201D emissions are given) F Allowable emissions replacement value [short tons/day] (Real) (required if no \u201C cap \u201D emissions are given) G SIC for point sources or -9 if not needed (Character(20)) (not supported by SMOKE at this time) H Facility ID for FF10 Point Sources (Plant ID for ORL), optional (Character(15))\
      \ I Characteristic 1 (for FF10, this is Unit ID; for ORL, this is Point ID), optional (Character(15)) J Characteristic 2 (for FF10, this is Release Point ID, (for ORL, this is stack ID); optional (Character(15)) K Characteristic 3 (for FF10, this is Process ID, (for ORL, this is segment ID); optional (Character(15)) L Characteristic 4 (blank for FF10 or ORL inventory input format), optional (Character) M Characteristic 5 (blank for FF10 or ORL inventory input format), optional (Character) 3 A /END/ 6.6.1.2. /CONTROL/ Packet The format of the /CONTROL/ packet is shown in Table 6.48, \u201CFormat for /CONTROL/ packet in GCNTL \u201D . Table 6.48. Format for /CONTROL/ packet in GCNTL Line Position Description 1 A /CONTROL/ 2+ A Country/State/County code or Country/state code with zero for county, or zero (Character) B 8 or 10-digit SCC (20 digit maximum), or pieces of SCC with remaining digits filled in with zeros, or zero (Character) C Pollutant ID, or -9 if not a pollutant-specific\
      \ control (Character) D Primary control equipment code (PCEC); -9 or zero applies to all equipment (not yet supported) E Control efficiency (value should be a percent; e.g., enter 90 for a 90% control efficiency) (Real) F Rule effectiveness (value should be a percent; e.g., enter 50 for a 50% rule effectiveness) (Real) G Rule penetration rate (value should be a percent; e.g., enter 80 for a 80% rule penetration) (Real) H Standard Industrial Category (SIC), optional (20-digit Character) I Maximum Achievable Control Technology (MACT) code, optional (6-character string) J Application control flag (Character) Y = control should be applied to inventory N = control will not be used K Replacement flag (Character) A = control is applied in addition to controls from /MACT/ packet R = control replaces controls from /MACT/ packet L Facility ID for FF10 Point Sources (Plant ID for ORL), optional (Character(15)) M Characteristic 1 (for FF10, this is Unit ID; for ORL, this is Point ID), optional\
      \ (Character(15)) N Characteristic 2 (for FF10, this is Release Point ID, (for ORL, this is stack ID); optional (Character(15)) O Characteristic 3 (for FF10, this is Process ID, (for ORL, this is segment ID); optional (Character(15)) P Characteristic 4 (blank for FF10 or ORL inventory input format), optional (Character) Q Characteristic 5 (blank for FF10 or ORL inventory input format), optional (Character) 3 A /END/ 6.6.1.3. /CTG/ Packet The format of the /CTG/ packet is shown in Table 6.49, \u201CFormat for /CTG/ packet in GCNTL \u201D . Table 6.49. Format for /CTG/ packet in GCNTL Line Position Description 1 A /CTG/ 2+ A Country/State/County code or Country/state code with zero for county, or zero (Character) B 8 or 10-digit SCC (20 digit maximum), or pieces of SCC with remaining digits filled in with zeros, or zero (Character) C Pollutant ID, or -9 if not a pollutant-specific control; in most cases, the emissions cutoff value will be a pollutant-specific value, and that pollutant\
      \ name needs to be placed in this column (Character) D Control technology control factor; value should be a fraction 0 to 1. (Real) E CTG emissions cutoff for application of CTG, MACT, or RACT factor (short tons/day) (Real) F MACT control factor; value should be a fraction 0 to 1, or -9 if missing (Real) G RACT; value should be a fraction 0 to 1; or -9 if missing (Real) 3 A /END/ 6.6.1.4. /MACT/ Packet The format of the /MACT/ packet is shown in Table 6.50, \u201CFormat for /MACT/ packet in GCNTL \u201D . Table 6.50. Format for /MACT/ packet in GCNTL Line Position Description 1 A /MACT/ 2+ A Maximum Achievable Control Technology (MACT) code, optional (6-character string) B up to 20-digit maximum, or 8 or 10-digit SCC, or pieces of SCC with remaining digits filled in with zeroes or 0 (Character) C Source type (2-character string) 00 = both 01 = major 02 = CAA Section 12 area sources 03 = nonroad 04 = onroad The source type is only used to make a final determination about whether the\
      \ entry applies for a source. If the record matches the source otherwise (MACT or SCC matches) but the source type does not match, then the source receives no controls from this entry. D Application control flag (Character) Y = control should be applied to inventory N = control will not be used E Pollutant ID, or -9 if not a pollutant-specific control (Character) F Control efficiency of existing sources (value should be 0-100) (Real) G Control efficiency of new sources (value should be 0-100) (Real) H Fraction of new and existing sources (value should be 0-100) (Real) 3 A /END/ 6.6.1.5. /PROJECTION/ Packet The format of the /PROJECTION/ packet is shown in Table 6.51, \u201CFormat for /PROJECTION/ packet in GCTNL \u201D . Note that if both the SCC and SIC is supplied in a given packet entry, the SCC will be used for source matching. Table 6.51. Format for /PROJECTION/ packet in GCTNL Line Position Description 1 A /PROJECTION <4-digit from year> <4-digit to year>/ 2+ A Country/State/County\
      \ code, or Country/state code with zero for county, or zero (Character) B up to 20 digit maximum SCC, or 8 or 10-digit SCC, or pieces of SCC with remaining digits filled in with zeros, or zero (Character) C Projection factor [enter number on fractional basis; e.g., enter 1.2 to increase emissions by 20%] (Real) D Pollutant ID, or -9 if not a pollutant-specific entry E SIC, or 2-digit with remaining digits filled in with zeroes or blank for missing, optional (Character(20)) F Maximum Achievable Control Technology code (MACT), optional (6-character string) G Facility ID for FF10 Point Sources (Plant ID for ORL), optional (Character(15)) H Characteristic 1 (for FF10, this is Unit ID; for ORL, this is Point ID), optional (Character(15)) I Characteristic 2 (for FF10, this is Release Point ID, (for ORL, this is stack ID); optional (Character(15)) J Characteristic 3 (for FF10, this is Process ID, (for ORL, this is segment ID); optional (Character(15)) K Characteristic 4 (blank for FF10 or\
      \ ORL inventory input format), optional (Character) L Characteristic 5 (blank for FF10 or ORL inventory input format), optional (Character) 3 A /END/ 6.6.1.6. /REACTIVITY/ Packet The format of the /REACTIVITY/ packet is shown in Table 6.52, \u201CFormat for /REACTIVITY/ packet in GCNTL \u201D . Table 6.52. Format for /REACTIVITY/ packet in GCNTL Line Position Description 1 A /REACTIVITY <4-digit base year> <4-digit future year>/ 2+ A Country/State/County code or Country/state code with zero for county, or zero (Character) B 20 digit maximum SCC, or 8 or 10-digit SCC, or pieces of SCC with remaining digits filled in with zeros, or zero (Character) C Pollutant ID, required (Character) D Replacement emissions for base year [short tons/day] (Real) E Projection factor (or 0. for none; enter fractional value; e.g., 1.2 to increase emissions by 20%) (Real) F Future year 10-digit (up to a maximum of 20 digit) SCC code (or zero to set equal to base case) (Character) G Speciation profile number\
      \ (or zero to set equal to base case) (Real) H Market penetration of new speciation [fraction/year; e.g., enter 0.2 for 20% market penetration per year] (0. to 1.0) (Real) I SIC for point sources or -9 if not needed; not supported by SMOKE at this time (Character(20) J Facility ID for FF10 Point Sources (Plant ID for ORL), optional (Character(15)) K Characteristic 1 (for FF10, this is Unit ID; for ORL, this is Point ID), optional (Character(15)) L Characteristic 2 (for FF10, this is Release Point ID, (for ORL, this is stack ID); optional (Character(15)) M Characteristic 3 (for FF10, this is Process ID, (for ORL, this is segment ID); optional (Character(15)) N Characteristic 4 (blank for FF10 and ORL inventory input format), optional (Character) O Characteristic 5 (blank for FF10 and ORL inventory input format), optional (Character) 3 A /END/"
  GCNTL_OUT:
    default: ''
    description: "(File) Reformatted GCNTL file that includes only the /PROJECTION/ packet for inventory growth. The reformatting performed is described in Section 3.3.11.1, \u201CDescription\u201D ."
  GEOCODE_LEVEL1:
    default: ''
    description: "(File) The GEOCODE_LEVEL1 input file contains a 3 character code used to specify the Country-level Geographical Code. The COSTCY file will not be used if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each country in the gridded inventory data then they would create a GEOCODE_LEVEL1 file. The GEOCODE_LEVEL1 file is comma delimited as shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL1 file is shown in Table 6.87, \u201CFile Format for GEOCODE_LEVEL1 \u201D ."
  GEOCODE_LEVEL2:
    default: ''
    description: "(File) The GEOCODE_LEVEL2 input file contains up to 6 character code to specify the Country/State-level Geographical Codes which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. If the user would like to use chemical and temporal profiles that are specified for each state level region for each country in the gridded inventory data then they would create a GEOCODE_LEVEL2 file. The GEOCODE_LEVEL2 file is comma delimited as shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL2 file is shown in Table 6.88, \u201CFile Format for GEOCODE_LEVEL2 \u201D ."
  GEOCODE_LEVEL3:
    default: ''
    description: "(File) The GEOCODE_LEVEL3 input file contains up to 9 character code to specify the Country/State-level/County-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL3 file is comma delimited as shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL3 file is shown in Table 6.89, \u201CFile Format for GEOCODE_LEVEL3 \u201D ."
  GEOCODE_LEVEL4:
    default: ''
    description: "(File) The GEOCODE_LEVEL4 input file contains a 12 character code to specify the Country/State/County/Tribal-level Geographical Code which will replace the COSTCY file if the environment variable USE_EXP_GEO_CODES is set to Y. The GEOCODE_LEVEL4 file is comma delimited as shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D . This file should not include any descriptions that have the pipe symbol (|), single quotes, or double quotes. It is okay to include dashes, slashes, semicolons, colons, commas, and periods in descriptions. The format of the GEOCODE_LEVEL4 file is shown in Table 6.90, \u201CFile Format for GEOCODE_LEVEL4 \u201D ."
  GEOMASK:
    default: ''
    description: (File) Gridded, time-independent file that assigns a 1 to any grid cell whose emissions you want to adjust. The emissions from INFILE in grid cells that have a 1 in GEOMASK are multiplied by the factor provided in SPECFACS . All other emissions and grid cells are untouched.
  GRIDDESC:
    default: none
    description: Sets the name of the output grid whose parameters will be read from the file.
  HIGH_RWC_TEMP_THRESHOLD:
    default: '80.0'
    description: Define the higher-end ambient temperature threshold in Fahrenheit that can occur recreational RWC emissions from recreational wood burning; firepits, chimineas, and other recreational RWC emission sources
  INFILE:
    default: ''
    description: (File) Input gridded emissions file
  INLN:
    default: ''
    description: (File) CMAQ-ready Inline 2-D ridded emissions file, output by Smkmerge
  IN_EMIS:
    default: ''
    description: (File) List of SA-ready gridded hourly emissions input files
  IN_REPORT:
    default: ''
    description: (File) List of SA-ready summary report files that holds the details of original mapping between inventory source characteristics and SA group ID
  IN_SRCS:
    default: ''
    description: (File) List of stack group input files that hold SA-ready stack parameters by original SA group ID
  IOAPI_GRIDNAME_1:
    default: none
    description: Sets the name of the output grid whose parameters will be read from the GRIDDESC file.
  LAYER_FRACTION:
    default: ''
    description: (File) File that lists the layer top and bottom heights in meter(s) along with a percentage factor. For example, the following LAYER_FRACTION file sample would distribute 2-D emissions into multiple model layers based upon five user-defined layers. No., Bottom Ht(m), Top Ht(m), Fraction 1, 0, 100, 0.60 2, 100, 200, 0.20 3, 200, 400, 0.10 4, 400, 600, 0.07 5, 600, 1000, 0.03
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Gentpro
  LOW_RWC_TEMP_THRESHOLD:
    default: '50.0'
    description: Define the lower-end ambient temperature threshold in Fahrenheit that can occur recreational RWC emissions from recreational wood burning; firepits, chimineas, and other recreational RWC emission sources
  MASKFRAC:
    default: N
    description: 'Indicating whether fractional mask value is considered ''Y'': include grid cells with fractional mask value greater than 0 into masked region. In this case, the fractional mask values will be applied as scale factors for all SPECFACS species rather than using species-specific scale factors defined in SPECFACS file ''N'': only consider grid cells with mask value equal 1.0 as masked region.'
  MASKVAR:
    default: MASK
    description: Name of variable in GEOMASK indicating the masked region If not specified, Geofac will assume the default variable MASK as indicator for masked region in GEOMASK.
  MAX_CEM_UNITS:
    default: none
    description: Maximum number of CEM units in input data; this value can usually be based on the number of sources in the annual inventory
  MBINV:
    default: ''
    description: "(File) Mobile-source activity and emissions. 6.2.5.1. ORL Format 6.2.5.2. FF10 Activity Inventory Format The MBINV file is the input mobile-source inventory data file. Two formats are available: one for activity data in FF10 format and one for emissions data in ORL format. 6.2.5.1. ORL Format The ORL format is list-directed and uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records are shown below: #ORL #TYPE Mobile Source Toxics Inventory #COUNTRY US #YEAR 1999 #DESC Draft 1999 version 2.0 The format for the data records is shown in Table 6.18, \u201CORL Format for MBINV \u201D . Table 6.18. ORL Format for MBINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 SCC Char(20) Source Classification Code (required) 3 POLID Char(16) Pollutant CAS number or other name (required; this is called the pollutant code in the NIF) 4 ANN_EMIS Real Annual emissions (short tons/year) (required) 5 AVD_EMIS\
      \ Real Average-day emissions (short tons/average day) (optional) 6 SRCTYPE Char(2) Source type; used by SMOKE in determining applicable MACT-based controls (required) 01 = major 02 = Section 12 area source 03 = nonroad 04 = onroad 7 DATA_SOURCE Char Flag indicating the source of the data (e.g., state submitted or EPA-computed) (optional; not currently used by SMOKE) 8 YEAR Char Year of the emissions (optional; not currently used by SMOKE) 9 TRIBAL_CODE Char(3) Indicates the particular tribe that submitted the data (optional; recommended) 10 CEFF Real Control Efficiency percentage (give value of 0-100) (optional; not currently used by SMOKE) 11 REFF Real Rule Effectiveness percentage (give value of 0-100) (optional; not currently used by SMOKE) 12 RPEN Real Rule Penetration percentage (give value of 0-100) (optional; not currently used by SMOKE) 13 CONTROL_MEASURES Char An & delimited list of control measure abbreviations (optional; not currently used by SMOKE) 14 PCT_REDUCTION Char\
      \ An & delimited list of percent reductions for the applied control measures (optional; not currently used by SMOKE) 15 CURRENT_COST Char The cost of the most recently applied control strategy for this source (optional; not currently used by SMOKE) 16 CUMULATIVE_COST Char The cumulative cost for all applied control measures (optional; not currently used by SMOKE) 6.2.5.2. FF10 Activity Inventory Format The FF10 format is list-directed and uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records are shown below: #FORMAT FF10_Activity #COUNTRY US #YEAR 2008 #DESC Annual Mobile Source Source Inventory #DESC FF10 The format for the data records is shown in Table 6.19, \u201CFF10 Format for MBINV \u201D . Table 6.19. FF10 Format for MBINV Position Name Type Required? Description 1 COUNTRY Char(3) Y Country code; default to \"US\" 2 REGION_CD Char(5) Y Region code for state and county (a.k.a. FIPS code) 3 TRIBAL CODE Char(3) N Indicates the particular\
      \ tribe that submitted the data (optional; not currently used by SMOKE) 4 CENSUS_TRACT Char(20) N Not currently used by SMOKE 5 SHAPE_ID Char(20) Char Shape Identification (optional; recommended) 6 SCC Char(20) Y SCC 7 ACT_PARM_TYPE Char(10) N Not currently used by SMOKE 8 ACT_PARM_UOFMSR Char(20) N 9 ACTIVITY_TYPE Char(16) Y Activity variable names are VMT, VPOP, and SPEED 10 ANN_PARM_VALUE Real Y Annual activity values in unit of miles/yr for annual VMT and miles/hr for SPEED 11 CALC_YEAR Int N Year of inventory 12 DATE_UPDATED Int N Updated Date in fomrat of YYYYMMDD 13 DATA_SET_ID Int N Not currently used by SMOKE 14 JAN_VALUE Real N Filled in only if data were provided for January in unit of miles/month for VMT and miles/hr for SPEED ... ... ... ... ... 27 DEC_VALUE Real N Filled in only if data were provided for December in unit of miles/month for VMT and miles/hr for SPEED 28 COMMENT Char N Optional; not currently used by SMOKE"
  METFILE1:
    default: none
    description: Sets the names of the variables that will be read from and METFILE2 . Each variable must occur in exactly one of the meteorology files, i.e. the same variable cannot be in both files.
  METFILE2:
    default: none
    description: Sets the names of the variables that will be read from METFILE1 and . Each variable must occur in exactly one of the meteorology files, i.e. the same variable cannot be in both files.
  METLIST:
    default: ''
    description: "(File) List of meteorology files. The METLIST file is used to provide the file names of available meteorology files to the Met4moves programs. Met4moves runs once for the entire modeling episode, and therefore needs all of the files at one time. The meteorology files provided to Met4moves must cover the desired episode and contain the requested variables. In the example SMOKE scripts, this file is generated automatically. The format of this file is shown in Table 6.55, \u201CFormat for METLIST \u201D ."
  MET_CRO_2D:
    default: TA
    description: Sets the name of the temperature variable that will be read from the MET_CRO_3D input file. Acceptable values for MCIP and MPCL outputs available at the time of this writing are TA (ambient layer-1 temperature from the MET_CRO_3D file), TEMP10 (10-meter temperature from the file), TGD (ground temperature), TGRND (ground temperature), and TEMP1P5 (1.5-meter temperature). Current guidance from EPA suggests that a 10- to 20-meter temperature is the best choice for the temperature input to BEIS3, to account for the fact that these models do not include a canopy model.
  MET_CRO_3D:
    default: ''
    description: "(File) Meteorology file contains a variable \u201C ZF \u201D which is full-layer height above ground (m)"
  MGTS_L:
    default: ''
    description: (File) SMOKE 2-D gridded, mole-speciated, hourly emissions file.
  N_S_HEMI:
    default: NORTH
    description: 'Sets the program to run for the Northern or Southern Hemisphere. Acceptable values for this setting are: NORTH: Northern Hemisphere. Program starts July 1 and scans data in reverse chronological order to find the last freeze date and in chronological order to find the first freeze date. SOUTH: Southern Hemisphere. Program starts January 1 and scans data in chronological order to find the first freeze date. It also starts December 31 and scans the data in reverse chronological order to find the last freeze date.'
  OUTFILE:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Summary: Final, model-ready file created from two or more souce categories. See Section 8.6, \u201C Smkmerge \u201D for file format."
  OUTFILENN:
    default: ''
    description: (File) One or more inventory files in the same inventory format input by the ARINV , MBINV , or PTINV input file for a given program run. The actual logical file name of these files is OUTFILE01 , OUTFILE02 , OUTFILE03 , ... OUTFILEnn , where nn = the largest number in the second column of the SPLITS file. The output file names are not necessarily sequential, depending on whether or not sequential numbers are used in the second column of the splits file.
  OUT_EMIS:
    default: ''
    description: (File) SA-ready gridded hourly emissions files with new SA group ID
  OUT_SRCS:
    default: ''
    description: (File) SA-ready stack group files with new SA group ID
  PGTS_L:
    default: ''
    description: (File) SMOKE 2-D gridded, mole-speciated, hourly emissions file.
  PREFIX_TPRO:
    default: blank
    description: Define the prefix name (up to 3 characters) for the temporal profiles generated by Gentpro
  PROFILE_METHOD:
    default: MET
    description: Indicates which of the three temporal profile types
  PTINV:
    default: ''
    description: "(File) Point source annual or average day emissions. 6.2.8.1. FF10 Format 6.2.8.2. ORL Format 6.2.8.3. ORL FIRE Format The PTINV file is the input point source inventory file for annual and average-day data. This file can be in FF10, ORL, or ORL FIRE format. 6.2.8.1. FF10 Format The user specifies the data provided using this command in the header: FF10_POINT. This FF10 format uses the header described in Section 6.2.1.4, \u201CHeader records\u201D . Sample header records for daily point sources are shown below: #FORMAT FF10_POINT #COUNTRY US #YEAR 2005 #DESC Point Source Inventory #DESC FF10 Point format Table 6.26. FF10 Format for PTINV Position Name Type Description 1 COUNTRY Char(3) Country code; default to \"US\" (required) 2 REGION_CD Char(5) Region code for state and county (a.k.a. FIPS code; required) 3 TRIBAL CODE Char(3) Three-digit Tribal code (optional; recommended) 4 FACILITY_ID Char(20) Facility Identification Code (required; same as Plant ID in the ORL format)\
      \ 5 UNIT_ID Char(20) Unit Identification Code (required; same as the Point ID in the ORL format) (required) 6 REL_POINT_ID Char(20) Release Point Identification Code (recommended; same as the Stack ID in the ORL format) 7 PROCESS_ID Char(20) Process Identification Code (recommended; same as the Segement ID in the ORL format) 8 AGY_FACILITY_ID Char Facility ID submitted by responsible agency (optional; not currently used by SMOKE) 9 AGY_UNIT_ID Char Unit ID submitted by responsible agency (optional; not currently used by SMOKE) 10 AGY_REL_POINT_ID Char Release Point ID submitted by responsible agency (optional; not currently used by SMOKE) 11 AGY_PROCESS_ID Char Process ID submitted by responsible agency (optional; not currently used by SMOKE) 12 SCC Char(20) Source Classification Code (required) 13 POLID Char(16) Pollutant Code (required) 14 ANN_VALUE Real Annual Emissions (short tons/year) (required if SMKINVEN_MONTH is set to 0) 15 ANN_PCT_RED Real Percentage Control Measure Reduction\
      \ Efficiency (optional) 16 FACILITY_NAME Char(40) Plant Name (required; example \"Power Plant\", note: use double quote around the name) 17 ERPTYPE Char(2) Emissions release point type (01 = fugitive, 02 = vertical stack, 03 = horizontal stack..) (optional; recommended) 18 STKHGT Real Stack Height (ft) (required; values <= 0 are treated as missing) 19 STKDIAM Real Stack Diameter (ft) (required; values <= 0 are treated as missing) 20 STKTEMP Real Stack Gas Exit Temperature (\xB0F) (required; values <= 0 are treated as missing) 21 STKFLOW Real Stack Gas Flow Rate (ft3/sec) (optional; automatically calculated by Smkinven from velocity and diameter if not given in file) 22 STKVEL Real Stack Gas Exit Velocity (ft/sec) (required; values <= 0 are treated as missing) 23 NAICS Char(6) North American Industrial Classification System Code (optional) 24 LONGITUDE Real Longitude (decimal degrees) (required) 25 LATITUDE Real Latitude (decimal degrees) (required) 26 LL_DATUM Char(3) 001=NAD27, 002=NAD83,\
      \ 003=WGS84 (optional; not currently used by SMOKE) 27 HORIZ_COLL_MTHD Char Flag indicating how NEI defaulted locations (optional; not currently used by SMOKE) 28 DESIGN_CAPACITY Real Unit Design Capacity (optional; not currently used by SMOKE) 29 DESIGN_CAPACITY_UNITS Char Unit Design Capacity Units (optional; not currently used by SMOKE) 30 REG_CODES Char Regulatory Code (optional; not currently used by SMOKE) 31 FAC_SOURCE_TYPE Real Facility source type (optional; not currently used by SMOKE) 32 UNIT_TYPE_CODE Real Unit type code (optional; not currently used by SMOKE) 33 CONTROL_IDS Char Control Measure Code (optional; not currently used by SMOKE) 34 CONTROL_MEASURES Char Control Measure Values (optional; not currently used by SMOKE) 35 CURRENT_COST Real Control Cost (optional; not currently used by SMOKE) 36 CUMULATIVE_COST Real Cumulative Cost (optional; not currently used by SMOKE) 37 PROJECTION_FACTOR Real Projection factor (optional; not currently used by SMOKE) 38 SUBMITTER_FAC_ID\
      \ Char(15) Primary Facility ID (optional; not currently used by SMOKE) 39 CALC_METHOD Int Emission Calculation Method Code (optional; not currently used by SMOKE) 40 DATA_SET_ID Int Data Set Identifier (optional; not currently used by SMOKE) 41 FACIL_CATEGORY_CODE Char Facility Site Identifier (optional; not currently used by SMOKE) 42 ORIS_FACILITY_CODE Char DOE Plant ID (generally recommended, and required if matching to hour-specific CEM data) 43 ORIS_BOILER_ID Char Boiler Identification Code (recommended) 44 IPM_YN Char Y if point source belongs to IPM Sector (optional; not currently used by SMOKE) 45 CALC_YEAR Int Year used to represent emissions (optional; not currently used by SMOKE) 46 DATE_UPDATED Int Last updated date of emissions table (optional; not currently used by SMOKE) 47 FUG_HEIGHT Real Fugitive Height (optional; recommended) 48 FUG_WIDTH_XDIM Real Fugitive Width (optional; recommended) 49 FUG_LENGTH_YDIM Real Fugitive Length (optional; recommended) 50 FUG_ANGLE Real\
      \ Fugitive Angle (optional; recommended) 51 ZIPCODE Int Location Address Postal Code (optional; not currently used by SMOKE) 52 ANNUAL_AVG_HOURS_PER_YEAR Int Annual Average Hours of Operation per Year (optional; not currently used by SMOKE) 53 JAN_VALUE Real Filled in only if data were provided for January in unit of short tons/month (required if SMKINVEN_MONTH is set to 1) ... ... ... ... 64 DEC_VALUE Real Filled in only if data were provided for December in unit of short tons/month (required if SMKINVEN_MONTH is set to 12) 65 JAN_PCTRED Real Month-specific percent reduction. Filled in only if data were provided for January in unit of % (optional; not currently used by SMOKE) ... ... ... ... 76 DEC_PCTRED Real Month-specific percent reduction. Filled in only if data were provided for December in unit of % (optional; not currently used by SMOKE) 77 COMMENT Char Optional; not currently used by SMOKE 6.2.8.2. ORL Format The ORL format is list-directed and uses the header described in\
      \ Section 6.2.1.4, \u201CHeader records\u201D . Sample header records are shown below: #ORL POINT #TYPE Point Source Toxics Inventory #COUNTRY US #YEAR 1999 #DESC Alabama 1999 The format for the data records is shown in Table 6.27, \u201CORL Format for PTINV \u201D . Table 6.27. ORL Format for PTINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 PLANTID Char(20) Plant Identification Code (required; same as the Facility Identifier in the FF10 format) 3 POINTID Char(20) Point Identification Code (required; same as the Unit ID in the FF10 format) 4 STACKID Char(20) Stack Identification Code (recommended; same as the Release Point ID in the FF10 format) 5 SEGMENT Char(20) Segment ID (a.k.a DOE Plant ID) (recommended; same as the Process ID in the FF10 format) 6 PLANT Char(40) Plant Name (recommended; example \"Power Plant\", note: use double quote around the name) 7 SCC Char(20) Source Classification Code (required) 8 ERPTYPE Char(2) Emissions\
      \ release point type; indicates type of stack (optional; recommended) 01 = fugitive 02 = vertical stack 03 = horizontal stack 04 = goose neck 05 = vertical with rain cap 06 = downward-facing vent 9 SRCTYPE Char(2) Source type; used by SMOKE in determining applicable MACT-based controls (required) 01 = major 02 = Section 12 area source 03 = nonroad 04 = onroad 10 STKHGT Real Stack Height (ft) (required) 11 STKDIAM Real Stack Diameter (ft) (required) 12 STKTEMP Real Stack Gas Exit Temperature (\xB0F) (required) 13 STKFLOW Real Stack Gas Flow Rate (ft 3 /sec) (optional; automatically calculated by Smkinven from velocity and diameter if not given in file) 14 STKVEL Real Stack Gas Exit Velocity (ft/sec) (required) 15 SIC Char(20) Standard Industrial Classification Code (recommended) 16 MACT Char(6) Maximum Available Control Technology Code (optional) 17 NAICS Char(6) North American Industrial Classification System Code (optional) 18 CTYPE Char(1) Coordinate system type (required) U = Universal\
      \ Transverse Mercator L = Latitude/longitude 19 XLOC Real X location (required) If CTYPE = U, Easting value (meters) If CTYPE = L, Longitude (decimal degrees) 20 YLOC Real Y location (required) If CTYPE = U, Northing value (meters) If CTYPE = L, Latitude (decimal degrees) 21 UTMZ Int UTM zone (required if CTYPE = U) 22 CAS Char(16) Pollutant CAS number or other code (required; this is called the pollutant code in the NIF) 23 ANN_EMIS Real Annual Emissions (short tons/year) (required) 24 AVD_EMIS Real Average-day Emissions (short tons/average day) (optional) 25 CEFF Real Control Efficiency percentage (give value of 0-100) (recommended, if left blank, SMOKE default is 0) 26 REFF Real Rule Effectiveness percentage (give value of 0-100) (recommended, if left blank, SMOKE default is 100) 27 CPRI Int Primary Control Equipment Code (not used by SMOKE) 28 CSEC Int Secondary Control Equipment Code (not used by SMOKE) 29 NEI_UNIQUE_ID Char Unique ID that ties together HAP and CAP emissions within\
      \ a common facility ID and also ties together emissions obtained from muptiple data sources which may have different State facility identifiers but really belong to a single facility (optional; not currently used by SMOKE) 30 ORIS_FACILITY_CODE Char DOE Plant ID (generally recommended, and required if matching to hour-specific CEM data) 31 ORIS_BOILER_ID Char Boiler Identification Code (recommended) 32 IPM_YN Char Y or N character flag indicating whether the point source belongs in the IPM sector or not (optional; not currently used by SMOKE) 33 DATA_SOURCE Char Flag indicating the source of the data (e.g., state submitted or EPA-computed) (optional; not currently used by SMOKE) 34 STACK_DEFAULT_FLAG Char Flag indicating how NEI defaulted the stack parameters (optional; not currently used by SMOKE) 35 LOCATION_DEFAULT_FLAG Char Flag indicating how NEI defaulted locations (optional; not currently used by SMOKE) 36 YEAR Char Year of the emissions (optional; not currently used by SMOKE)\
      \ 37 TRIBAL_CODE Char(3) Indicates the particular tribe that submitted the data (optional; recommended) 38 HORIZONTAL_AREA_FUGITIVE Real Related to AXLEN and AYLEN which are optional parameters for ISCST3/AERMOD (optional; not currently used by SMOKE) 39 RELEASE_HEIGHT_FUGITIVE Real Related to optional parameters for ISCST3/AERMOD (optional; not currently used by SMOKE) 40 ZIPCODE Real(14) Postal zip code (optional; not currently used by SMOKE) 41 NAICS_FLAG Real NAICS flag (optional; not currently used by SMOKE) 42 SIC_FLAG Real SIC flag (optional; not currently used by SMOKE) 43 MACT_FLAG Char(15) MACT flag indicating the relationship of the MACT rule and the particular source (optional; not currently used by SMOKE) 44 PROCESS_MACT_COMPLIANCE_STATUS Char Indicate the relationship of the MACT rule and the particular source (optional; not currently used by SMOKE) 45 IPM_FACILITY Char Integrated Planning Model (IPM) facility (optional; not currently used by SMOKE) 46 IPM_UNIT Char IPM\
      \ unit (optional; not currently used by SMOKE) 47 BART_SOURCE Char Best Available Retrofit Technology (BART) source (optional; not currently used by SMOKE) 48 BART_UNIT Char BART unit (optional; not currently used by SMOKE) 49 CONTROL_STATUS Char Control status (optional; not currently used by SMOKE) 50 START_DATE Char(8) Indicates originally-reported start date prior to annualizing emissions, which may be used for building temporal profiles for specific sources (optional; not currently used by SMOKE) 51 END_DATE Char(8) Indicates originally-reported end date prior to annualizing emissions, which may be used for building temporal profiles for specific sources (optional; not currently used by SMOKE) 52 WINTER_THROUGHPUT_PCT Real Percentage throughout in winter (optional; not currently used by SMOKE) 53 SPRING_THROUGHPUT_PCT Real Percentage throughout in spring (optional; not currently used by SMOKE) 54 SUMMER_THROUGHPUT_PCT Real Percentage throughout in summer(optional; not currently\
      \ used by SMOKE) 55 FALL_THROUGHPUT_PCT Real Percentage throughout in fall (optional; not currently used by SMOKE) 56 ANNUAL_AVG_DAYS_PER_WEEK Real Annual average days of operation per week (optional; not currently used by SMOKE) 57 ANNUAL_AVG_WEEKS_PER_YEAR Real Annual average weeks of operation per year (optional; not currently used by SMOKE) 58 ANNUAL_AVG_HOURS_PER_DAY Real Annual average hours of operation per day (optional; not currently used by SMOKE) 59 ANNUAL_AVG_HOURS_PER_YEAR Real Annual average hours of operation per year (optional; not currently used by SMOKE) 60 PERIOD_DAYS_PER_WEEK Real Days per week operating during the period (optional; not currently used by SMOKE) 61 PERIOD_WEEKS_PER_PERIOD Real Weeks per period operating during the period (optional; not currently used by SMOKE) 62 PERIOD_HOURS_PER_DAY Real Hours of operation per day during the period (optional; not currently used by SMOKE) 63 PERIOD_HOURS_PER_PERIOD Real Hours of operation per period during the period\
      \ (optional; not currently used by SMOKE) 64 DESIGN_CAPACITY Real Indicate the design capacity for the source (optional; not currently used by SMOKE) 65 DESIGN_CAPACITY_UNIT_NUMERATOR Real Indicate the numerator for the units of the design capacity (optional; not currently used by SMOKE) 66 DESIGN_CAPACITY_UNIT_DENOMINATOR Real Indicate the denumerator for the units of the design capacity (optional; not currently used by SMOKE) 67 CONTROL_MEASURES Char An & delimited list of control measure abbreviations (optional; not currently used by SMOKE) 68 PCT_REDUCTION Char An & delimited list of percent reductions for the applied control measures (optional; not currently used by SMOKE) 69 CURRENT_COST Char The cost of the most recently applied control strategy for this source (optional; not currently used by SMOKE) 70 CUMULATIVE_COST Char The cumulative cost for all applied control measures (optional; not currently used by SMOKE) 6.2.8.3. ORL FIRE Format The ORL inventory file for fires (\
      \ #ORL FIRE ) is one of the required input files to provide wildfire and prescribed fire data that are being treated as point sources to SMOKE. This file includes the fire characteristics, such as country/state/county code, fire identification, fire name, location identification, location coordinates, SCC (flaming or smoldering), material burned, vegetation types and heat content. Some of characteristics that are common to this master (annual) inventory file PTINV and the day-specific inventory file PTDAY shown in Section 6.2.6.2, \u201CORL FIREEMIS Emission Format\u201D need to match exactly by country/state/county code, fire ID, location ID, location coordinates, and SCC. NOTE: Although inventory pollutants are not listed, user needs to list all inventory pollutant names available from the day-specific inventory file PTDAY using a header record #DATA . Sample header records are shown below: #ORL FIRE #TYPE Point Source Inventory for FIRES #COUNTRY US #YEAR 2002 #DATA FUEL_LOAD ACRESBURNED\
      \ CO NOX SO2 PM10 PM2_5 VOC 16990 10883 #DESC FIPS,FIREID,LOCID,SCC,NAME,LAT,LON,NFDRSCODE,MATBURNED,HEATCONTENT The format for the data records is shown in Table 6.28, \u201CORL FIRE Format for PTINV \u201D . Table 6.28. ORL FIRE Format for PTINV Position Name Type Description 1 FIPS Char(5) FIPS code for state and county (required) 2 FIREID Char(15) Fire Identification Code (required) 3 LOCID Char(15) Location Identification Code (required) 4 SCC Char(20) Source Classification Code (required) 5 FIRENAME Char(40) Fire name (recommended) 6 LAT Real Latitude associated with FIREID/LOCID 7 LON Real Longitude associated with FIREID/LOCID 8 NFDRSCODE Char(2) Code for the National Fire Danger Rating System (NFDRS) (recommended) 9 MATBURNED Int Code for the material burned 10 DATA_VALUE Real Value of fire heat content (BTU/lb)"
  RECREATIONAL_RWC_TPRO_YN:
