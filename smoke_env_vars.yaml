  STDATE:
    default: '0'
    description: Defines the first day of year (January 1st) for a proper temporal profile calculation. MCIP file must cover first hour of January 1st of all counties in modeling output time zone (i.e., GMT).
  SUM_RAW_OUTPUT_YN:
    default: N
    description: Define whether Gentpro outputs total raw meteorology variables (e.g., temperature; wind speed; etc) or not
  TEMP_VAR:
    default: blank
    description: Must define the name of variable for the all PROFILE_METHOD settings to use in the profile calculations. The program looks for the selected meteorology variables first in the METLIST file (set below) that contains a list of Metcombine program output files or MET files that contain targeted variables from the MET_CRO_3D or/and MET_CRO_2D files. If it doesn't find the variable(s) in either file, it stops with an error.
  TMPR_VAR:
    default: TA
    description: Sets the name of the temperature variable that will be read from the MET_CRO_3D input file. Acceptable values for MCIP and MPCL outputs available at the time of this writing are TA (ambient layer-1 temperature from the MET_CRO_3D file), TEMP10 (10-meter temperature from the MET_CRO_2D file), TGD (ground temperature), TGRND (ground temperature), and TEMP1P5 (1.5-meter temperature). Current guidance from EPA suggests that a 10- to 20-meter temperature is the best choice for the temperature input to BEIS3, to account for the fact that these models do not include a canopy model.
  TPRO_DAY:
