mrggrid:
  ADJ_FACS:
    default: ''
    description: (File) File that lists the species name, the logical file name, and the factor to be applied to all grid cells. The species name must be in columns A, the logical file name in column B, and the factor in columns C. SMOKE will ignore the case of the text, treating lower- and uppercase characters as if they were the same. For example, the following ADJ_FACS file sample would multiply NO emissions from the MGTS_L file by 1.3 (30% increase) and multiply PAR from the PGTS_L file by 0.6 (40% decrease). NO, MGTS_L, 1.3 PAR, PGTS_L, 0.6
  FILELIST:
    default: ''
    description: "(File) Gridded merge 2-D file list. The FILELIST file is used to provide a list of logical file names to the Mrggrid program. This list should contain the logical file names for all 2- or 3-D files to be merged in a given run. It is a very simple file, and has no limit to the number of files listed. Note that unlike most list files used in SMOKE, FILELIST requires a list of logical file names, not the actual file name. The format of the FILELIST file is shown in Table 6.53, \u201CFormat for FILELIST \u201D ."
  G_RUNLEN:
    default: N
    description: 'This environment variable allows Mrggrid to merge files with data from different days. Y: Allow data from different dates to be merged together Mrggrid will use the environment variables G_STDATE , G_STTIME , , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrggrid will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_STDATE:
    default: N
    description: 'This environment variable allows Mrggrid to merge files with data from different days. Y: Allow data from different dates to be merged together Mrggrid will use the environment variables , G_STTIME , G_RUNLEN , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrggrid will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_STTIME:
    default: N
    description: 'This environment variable allows Mrggrid to merge files with data from different days. Y: Allow data from different dates to be merged together Mrggrid will use the environment variables G_STDATE , , G_RUNLEN , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrggrid will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  G_TSTEP:
    default: N
    description: 'This environment variable allows Mrggrid to merge files with data from different days. Y: Allow data from different dates to be merged together Mrggrid will use the environment variables G_STDATE , G_STTIME , G_RUNLEN , and to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrggrid will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  LOGFILE:
    default: ''
    description: (File) Log generated from executing Mrggrid
  MRG_DIFF_DAYS:
    default: N
    description: 'This environment variable allows Mrggrid to merge files with data from different days. Y: Allow data from different dates to be merged together Mrggrid will use the environment variables G_STDATE , G_STTIME , G_RUNLEN , and G_TSTEP to set the start date, start time, length, and time step of the output file. All input files must have the same starting time as G_STTIME , the same time step as G_TSTEP , and must contain more than G_RUNLEN steps of data. For each input file, if it contains data to cover the actual episode requested by G_STDATE , G_STTIME , and G_RUNLEN , then the data for the actual episode will be used; otherwise, data starting at the first time step of the file will be used. N: Require all merged data to be from the same date Mrggrid will determine the output file time period based on the latest starting input file and the earliest ending input file.'
  OUTFILE:
    default: ''
    description: "(File) Type: I/O API NetCDF - adapted gridded format Summary: Final, model-ready file created from two or more souce categories. See Section 8.6, \u201C Smkmerge \u201D for file format."
  REPMERGE_SUM:
    default: ''
    description: (File) Report file generated when ADJ_FACS is set; the report lists the date, the species name, a daily total of species over all the logical files before and after applying adjustment factors, and the ratio (after/ratio). The report only lists when the ratio is not equal to 1.0
  REPMERGE_TAG:
    default: ''
    description: (File) Report file generated when TAG_SPECIES is set; the report lists the logical files name, species name before and after appending the tag
  REPMERG_ADJ:
    default: ''
    description: (File) Report file generated when ADJ_FACS is set; the report lists the date, the logical file name, the species name, the factor applied, a daily total of species before and after applying adjustment factor, and the ratio (after/ratio). The report only lists when the ratio is not equal to 1.0
  REPMRGGRID:
    default: ''
    description: (File) Report file generated when MRG_DIFF_DAYS is set to Y; the report lists the date and time for each output time step along with the actual date and time of the data read from each file
  TAG_SPECIES:
    default: ''
    description: (File) File that lists the logical file name, the species name, and the tag name to be appended. The logical file name in column B, the species name must be in columns B, and the factor in columns C. SMOKE will ignore the case of the text, treating lower- and uppercase characters as if they were the same. For example, the following TAG_SPECIES file sample would append a tag (t1) to the NO species from the MGTS_L file and append a tag (t3) to the PAR from the PGTS_L file. MGTS_L, NO, t1 PGTS_L, PAR, t3
