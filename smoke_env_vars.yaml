  RWC_COUNTY_TEMP:
    default: N
    description: Allows the user to determine county-specific minimum temperature for RWC estimate equations. It will override default minimum temperature [ DEFAULT_TEMP_RWC ] listed above.
  RWC_COUNTY_TEMP (OPTIONAL):
    default: ''
    description: "(File) County-specific minimum temperature for RWC equations (see Section 6.10.9, \u201C RWC_COUNTY_TEMP : County-specific temperature threshold in Fahrenheit for Residential Wood Combustion (RWC) Emission Sources\u201D )"
  RWC_COUNTY_TEMP_YN:
    default: N
    description: Allows the user to determine county-specific minimum temperature for RWC estimate equations. It will override default minimum temperature [ DEFAULT_TEMP_RWC ] listed above.
  RWC_EQ_ALT_YN:
    default: Y
    description: Allows the user to choose the alternative RWC equation listed above to avoid negative RWC emissions.
  SCC_LIST:
    default: blank
    description: 'Defines a comma-separated list of SCCs that will use the temporal profiles generated by Gentpro , example: setenv SCC_LIST "2104008000,2104008001,2104008002"'
  SLOPE:
    default: '0.79'
    description: Define the value of the slope of RWC equation
  SMK2EMIS_VMAP_YN:
    default: N
    description: "Controls whether the name remapping file will be read in, to cause Smk2emis to output different variable names than are in the input file. This is needed for using UAM-AERO, which requires symbols in the variable names (such as \u201C . \u201D, \u201C + \u201D, and \u201C - \u201D) that are not permitted in I/O API file variable names. Y: Use the VNAMMAP file N: Do not use the VNAMMAP file"
  SMK_SOURCE:
    default: none
    description: "Defines the type of sources to be processed. Valid values are: A: Area sources B: Biogenic sources M: On-road mobile sources P: Point sources E: All emissions sources (determined by how Smkmerge was run) In Smk2emis , this variable controls the name of the input NetCDF logical file and the name of the output binary logical file. Unlike in most other SMOKE programs, for this program SMK_SOURCE can be set to \u201C E \u201D to indicate that the \u201C every \u201D source category merged file ( EGTS_L ) should be converted from I/O API to Fortran-binary format."
  SPECFACS:
    default: ''
    description: (File) File that lists the species name and the factor to be applied to all grid cells with a 1 value in the GEOMASK file. The species name must be in columns 1-16 and the factor in columns 17-22. For example, the following SPECFACS file sample would multiply NO and NO 2 emissions by 1.3 (30% increase) and multiply PAR by 0.6 (40% decrease). NO 1.3 NO2 1.3 PAR 0.6
  SPLITS:
    default: ''
    description: (File) Space-delimited file that lists the state codes and indicates which output file should include the emissions for that state. The first column is for the state codes and the second column is the output file number. In this example, states 1 and 4 will be written to the OUTFILE01 output file logical name, state 37 to OUTFILE02 , and state 45 to OUTFILE03 . The numbers in the second column need not be sequential. 01 1 04 1 37 2 45 3
  SRGDESC:
    default: none
    description: Directory path and name of the spatial surrogate file for computing averaged meteorology.
  SRGPRO_PATH:
    default: blank
    description: Defines the location of spatial surrogate files
  SRG_LIST:
    default: '0'
    description: Defines a comma-separated list of SCCs that will use the temporal profiles generated by Gentpro , example setenv SRG_LIST "340,100"
  STACK_GROUPS:
    default: ''
